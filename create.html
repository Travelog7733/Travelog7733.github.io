<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Create Itinerary | Travelog</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',sans-serif;}
body{
  min-height:100vh;
  background:linear-gradient(135deg,#7dd3fc,#38bdf8,#0ea5e9);
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
}
.container{
  background:#fff;
  width:100%;
  max-width:800px;
  border-radius:16px;
  padding:25px;
  box-shadow:0 10px 25px rgba(0,0,0,0.2);
}
h2{text-align:center;margin-bottom:20px;color:#0f172a;}
.form-group{margin-bottom:15px;}
label{display:block;font-weight:600;margin-bottom:6px;color:#0f172a;}
input, textarea{
  width:100%;padding:12px 14px;border-radius:8px;border:1px solid #cbd5e1;font-size:14px;outline:none;
}
textarea{resize:vertical;}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:15px;}
button{
  padding:12px 18px;border:none;border-radius:10px;cursor:pointer;font-weight:600;font-size:14px;
}
.btn-ai{background:#22c55e;color:#022c22;}
.btn-create{background:#6366f1;color:#fff;}
button:hover{opacity:0.9;}
</style>
</head>
<body>

<div class="container">
  <h2>Create New Itinerary</h2>

  <div class="form-group">
    <label>Customer Name</label>
    <input type="text" id="customerName" placeholder="Enter customer name">
  </div>

  <div class="form-group">
    <label>Created By</label>
    <input type="text" id="createdBy" placeholder="Employee name">
  </div>

  <div class="form-group">
    <label>Itinerary Start Date</label>
    <input type="date" id="startDate">
  </div>

  <div class="form-group">
    <label>Itinerary End Date</label>
    <input type="date" id="endDate">
  </div>

  <div class="form-group">
    <label>Destination</label>
    <input type="text" id="destination" placeholder="e.g. Vietnam, Thailand, Dubai">
  </div>

  <div class="form-group">
    <label>Description</label>
    <textarea id="description" rows="7" placeholder="Click 'Generate with AI' or write manually..."></textarea>
  </div>

  <div class="actions">
    <button class="btn-ai" onclick="generateDescription()">✨ Generate with AI</button>
    <button class="btn-create" onclick="createItinerary()">📄 Create Itinerary</button>
  </div>
</div>

<script>
const API_KEY = "PASTE_YOUR_NEW_API_KEY_HERE"; // ⚠️ Use your NEW key

async function generateDescription(){
  const destination = document.getElementById("destination").value;
  const startDate = document.getElementById("startDate").value;
  const endDate = document.getElementById("endDate").value;

  if(!destination){
    alert("Please enter destination first!");
    return;
  }

  const prompt = `Write a professional, attractive travel itinerary description for a trip to ${destination} from ${startDate} to ${endDate}.`;

  try{
    const res = await fetch(
      "https://generativelanguage.googleapis.com/v1beta/models/gemini-pro:generateContent?key=" + API_KEY,
      {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          contents: [{ parts: [{ text: prompt }] }]
        })
      }
    );

    const data = await res.json();
    const text = data.candidates?.[0]?.content?.parts?.[0]?.text || "Could not generate description.";
    document.getElementById("description").value = text;
  }catch(err){
    console.error(err);
    alert("Error generating description.");
  }
}

function createItinerary(){
  const itinerary = {
    customerName: document.getElementById("customerName").value,
    createdBy: document.getElementById("createdBy").value,
    startDate: document.getElementById("startDate").value,
    endDate: document.getElementById("endDate").value,
    destination: document.getElementById("destination").value,
    description: document.getElementById("description").value
  };

  localStorage.setItem("currentItinerary", JSON.stringify(itinerary));
  window.location.href = "view.html";
}
</script>

</body>
</html>
