<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Create Itinerary | Travelog</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',sans-serif;}

body{
  min-height:100vh;
  background:linear-gradient(135deg,#7dd3fc,#38bdf8,#0ea5e9);
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
}

.container{
  background:#fff;
  width:100%;
  max-width:800px;
  border-radius:16px;
  padding:25px;
  box-shadow:0 10px 25px rgba(0,0,0,0.2);
}

h2{
  text-align:center;
  margin-bottom:20px;
  color:#0f172a;
}

.form-group{
  margin-bottom:15px;
}

label{
  display:block;
  font-weight:600;
  margin-bottom:6px;
  color:#0f172a;
}

input, textarea{
  width:100%;
  padding:12px 14px;
  border-radius:8px;
  border:1px solid #cbd5e1;
  font-size:14px;
  outline:none;
}

textarea{
  resize:vertical;
}

.actions{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  margin-top:15px;
}

button{
  padding:12px 18px;
  border:none;
  border-radius:10px;
  cursor:pointer;
  font-weight:600;
  font-size:14px;
}

.btn-ai{
  background:#22c55e;
  color:#022c22;
}

.btn-save{
  background:#38bdf8;
  color:#000;
}

.btn-back{
  background:#0f172a;
  color:#fff;
}

button:hover{
  opacity:0.9;
}
</style>
</head>
<body>

<div class="container">
  <h2>Create New Itinerary</h2>

  <div class="form-group">
    <label>Customer Name</label>
    <input type="text" id="customerName" placeholder="Enter customer name">
  </div>

  <div class="form-group">
    <label>Created By</label>
    <input type="text" id="createdBy" placeholder="Employee name">
  </div>

  <div class="form-group">
    <label>Itinerary Start Date</label>
    <input type="date" id="startDate">
  </div>

  <div class="form-group">
    <label>Itinerary End Date</label>
    <input type="date" id="endDate">
  </div>

  <div class="form-group">
    <label>Destination</label>
    <input type="text" id="destination" placeholder="e.g. Vietnam, Thailand, Dubai">
  </div>

  <div class="form-group">
    <label>Description</label>
    <textarea id="description" rows="7" placeholder="Click 'Generate with AI' or write manually..."></textarea>
  </div>

  <div class="actions">
    <button class="btn-ai" onclick="generateDescription()">✨ Generate with AI</button>
    <button class="btn-save" onclick="saveItinerary()">💾 Save Itinerary</button>
    <button class="btn-back" onclick="goBack()">⬅ Back to Dashboard</button>
  </div>
</div>

<script>
async function generateDescription(){
  const destination = document.getElementById("destination").value;
  const startDate = document.getElementById("startDate").value;
  const endDate = document.getElementById("endDate").value;

  if(!destination){
    alert("Please enter destination first!");
    return;
  }

  const prompt = `Write a professional, attractive travel itinerary description for a trip to ${destination} from ${startDate} to ${endDate}. Make it suitable for a travel agency customer.`;

  // 🔴 YOUR GEMINI API KEY (already added)
  const API_KEY = "AIzaSyDOgV_zOm8BqGOhoZGR16j7pCtwAKdnQe4";

  try {
    const res = await fetch(
      "https://generativelanguage.googleapis.com/v1/models/gemini-1.5-flash:generateContent?key=" + API_KEY,
      {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          contents: [
            {
              role: "user",
              parts: [{ text: prompt }]
            }
          ]
        })
      }
    );

    const data = await res.json();
    console.log("Gemini response:", data);

    if (data.candidates && data.candidates.length > 0) {
      const text = data.candidates[0].content.parts[0].text;
      document.getElementById("description").value = text;
    } else {
      document.getElementById("description").value = "AI did not return any text. Try again.";
    }

  } catch (err) {
    console.error(err);
    alert("Error generating description. Check API key or internet.");
  }
}

function saveItinerary(){
  const itinerary = {
    customerName: document.getElementById("customerName").value,
    createdBy: document.getElementById("createdBy").value,
    startDate: document.getElementById("startDate").value,
    endDate: document.getElementById("endDate").value,
    destination: document.getElementById("destination").value,
    description: document.getElementById("description").value,
    createdAt: new Date().toISOString()
  };

  localStorage.setItem("latestItinerary", JSON.stringify(itinerary));
  alert("Itinerary saved successfully!");
}

function goBack(){
  window.location.href = "dashboard.html";
}
</script>

</body>
</html>
