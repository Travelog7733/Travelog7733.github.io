<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Create Itinerary</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <link rel="stylesheet" href="style.css" />

  <style>
    .form-container {
      max-width: 700px;
      margin: 40px auto;
      background: #fff;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.1);
    }
    .form-container h2 {
      margin-bottom: 20px;
    }
    .form-group {
      margin-bottom: 15px;
    }
    .form-group label {
      display: block;
      font-weight: 600;
      margin-bottom: 6px;
    }
    .form-group input, .form-group textarea {
      width: 100%;
      padding: 10px;
      border-radius: 6px;
      border: 1px solid #ccc;
      font-size: 14px;
    }
    .btn {
      padding: 10px 16px;
      border: none;
      border-radius: 8px;
      background: #4f46e5;
      color: #fff;
      font-weight: 600;
      cursor: pointer;
    }
    .btn.secondary {
      background: #0ea5e9;
      margin-left: 10px;
    }
  </style>
</head>
<body>

  <div class="form-container">
    <h2>Create New Itinerary</h2>

    <div class="form-group">
      <label>Customer Name</label>
      <input type="text" id="customerName" placeholder="Enter customer name">
    </div>

    <div class="form-group">
      <label>Created By</label>
      <input type="text" id="createdBy" placeholder="Your name">
    </div>

    <div class="form-group">
      <label>Itinerary Start Date</label>
      <input type="date" id="startDate">
    </div>

    <div class="form-group">
      <label>Itinerary End Date</label>
      <input type="date" id="endDate">
    </div>

    <div class="form-group">
      <label>Destination</label>
      <input type="text" id="destination" placeholder="e.g. Vietnam, Thailand">
    </div>

    <div class="form-group">
      <label>Description</label>
      <textarea id="description" rows="6" placeholder="Click 'Generate with AI' or write manually..."></textarea>
    </div>

    <button class="btn secondary" onclick="generateDescription()">✨ Generate with AI</button>
    <button class="btn" onclick="saveItinerary()">💾 Save Itinerary</button>
  </div>

  <script>
    async function generateDescription() {
      const destination = document.getElementById("destination").value;
      const startDate = document.getElementById("startDate").value;
      const endDate = document.getElementById("endDate").value;

      if (!destination) {
        alert("Please enter destination first!");
        return;
      }

      const prompt = `Write a professional travel itinerary description for a trip to ${destination} from ${startDate} to ${endDate}. Make it attractive and suitable for a travel agency client.`;

      // 🔴 IMPORTANT: Replace YOUR_API_KEY_HERE with your Google AI Studio (Gemini) API key
      const API_KEY = "YOUR_API_KEY_HERE";

      try {
        const res = await fetch(
          "https://generativelanguage.googleapis.com/v1beta/models/gemini-pro:generateContent?key=" + API_KEY,
          {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              contents: [
                { parts: [{ text: prompt }] }
              ]
            })
          }
        );

        const data = await res.json();
        const text = data.candidates?.[0]?.content?.parts?.[0]?.text || "Could not generate description.";

        document.getElementById("description").value = text;

      } catch (err) {
        console.error(err);
        alert("Error generating description. Check API key or internet.");
      }
    }

    function saveItinerary() {
      const itinerary = {
        customerName: document.getElementById("customerName").value,
        createdBy: document.getElementById("createdBy").value,
        startDate: document.getElementById("startDate").value,
        endDate: document.getElementById("endDate").value,
        destination: document.getElementById("destination").value,
        description: document.getElementById("description").value,
      };

      // Save to localStorage (you can later send this to dashboard)
      localStorage.setItem("latestItinerary", JSON.stringify(itinerary));

      alert("Itinerary saved!");
      // Optional: redirect to dashboard or preview page
      // window.location.href = "dashboard.html";
    }
  </script>

</body>
</html>
