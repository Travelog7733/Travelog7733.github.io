<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Supplier Payments Status | Travelog</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
background:#f4f7fb;
padding:20px;
color:#222;
}

.wrapper{
max-width:1600px;
margin:auto;
}

.page-title{
font-size:34px;
font-weight:700;
text-align:center;
margin-bottom:8px;
}

.page-subtitle{
text-align:center;
color:#666;
margin-bottom:30px;
font-size:14px;
}

.summary-grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:18px;
margin-bottom:25px;
}

.summary-card{
background:#fff;
padding:22px;
border-radius:18px;
box-shadow:0 5px 20px rgba(0,0,0,.05);
}

.summary-title{
font-size:13px;
color:#666;
margin-bottom:8px;
}

.summary-value{
font-size:26px;
font-weight:700;
color:#1D9E75;
}

.section-box{
background:#fff;
padding:24px;
border-radius:22px;
margin-bottom:25px;
box-shadow:0 5px 20px rgba(0,0,0,.05);
}

.section-title{
font-size:22px;
font-weight:700;
margin-bottom:20px;
color:#1D9E75;
}

.form-grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:14px;
}

.input-field,
select,
textarea{
width:100%;
padding:12px;
border-radius:10px;
border:1px solid #ddd;
font-size:14px;
outline:none;
}

.input-field:focus,
select:focus,
textarea:focus{
border-color:#1D9E75;
}

textarea{
min-height:100px;
resize:vertical;
}

.btn{
background:#1D9E75;
color:#fff;
border:none;
padding:12px 22px;
border-radius:40px;
cursor:pointer;
font-weight:600;
font-size:14px;
transition:.3s;
}

.btn:hover{
transform:translateY(-2px);
}

.btn-red{
background:#ff4d4f;
}

.btn-blue{
background:#0B3D91;
}

.btn-row{
display:flex;
gap:12px;
flex-wrap:wrap;
margin-top:18px;
}

.tile-grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(320px,1fr));
gap:18px;
margin-top:22px;
}

.tile{
background:#fff;
padding:20px;
border-radius:18px;
border:1px solid #E4ECE9;
box-shadow:0 5px 20px rgba(0,0,0,.04);
overflow:hidden;
transition:.3s;
}

.tile:hover{
transform:translateY(-3px);
}

.tile-head{
display:flex;
justify-content:space-between;
gap:10px;
}

.tile-title{
font-size:18px;
font-weight:700;
margin-bottom:4px;
}

.tile-sub{
font-size:12px;
color:#666;
}

.tile-details{
margin-top:16px;
}

.tile-block{
margin-top:15px;
padding-top:15px;
border-top:1px solid #eee;
font-size:13px;
line-height:1.8;
}

.amount{
font-weight:700;
color:#1D9E75;
}

@media(max-width:768px){

.page-title{
font-size:28px;
}

.tile-head{
flex-direction:column;
}

}

</style>

</head>

<body>

<div class="wrapper">

<h1 class="page-title">
Supplier Payments Status
</h1>

<p class="page-subtitle">
Travelog Supplier Invoice & Payment Management System
</p>

<div class="summary-grid">

<div class="summary-card">
<div class="summary-title">Total Invoice</div>
<div class="summary-value" id="totalInvoice">₫ 0</div>
</div>

<div class="summary-card">
<div class="summary-title">Total Paid</div>
<div class="summary-value" id="totalPaid">₫ 0</div>
</div>

<div class="summary-card">
<div class="summary-title">Balance Payable</div>
<div class="summary-value" id="totalBalance">₫ 0</div>
</div>

</div>

<!-- PAYMENT ENTRY -->

<div class="section-box">

<div class="section-title">
Payment Entry
</div>

<div class="form-grid">

<select id="paymentSupplier" class="input-field" onchange="loadInvoiceDropdown()"></select>

<select id="paymentInvoice" class="input-field"></select>

<input type="number" id="paidAmount" class="input-field" placeholder="Paid Amount">

<input type="date" id="paymentDate" class="input-field">

</div>

<br>

<textarea id="paymentNotes" placeholder="Payment Notes"></textarea>

<div class="btn-row">

<button class="btn" onclick="savePayment()">
SAVE PAYMENT
</button>

<button class="btn btn-red" onclick="clearPaymentForm()">
CLEAR
</button>

</div>

</div>

<!-- PAYMENT STATUS -->

<div class="section-box">

<div class="section-title">
Payment Status
</div>

<div class="tile-grid" id="paymentStatusContainer"></div>

</div>

</div>

<script type="module">

import {
initializeApp
} from "https://www.gstatic.com/firebasejs/12.13.0/firebase-app.js";

import {
getFirestore,
collection,
addDoc,
onSnapshot,
updateDoc,
deleteDoc,
doc
} from "https://www.gstatic.com/firebasejs/12.13.0/firebase-firestore.js";

const firebaseConfig = {

apiKey: "AIzaSyALSpB73XK5DiR2Ut59NSkKmalPkUGb49c",

authDomain: "travelog-itinerary.firebaseapp.com",

projectId: "travelog-itinerary",

storageBucket: "travelog-itinerary.firebasestorage.app",

messagingSenderId: "33567258851",

appId: "1:33567258851:web:790e8f165a3d917bf7edd6"

};

const app = initializeApp(firebaseConfig);

const db = getFirestore(app);

window.db=db;
window.collection=collection;
window.addDoc=addDoc;
window.onSnapshot=onSnapshot;
window.updateDoc=updateDoc;
window.deleteDoc=deleteDoc;
window.doc=doc;

</script>

<script>

let allSuppliers=[];
let allInvoices=[];
let allPayments=[];
let editingPaymentId=null;

function formatCurrency(amount){

return '₫ ' +
new Intl.NumberFormat('vi-VN')
.format(amount || 0);

}

function loadSuppliers(){

onSnapshot(collection(db,'suppliers'),snapshot=>{

allSuppliers=[];

snapshot.forEach(docItem=>{

allSuppliers.push({
id:docItem.id,
...docItem.data()
});

});

let options='<option value="">Select Supplier</option>';

allSuppliers.forEach(s=>{

options += `
<option value="${s.name}">
${s.name}
</option>
`;

});

document.getElementById('paymentSupplier').innerHTML=options;

});

}

function loadInvoices(){

onSnapshot(collection(db,'supplierInvoices'),snapshot=>{

allInvoices=[];

snapshot.forEach(docItem=>{

allInvoices.push({
id:docItem.id,
...docItem.data()
});

});

updateSummary();

});

}

function loadInvoiceDropdown(){

const supplier =
document.getElementById('paymentSupplier').value;

const invoices =
allInvoices.filter(i=>i.supplier===supplier);

let html='<option value="">Select Invoice</option>';

invoices.forEach(inv=>{

html += `
<option value="${inv.id}">
${inv.invoiceNo}
</option>
`;

});

document.getElementById('paymentInvoice').innerHTML=html;

}

async function savePayment(){

if(
!document.getElementById('paymentSupplier').value ||
!document.getElementById('paymentInvoice').value ||
!document.getElementById('paidAmount').value
){
alert('Please fill all fields');
return;
}

const paymentData = {

supplier:
document.getElementById('paymentSupplier').value,

invoiceId:
document.getElementById('paymentInvoice').value,

amount:
Number(document.getElementById('paidAmount').value),

paymentDate:
document.getElementById('paymentDate').value,

notes:
document.getElementById('paymentNotes').value

};

if(editingPaymentId){

await updateDoc(
doc(db,'supplierPayments',editingPaymentId),
paymentData
);

alert('Payment Updated');

editingPaymentId=null;

}else{

paymentData.created =
new Date().toISOString();

await addDoc(
collection(db,'supplierPayments'),
paymentData
);

alert('Payment Saved');

}

clearPaymentForm();

}

function clearPaymentForm(){

document.getElementById('paymentSupplier').value='';

document.getElementById('paymentInvoice').innerHTML=
'<option value="">Select Invoice</option>';

document.getElementById('paidAmount').value='';

document.getElementById('paymentDate').value='';

document.getElementById('paymentNotes').value='';

editingPaymentId=null;

}

async function editPayment(id){

const payment =
allPayments.find(p=>p.id===id);

if(!payment) return;

editingPaymentId=id;

document.getElementById('paymentSupplier').value =
payment.supplier || '';

loadInvoiceDropdown();

setTimeout(()=>{

document.getElementById('paymentInvoice').value =
payment.invoiceId || '';

},200);

document.getElementById('paidAmount').value =
payment.amount || '';

document.getElementById('paymentDate').value =
payment.paymentDate || '';

document.getElementById('paymentNotes').value =
payment.notes || '';

window.scrollTo({
top:0,
behavior:'smooth'
});

alert('Payment Loaded');

}

async function deletePayment(id){

if(!confirm('Delete Payment?'))
return;

await deleteDoc(
doc(db,'supplierPayments',id)
);

alert('Payment Deleted');

}

function loadPayments(){

onSnapshot(collection(db,'supplierPayments'),snapshot=>{

allPayments=[];

snapshot.forEach(docItem=>{

allPayments.push({
id:docItem.id,
...docItem.data()
});

});

renderPaymentStatus();

updateSummary();

});

}

function renderPaymentStatus(){

let html='';

allPayments.forEach(pay=>{

const invoice =
allInvoices.find(inv=>inv.id===pay.invoiceId);

html += `

<div class="tile">

<div class="tile-head">

<div>

<div class="tile-title">
${pay.supplier}
</div>

<div class="tile-sub">
${pay.paymentDate || '-'}
</div>

</div>

<div class="amount">
${formatCurrency(pay.amount)}
</div>

</div>

<div class="tile-details">

<div class="tile-block">

Invoice :
${invoice?.invoiceNo || '-'}
<br>

Amount :
<span class="amount">
${formatCurrency(pay.amount)}
</span>

${pay.notes ? `
<br><br>
Note :
${pay.notes}
` : ''}

</div>

<div class="btn-row">

<button
class="btn btn-blue"
onclick="editPayment('${pay.id}')">

EDIT

</button>

<button
class="btn btn-red"
onclick="deletePayment('${pay.id}')">

DELETE

</button>

</div>

</div>

</div>

`;

});

document.getElementById('paymentStatusContainer').innerHTML=html;

}

function updateSummary(){

const totalInvoice =
allInvoices.reduce((sum,i)=>
sum + Number(i.grandTotal || 0),0);

const totalPaid =
allPayments.reduce((sum,p)=>
sum + Number(p.amount || 0),0);

const totalBalance =
totalInvoice-totalPaid;

document.getElementById('totalInvoice')
.innerText = formatCurrency(totalInvoice);

document.getElementById('totalPaid')
.innerText = formatCurrency(totalPaid);

document.getElementById('totalBalance')
.innerText = formatCurrency(totalBalance);

}

window.addEventListener('load',()=>{

loadSuppliers();

loadInvoices();

loadPayments();

});

</script>

</body>

</html>
