<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Supplier Payments Status | Travelog</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
background:#f4f7fb;
padding:20px;
color:#222;
}

.wrapper{
max-width:1600px;
margin:auto;
}

.page-title{
font-size:34px;
font-weight:700;
text-align:center;
margin-bottom:8px;
}

.page-subtitle{
text-align:center;
color:#666;
margin-bottom:30px;
font-size:14px;
}

.summary-grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:18px;
margin-bottom:25px;
}

.summary-card{
background:#fff;
padding:22px;
border-radius:18px;
box-shadow:0 5px 20px rgba(0,0,0,.05);
}

.summary-title{
font-size:13px;
color:#666;
margin-bottom:8px;
}

.summary-value{
font-size:26px;
font-weight:700;
color:#1D9E75;
}

.section-box{
background:#fff;
padding:24px;
border-radius:22px;
margin-bottom:25px;
box-shadow:0 5px 20px rgba(0,0,0,.05);
}

.section-title{
font-size:22px;
font-weight:700;
margin-bottom:20px;
color:#1D9E75;
}

.form-grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:14px;
}

.invoice-headings{
display:grid;
grid-template-columns:80px 2fr 1fr 1fr 1fr;
gap:12px;
font-size:13px;
font-weight:700;
margin:18px 0 10px;
padding:0 5px;
color:#555;
}

.invoice-grid{
display:grid;
grid-template-columns:80px 2fr 1fr 1fr 1fr;
gap:12px;
}

.input-field,
select,
textarea{
width:100%;
padding:12px;
border-radius:10px;
border:1px solid #ddd;
font-size:14px;
outline:none;
}

.input-field:focus,
select:focus,
textarea:focus{
border-color:#1D9E75;
}

textarea{
min-height:100px;
resize:vertical;
}

.btn{
background:#1D9E75;
color:#fff;
border:none;
padding:12px 22px;
border-radius:40px;
cursor:pointer;
font-weight:600;
font-size:14px;
transition:.3s;
}

.btn:hover{
transform:translateY(-2px);
}

.btn-red{
background:#ff4d4f;
}

.btn-blue{
background:#0B3D91;
}

.btn-row{
display:flex;
gap:12px;
flex-wrap:wrap;
margin-top:18px;
}

.invoice-item{
background:#f9fbfb;
padding:16px;
border-radius:14px;
border:1px solid #E4ECE9;
margin-bottom:12px;
}

.tile-grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(300px,1fr));
gap:18px;
margin-top:22px;
}

.tile{
background:#fff;
padding:20px;
border-radius:18px;
border:1px solid #E4ECE9;
box-shadow:0 5px 20px rgba(0,0,0,.04);
cursor:pointer;
overflow:hidden;
transition:.3s;
}

.tile:hover{
transform:translateY(-3px);
}

.tile-head{
display:flex;
justify-content:space-between;
gap:10px;
}

.tile-title{
font-size:18px;
font-weight:700;
margin-bottom:4px;
}

.tile-sub{
font-size:12px;
color:#666;
}

.tile-details{
max-height:0;
overflow:hidden;
transition:.4s ease;
}

.tile.active .tile-details{
max-height:5000px;
margin-top:16px;
}

.tile-block{
margin-top:15px;
padding-top:15px;
border-top:1px solid #eee;
font-size:13px;
line-height:1.8;
}

.amount{
font-weight:700;
color:#1D9E75;
}

.badge{
display:inline-block;
padding:7px 12px;
border-radius:999px;
font-size:11px;
font-weight:700;
color:#fff;
}

.pending{
background:#ff9800;
}

.partial{
background:#0077ff;
}

.paid{
background:#00a86b;
}

@media(max-width:768px){

.invoice-headings{
display:none;
}

.invoice-grid{
grid-template-columns:1fr;
}

.page-title{
font-size:28px;
}

.tile-head{
flex-direction:column;
}

}

</style>

</head>

<body>

<div class="wrapper">

<h1 class="page-title">
Supplier Payments Status
</h1>

<p class="page-subtitle">
Travelog Supplier Invoice & Payment Management System
</p>

<div class="summary-grid">

<div class="summary-card">
<div class="summary-title">Total Invoice</div>
<div class="summary-value" id="totalInvoice">₫ 0</div>
</div>

<div class="summary-card">
<div class="summary-title">Total Paid</div>
<div class="summary-value" id="totalPaid">₫ 0</div>
</div>

<div class="summary-card">
<div class="summary-title">Balance Payable</div>
<div class="summary-value" id="totalBalance">₫ 0</div>
</div>

</div>

<div class="section-box">

<div class="section-title">
Payment Entry
</div>

<div class="form-grid">

<select id="paymentSupplier" class="input-field" onchange="loadInvoiceDropdown()"></select>

<select id="paymentInvoice" class="input-field"></select>

<input type="number" id="paidAmount" class="input-field" placeholder="Paid Amount">

<input type="date" id="paymentDate" class="input-field">

</div>

<br>

<textarea id="paymentNotes" placeholder="Payment Notes"></textarea>

<div class="btn-row">

<button class="btn" onclick="savePayment()">
SAVE PAYMENT
</button>

<button class="btn btn-red" onclick="clearPaymentForm()">
CLEAR
</button>

</div>

</div>

<div class="section-box">

<div class="section-title">
Payment Status
</div>

<div class="tile-grid" id="paymentStatusContainer"></div>

</div>

</div>

<script type="module">

import {
initializeApp
} from "https://www.gstatic.com/firebasejs/12.13.0/firebase-app.js";

import {
getFirestore,
collection,
addDoc,
onSnapshot,
updateDoc,
deleteDoc,
doc
} from "https://www.gstatic.com/firebasejs/12.13.0/firebase-firestore.js";

const firebaseConfig = {

apiKey: "AIzaSyALSpB73XK5DiR2Ut59NSkKmalPkUGb49c",

authDomain: "travelog-itinerary.firebaseapp.com",

projectId: "travelog-itinerary",

storageBucket: "travelog-itinerary.firebasestorage.app",

messagingSenderId: "33567258851",

appId: "1:33567258851:web:790e8f165a3d917bf7edd6"

};

const app = initializeApp(firebaseConfig);

const db = getFirestore(app);

window.db=db;
window.collection=collection;
window.addDoc=addDoc;
window.onSnapshot=onSnapshot;
window.updateDoc=updateDoc;
window.deleteDoc=deleteDoc;
window.doc=doc;

</script>

<script>

let allSuppliers=[];
let allInvoices=[];
let allPayments=[];
let editingInvoiceId=null;
let editingPaymentId=null;

function formatCurrency(amount){

return '₫ ' +
new Intl.NumberFormat('vi-VN')
.format(amount || 0);

}

async function savePayment(){

const paymentData = {

supplier:
document.getElementById('paymentSupplier').value,

invoiceId:
document.getElementById('paymentInvoice').value,

amount:
Number(document.getElementById('paidAmount').value),

paymentDate:
document.getElementById('paymentDate').value,

notes:
document.getElementById('paymentNotes').value

};

if(editingPaymentId){

await updateDoc(
doc(db,'supplierPayments',editingPaymentId),
paymentData
);

alert('Payment Updated');

editingPaymentId=null;

}else{

await addDoc(collection(db,'supplierPayments'),{

...paymentData,

created:new Date().toISOString()

});

alert('Payment Saved');

}

clearPaymentForm();

}

function clearPaymentForm(){

document.getElementById('paymentSupplier').value='';

document.getElementById('paymentInvoice').innerHTML=
'<option value="">Select Invoice</option>';

document.getElementById('paidAmount').value='';

document.getElementById('paymentDate').value='';

document.getElementById('paymentNotes').value='';

editingPaymentId=null;

}

async function editPayment(id){

const payment =
allPayments.find(p=>p.id===id);

if(!payment) return;

editingPaymentId=id;

document.getElementById('paymentSupplier').value =
payment.supplier || '';

loadInvoiceDropdown();

setTimeout(()=>{

document.getElementById('paymentInvoice').value =
payment.invoiceId || '';

},300);

document.getElementById('paidAmount').value =
payment.amount || '';

document.getElementById('paymentDate').value =
payment.paymentDate || '';

document.getElementById('paymentNotes').value =
payment.notes || '';

window.scrollTo({
top:0,
behavior:'smooth'
});

alert('Payment Loaded');

}

async function deletePayment(id){

if(!confirm('Delete Payment?'))
return;

await deleteDoc(
doc(db,'supplierPayments',id)
);

alert('Payment Deleted');

}

function loadInvoiceDropdown(){

const supplier =
document.getElementById('paymentSupplier').value;

const invoices =
allInvoices.filter(i=>i.supplier===supplier);

let html='<option value="">Select Invoice</option>';

invoices.forEach(inv=>{

html += `

<option value="${inv.id}">
${inv.invoiceNo}
</option>

`;

});

document.getElementById('paymentInvoice').innerHTML=html;

}

function renderPaymentStatus(){

let html='';

allSuppliers.forEach(supplier=>{

const supplierInvoices =
allInvoices.filter(i=>
i.supplier===supplier.name
);

html += `

<div class="tile"
onclick="this.classList.toggle('active')">

<div class="tile-head">

<div>

<div class="tile-title">
${supplier.name}
</div>

</div>

</div>

<div class="tile-details">

${supplierInvoices.map(inv=>{

const relatedPayments =
allPayments.filter(payment=>
payment.invoiceId===inv.id
);

return `

<div class="tile-block">

<b>${inv.invoiceNo}</b>

${relatedPayments.map(pay=>`

<div style="
margin-top:8px;
padding:8px;
background:#f8f8f8;
border-radius:8px;
">

Date :
${pay.paymentDate || '-'}
<br>

Amount :
<span class="amount">
${formatCurrency(pay.amount)}
</span>

${pay.notes ? `
<br>
Note : ${pay.notes}
` : ''}

<div class="btn-row" style="margin-top:10px;">

<button
class="btn btn-blue"
style="padding:8px 14px;font-size:12px;"
onclick="event.stopPropagation();editPayment('${pay.id}')">

EDIT

</button>

<button
class="btn btn-red"
style="padding:8px 14px;font-size:12px;"
onclick="event.stopPropagation();deletePayment('${pay.id}')">

DELETE

</button>

</div>

</div>

`).join('')}

</div>

`;

}).join('')}

</div>

</div>

`;

});

document.getElementById('paymentStatusContainer').innerHTML=html;

}

function loadPayments(){

onSnapshot(collection(db,'supplierPayments'),snapshot=>{

allPayments=[];

snapshot.forEach(docItem=>{

allPayments.push({
id:docItem.id,
...docItem.data()
});

});

renderPaymentStatus();

});

}

window.addEventListener('load',()=>{

loadPayments();

});

</script>

</body>
</html>
