<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Supplier Payments Status | Travelog</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
background:#f5f7fb;
padding:24px;
color:#222;
}

.wrapper{
max-width:1600px;
margin:auto;
}

.page-title{
font-size:34px;
font-weight:700;
margin-bottom:8px;
text-align:center;
}

.page-subtitle{
text-align:center;
color:#666;
margin-bottom:30px;
font-size:14px;
}

.section-box{
background:#fff;
padding:22px;
border-radius:22px;
margin-bottom:25px;
box-shadow:0 8px 30px rgba(0,0,0,.05);
border:1px solid #E4ECE9;
}

.section-title{
font-size:22px;
font-weight:700;
margin-bottom:18px;
color:#1D9E75;
}

.form-grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:14px;
}

.input-field,
select,
textarea{
width:100%;
padding:12px;
border-radius:12px;
border:1px solid #dcdcdc;
font-size:14px;
outline:none;
}

textarea{
resize:vertical;
min-height:100px;
}

.input-field:focus,
select:focus,
textarea:focus{
border-color:#1D9E75;
}

.btn-row{
display:flex;
gap:12px;
flex-wrap:wrap;
margin-top:18px;
}

.btn{
background:#1D9E75;
color:#fff;
border:none;
padding:12px 22px;
border-radius:40px;
cursor:pointer;
font-weight:600;
font-size:14px;
transition:.3s;
}

.btn:hover{
transform:translateY(-2px);
background:#0F6E56;
}

.btn-red{
background:#ff4d4f;
}

.btn-blue{
background:#0B3D91;
}

.tile-grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(300px,1fr));
gap:18px;
margin-top:22px;
}

.tile{
background:#fff;
padding:20px;
border-radius:18px;
border:1px solid #E4ECE9;
box-shadow:0 6px 20px rgba(0,0,0,.04);
cursor:pointer;
overflow:hidden;
transition:.3s;
}

.tile:hover{
transform:translateY(-3px);
}

.tile-head{
display:flex;
justify-content:space-between;
gap:12px;
}

.tile-title{
font-size:18px;
font-weight:700;
}

.tile-sub{
font-size:13px;
color:#666;
margin-top:4px;
}

.tile-details{
max-height:0;
overflow:hidden;
transition:.4s ease;
}

.tile.active .tile-details{
max-height:5000px;
margin-top:18px;
}

.tile-block{
padding-top:16px;
margin-top:16px;
border-top:1px solid #eee;
font-size:14px;
line-height:1.8;
}

.amount{
font-weight:700;
color:#1D9E75;
}

.badge{
display:inline-block;
padding:6px 12px;
border-radius:999px;
font-size:11px;
font-weight:700;
color:#fff;
}

.pending{
background:#ff9800;
}

.partial{
background:#0077ff;
}

.paid{
background:#00a86b;
}

.invoice-grid{
display:grid;
grid-template-columns:80px 1.4fr 120px 140px 160px;
gap:12px;
margin-bottom:12px;
}

.summary-grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:18px;
margin-bottom:25px;
}

.summary-card{
background:#fff;
padding:22px;
border-radius:20px;
box-shadow:0 6px 20px rgba(0,0,0,.04);
}

.summary-title{
font-size:13px;
color:#666;
margin-bottom:10px;
}

.summary-value{
font-size:28px;
font-weight:700;
color:#1D9E75;
}

label{
font-size:13px;
font-weight:600;
margin-bottom:6px;
display:block;
}

@media(max-width:768px){

.invoice-grid{
grid-template-columns:1fr;
}

.tile-head{
flex-direction:column;
}

.page-title{
font-size:28px;
}

body{
padding:15px;
}

}

</style>

</head>

<body>

<div class="wrapper">

<h1 class="page-title">
Supplier Payments Status
</h1>

<p class="page-subtitle">
Travelog Supplier Invoice & Payment Management Platform
</p>

<div class="summary-grid">

<div class="summary-card">
<div class="summary-title">Total Invoice</div>
<div class="summary-value" id="totalInvoice">₫ 0</div>
</div>

<div class="summary-card">
<div class="summary-title">Total Paid</div>
<div class="summary-value" id="totalPaid">₫ 0</div>
</div>

<div class="summary-card">
<div class="summary-title">Balance Payable</div>
<div class="summary-value" id="totalBalance">₫ 0</div>
</div>

</div>

<!-- SUPPLIERS -->

<div class="section-box">

<div class="section-title">
Supplier List
</div>

<div class="form-grid">

<div>
<label>Supplier Name</label>
<input type="text" id="supplierName" class="input-field">
</div>

<div>
<label>Country</label>
<input type="text" id="supplierCountry" class="input-field">
</div>

<div>
<label>Company Name</label>
<input type="text" id="supplierCompany" class="input-field">
</div>

</div>

<div class="btn-row">
<button class="btn" onclick="saveSupplier()">SAVE SUPPLIER</button>
</div>

<div class="tile-grid" id="supplierContainer"></div>

</div>

<!-- INVOICE SECTION -->

<div class="section-box">

<div class="section-title">
Supplier Invoice Input
</div>

<div class="form-grid">

<div>
<label>Supplier</label>
<select id="invoiceSupplier" class="input-field"></select>
</div>

<div>
<label>Invoice Date</label>
<input type="date" id="invoiceDate" class="input-field">
</div>

<div>
<label>Service Commencement Date</label>
<input type="date" id="commencementDate" class="input-field">
</div>

</div>

<br>

<div id="invoiceItems">

<div class="invoice-item">

<div class="invoice-grid">

<input type="number" class="input-field line-no" placeholder="No">

<input type="text" class="input-field item-name" placeholder="Item">

<input type="number" class="input-field qty" placeholder="Qty" oninput="calculateTotals()">

<input type="number" class="input-field rate" placeholder="Rate" oninput="calculateTotals()">

<input type="number" class="input-field total" placeholder="Total" readonly>

</div>

</div>

</div>

<div class="btn-row">
<button class="btn" onclick="addInvoiceItem()">+ ADD ITEM</button>
</div>

<br>

<label>Notes</label>
<textarea id="invoiceNotes"></textarea>

<br><br>

<h3>
Grand Total:
<span class="amount" id="grandTotal">₫ 0</span>
</h3>

<div class="btn-row">

<button class="btn" onclick="saveInvoice()">
SAVE INVOICE
</button>

<button class="btn btn-red" onclick="clearInvoiceForm()">
CLEAR
</button>

</div>

<div class="tile-grid" id="invoiceContainer"></div>

</div>

<!-- PAYMENT ENTRY -->

<div class="section-box">

<div class="section-title">
Payment Entry
</div>

<div class="form-grid">

<div>
<label>Supplier</label>
<select id="paymentSupplier" class="input-field" onchange="loadInvoiceDropdown()"></select>
</div>

<div>
<label>Select Invoice</label>
<select id="paymentInvoice" class="input-field"></select>
</div>

<div>
<label>Paid Amount</label>
<input type="number" id="paidAmount" class="input-field">
</div>

<div>
<label>Payment Date</label>
<input type="date" id="paymentDate" class="input-field">
</div>

</div>

<br>

<label>Payment Notes</label>

<textarea id="paymentNotes"></textarea>

<div class="btn-row">
<button class="btn" onclick="savePayment()">
SAVE PAYMENT
</button>
</div>

</div>

<!-- STATEMENT -->

<div class="section-box">

<div class="section-title">
Supplier Account Statement
</div>

<div class="form-grid">

<div>
<label>Select Supplier</label>
<select id="statementSupplier" class="input-field"></select>
</div>

<div>
<label>From Date</label>
<input type="date" id="statementFrom" class="input-field">
</div>

<div>
<label>To Date</label>
<input type="date" id="statementTo" class="input-field">
</div>

</div>

<div class="btn-row">

<button class="btn" onclick="generateStatement()">
VIEW STATEMENT
</button>

<button class="btn btn-blue" onclick="downloadStatementPDF()">
DOWNLOAD PDF
</button>

</div>

<div id="statementPreview"></div>

</div>

<!-- PAYMENT STATUS -->

<div class="section-box">

<div class="section-title">
Payment Status
</div>

<div class="tile-grid" id="paymentStatusContainer"></div>

</div>

</div>

<script type="module">

import {
initializeApp
} from "https://www.gstatic.com/firebasejs/12.13.0/firebase-app.js";

import {
getFirestore,
collection,
addDoc,
onSnapshot
} from "https://www.gstatic.com/firebasejs/12.13.0/firebase-firestore.js";

const firebaseConfig = {

apiKey: "AIzaSyALSpB73XK5DiR2Ut59NSkKmalPkUGb49c",

authDomain: "travelog-itinerary.firebaseapp.com",

projectId: "travelog-itinerary",

storageBucket: "travelog-itinerary.firebasestorage.app",

messagingSenderId: "33567258851",

appId: "1:33567258851:web:790e8f165a3d917bf7edd6"

};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

window.db = db;
window.collection = collection;
window.addDoc = addDoc;
window.onSnapshot = onSnapshot;

</script>

<script>

let allSuppliers = [];
let allInvoices = [];
let allPayments = [];

function formatCurrency(amount){
return '₫ ' + new Intl.NumberFormat('vi-VN').format(amount || 0);
}

function addInvoiceItem(){

const html = `

<div class="invoice-item">

<div class="invoice-grid">

<input type="number" class="input-field line-no" placeholder="No">

<input type="text" class="input-field item-name" placeholder="Item">

<input type="number" class="input-field qty" placeholder="Qty" oninput="calculateTotals()">

<input type="number" class="input-field rate" placeholder="Rate" oninput="calculateTotals()">

<input type="number" class="input-field total" placeholder="Total" readonly>

</div>

</div>

`;

document.getElementById('invoiceItems')
.insertAdjacentHTML('beforeend',html);

}

function calculateTotals(){

let grandTotal = 0;

document.querySelectorAll('.invoice-item')
.forEach(item=>{

const qty =
Number(item.querySelector('.qty').value) || 0;

const rate =
Number(item.querySelector('.rate').value) || 0;

const total = qty * rate;

item.querySelector('.total').value = total;

grandTotal += total;

});

document.getElementById('grandTotal').innerText =
formatCurrency(grandTotal);

}

async function saveSupplier(){

await addDoc(collection(db,'suppliers'),{

name:document.getElementById('supplierName').value,

country:document.getElementById('supplierCountry').value,

company:document.getElementById('supplierCompany').value,

created:new Date().toISOString()

});

alert('Supplier Saved');

}

async function saveInvoice(){

const invoiceNo =
"INV-" +
new Date().getFullYear() +
"-" +
String(Date.now()).slice(-6);

const items =
[...document.querySelectorAll('.invoice-item')]
.map(item=>({

line:item.querySelector('.line-no').value,

item:item.querySelector('.item-name').value,

qty:item.querySelector('.qty').value,

rate:item.querySelector('.rate').value,

total:item.querySelector('.total').value

}));

const grandTotal =
items.reduce((sum,item)=>
sum + Number(item.total || 0),0);

await addDoc(collection(db,'supplierInvoices'),{

invoiceNo,

supplier:
document.getElementById('invoiceSupplier').value,

invoiceDate:
document.getElementById('invoiceDate').value,

commencementDate:
document.getElementById('commencementDate').value,

items,

notes:
document.getElementById('invoiceNotes').value,

grandTotal,

created:new Date().toISOString()

});

alert('Invoice Saved');

clearInvoiceForm();

}

function clearInvoiceForm(){

document.getElementById('invoiceItems').innerHTML='';

addInvoiceItem();

document.getElementById('invoiceNotes').value='';

calculateTotals();

}

async function savePayment(){

await addDoc(collection(db,'supplierPayments'),{

supplier:
document.getElementById('paymentSupplier').value,

invoiceId:
document.getElementById('paymentInvoice').value,

amount:
Number(document.getElementById('paidAmount').value),

paymentDate:
document.getElementById('paymentDate').value,

notes:
document.getElementById('paymentNotes').value,

created:new Date().toISOString()

});

alert('Payment Saved');

}

function loadSuppliers(){

onSnapshot(collection(db,'suppliers'),snapshot=>{

allSuppliers=[];

snapshot.forEach(docItem=>{

allSuppliers.push({
id:docItem.id,
...docItem.data()
});

});

let html='';
let options='<option value="">Select Supplier</option>';

allSuppliers.forEach(s=>{

options += `
<option value="${s.name}">
${s.name}
</option>
`;

html += `

<div class="tile"
onclick="this.classList.toggle('active')">

<div class="tile-head">

<div>
<div class="tile-title">${s.name}</div>
<div class="tile-sub">${s.country || ''}</div>
</div>

</div>

<div class="tile-details">

<div class="tile-block">
Company: ${s.company || '-'}
</div>

</div>

</div>

`;

});

document.getElementById('supplierContainer').innerHTML=html;

document.getElementById('invoiceSupplier').innerHTML=options;
document.getElementById('paymentSupplier').innerHTML=options;
document.getElementById('statementSupplier').innerHTML=options;

});

}

function loadInvoices(){

onSnapshot(collection(db,'supplierInvoices'),snapshot=>{

allInvoices=[];

snapshot.forEach(docItem=>{

allInvoices.push({
id:docItem.id,
...docItem.data()
});

});

renderInvoices();
renderPaymentStatus();
updateSummary();

});

}

function loadPayments(){

onSnapshot(collection(db,'supplierPayments'),snapshot=>{

allPayments=[];

snapshot.forEach(docItem=>{

allPayments.push({
id:docItem.id,
...docItem.data()
});

});

renderInvoices();
renderPaymentStatus();
updateSummary();

});

}

function renderInvoices(){

let html='';

allInvoices.forEach(inv=>{

const totalPaid =
allPayments
.filter(p=>p.invoiceId===inv.id)
.reduce((sum,p)=>
sum + Number(p.amount || 0),0);

const balance =
Number(inv.grandTotal || 0) - totalPaid;

let badge='pending';
let badgeText='PENDING';

if(balance<=0){
badge='paid';
badgeText='PAID';
}else if(totalPaid>0){
badge='partial';
badgeText='PARTIAL';
}

html += `

<div class="tile"
onclick="this.classList.toggle('active')">

<div class="tile-head">

<div>

<div class="tile-title">
${inv.supplier}
</div>

<div class="tile-sub">
${inv.invoiceNo}
</div>

</div>

<div>
<span class="badge ${badge}">
${badgeText}
</span>
</div>

</div>

<div class="tile-details">

<div class="tile-block">

Invoice Date:
${inv.invoiceDate}
<br>

Commencement:
${inv.commencementDate}
<br><br>

Invoice:
<span class="amount">
${formatCurrency(inv.grandTotal)}
</span>
<br>

Paid:
<span class="amount">
${formatCurrency(totalPaid)}
</span>
<br>

Balance:
<span class="amount">
${formatCurrency(balance)}
</span>

</div>

</div>

</div>

`;

});

document.getElementById('invoiceContainer').innerHTML=html;

}

function loadInvoiceDropdown(){

const supplier =
document.getElementById('paymentSupplier').value;

const invoices =
allInvoices.filter(i=>i.supplier===supplier);

let html='<option value="">Select Invoice</option>';

invoices.forEach(inv=>{

html += `
<option value="${inv.id}">
${inv.invoiceNo}
</option>
`;

});

document.getElementById('paymentInvoice').innerHTML=html;

}

function renderPaymentStatus(){

let html='';

allSuppliers.forEach(supplier=>{

const supplierInvoices =
allInvoices.filter(i=>
i.supplier===supplier.name);

const totalInvoice =
supplierInvoices.reduce((sum,i)=>
sum + Number(i.grandTotal || 0),0);

const invoiceIds =
supplierInvoices.map(i=>i.id);

const totalPaid =
allPayments
.filter(p=>invoiceIds.includes(p.invoiceId))
.reduce((sum,p)=>
sum + Number(p.amount || 0),0);

const balance =
totalInvoice-totalPaid;

html += `

<div class="tile"
onclick="this.classList.toggle('active')">

<div class="tile-head">

<div>
<div class="tile-title">
${supplier.name}
</div>

<div class="tile-sub">
${supplier.country || ''}
</div>
</div>

<div class="amount">
${formatCurrency(balance)}
</div>

</div>

<div class="tile-details">

<div class="tile-block">

Total Invoice:
<span class="amount">
${formatCurrency(totalInvoice)}
</span>
<br>

Total Paid:
<span class="amount">
${formatCurrency(totalPaid)}
</span>
<br>

Balance:
<span class="amount">
${formatCurrency(balance)}
</span>

</div>

</div>

</div>

`;

});

document.getElementById('paymentStatusContainer').innerHTML=html;

}

function generateStatement(){

const supplier =
document.getElementById('statementSupplier').value;

const fromDate =
document.getElementById('statementFrom').value;

const toDate =
document.getElementById('statementTo').value;

const invoices =
allInvoices.filter(inv=>{

if(inv.supplier !== supplier)
return false;

if(fromDate && inv.invoiceDate < fromDate)
return false;

if(toDate && inv.invoiceDate > toDate)
return false;

return true;

});

let html=`
<div class="tile">

<div class="tile-title">
${supplier} Statement
</div>
`;

let totalInvoice=0;
let totalPaid=0;

invoices.forEach(inv=>{

const paid =
allPayments
.filter(p=>p.invoiceId===inv.id)
.reduce((sum,p)=>
sum + Number(p.amount || 0),0);

const balance =
Number(inv.grandTotal || 0)-paid;

totalInvoice += Number(inv.grandTotal || 0);
totalPaid += paid;

html += `

<div class="tile-block">

<b>${inv.invoiceNo}</b>
<br><br>

Invoice Date:
${inv.invoiceDate}
<br>

Amount:
${formatCurrency(inv.grandTotal)}
<br>

Paid:
${formatCurrency(paid)}
<br>

Balance:
${formatCurrency(balance)}

</div>

`;

});

html += `

<div class="tile-block">

<b>Total Invoice:</b>
${formatCurrency(totalInvoice)}
<br><br>

<b>Total Paid:</b>
${formatCurrency(totalPaid)}
<br><br>

<b>Balance:</b>
${formatCurrency(totalInvoice-totalPaid)}

</div>

</div>

`;

document.getElementById('statementPreview').innerHTML=html;

}

async function downloadStatementPDF(){

generateStatement();

const supplier =
document.getElementById('statementSupplier').value;

const preview =
document.getElementById('statementPreview').innerText;

const { jsPDF } = window.jspdf;

const doc = new jsPDF();

doc.setFontSize(18);

doc.text("Supplier Statement",20,20);

doc.setFontSize(11);

doc.text(preview,20,35);

doc.save(supplier + "-statement.pdf");

}

function updateSummary(){

const totalInvoice =
allInvoices.reduce((sum,i)=>
sum + Number(i.grandTotal || 0),0);

const totalPaid =
allPayments.reduce((sum,p)=>
sum + Number(p.amount || 0),0);

const totalBalance =
totalInvoice-totalPaid;

document.getElementById('totalInvoice').innerText =
formatCurrency(totalInvoice);

document.getElementById('totalPaid').innerText =
formatCurrency(totalPaid);

document.getElementById('totalBalance').innerText =
formatCurrency(totalBalance);

}

window.addEventListener('load',()=>{

loadSuppliers();
loadInvoices();
loadPayments();
calculateTotals();

});

</script>

</body>
</html>
