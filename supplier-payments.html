<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Supplier Payments Status | Travelog</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
background:#f4f7fb;
padding:20px;
color:#222;
}

.wrapper{
max-width:1600px;
margin:auto;
}

.page-title{
font-size:34px;
font-weight:700;
text-align:center;
margin-bottom:8px;
}

.page-subtitle{
text-align:center;
color:#666;
margin-bottom:30px;
font-size:14px;
}

.summary-grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:18px;
margin-bottom:25px;
}

.summary-card{
background:#fff;
padding:22px;
border-radius:18px;
box-shadow:0 5px 20px rgba(0,0,0,.05);
}

.summary-title{
font-size:13px;
color:#666;
margin-bottom:8px;
}

.summary-value{
font-size:26px;
font-weight:700;
color:#1D9E75;
}

.section-box{
background:#fff;
padding:24px;
border-radius:22px;
margin-bottom:25px;
box-shadow:0 5px 20px rgba(0,0,0,.05);
}

.section-title{
font-size:22px;
font-weight:700;
margin-bottom:20px;
color:#1D9E75;
}

.form-grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:14px;
}

.invoice-headings{
display:grid;
grid-template-columns:80px 2fr 1fr 1fr 1fr;
gap:12px;
font-size:13px;
font-weight:700;
margin:18px 0 10px;
padding:0 5px;
color:#555;
}

.invoice-grid{
display:grid;
grid-template-columns:80px 2fr 1fr 1fr 1fr;
gap:12px;
}

.input-field,
select,
textarea{
width:100%;
padding:12px;
border-radius:10px;
border:1px solid #ddd;
font-size:14px;
outline:none;
}

.input-field:focus,
select:focus,
textarea:focus{
border-color:#1D9E75;
}

textarea{
min-height:100px;
resize:vertical;
}

.btn{
background:#1D9E75;
color:#fff;
border:none;
padding:12px 22px;
border-radius:40px;
cursor:pointer;
font-weight:600;
font-size:14px;
transition:.3s;
}

.btn:hover{
transform:translateY(-2px);
}

.btn-red{
background:#ff4d4f;
}

.btn-blue{
background:#0B3D91;
}

.btn-row{
display:flex;
gap:12px;
flex-wrap:wrap;
margin-top:18px;
}

.invoice-item{
background:#f9fbfb;
padding:16px;
border-radius:14px;
border:1px solid #E4ECE9;
margin-bottom:12px;
}

.tile-grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(300px,1fr));
gap:18px;
margin-top:22px;
}

.tile{
background:#fff;
padding:20px;
border-radius:18px;
border:1px solid #E4ECE9;
box-shadow:0 5px 20px rgba(0,0,0,.04);
cursor:pointer;
overflow:hidden;
transition:.3s;
}

.tile:hover{
transform:translateY(-3px);
}

.tile-head{
display:flex;
justify-content:space-between;
gap:10px;
}

.tile-title{
font-size:18px;
font-weight:700;
margin-bottom:4px;
}

.tile-sub{
font-size:12px;
color:#666;
}

.tile-details{
max-height:0;
overflow:hidden;
transition:.4s ease;
}

.tile.active .tile-details{
max-height:5000px;
margin-top:16px;
}

.tile-block{
margin-top:15px;
padding-top:15px;
border-top:1px solid #eee;
font-size:13px;
line-height:1.8;
}

.amount{
font-weight:700;
color:#1D9E75;
}

.badge{
display:inline-block;
padding:7px 12px;
border-radius:999px;
font-size:11px;
font-weight:700;
color:#fff;
}

.pending{
background:#ff9800;
}

.partial{
background:#0077ff;
}

.paid{
background:#00a86b;
}

@media(max-width:768px){

.invoice-headings{
display:none;
}

.invoice-grid{
grid-template-columns:1fr;
}

.page-title{
font-size:28px;
}

.tile-head{
flex-direction:column;
}

}

</style>

</head>

<body>

<div class="wrapper">

<h1 class="page-title">
Supplier Payments Status
</h1>

<p class="page-subtitle">
Travelog Supplier Invoice & Payment Management System
</p>

<div class="summary-grid">

<div class="summary-card">
<div class="summary-title">Total Invoice</div>
<div class="summary-value" id="totalInvoice">₫ 0</div>
</div>

<div class="summary-card">
<div class="summary-title">Total Paid</div>
<div class="summary-value" id="totalPaid">₫ 0</div>
</div>

<div class="summary-card">
<div class="summary-title">Balance Payable</div>
<div class="summary-value" id="totalBalance">₫ 0</div>
</div>

</div>

<!-- SUPPLIER SECTION -->

<div class="section-box">

<div class="section-title">
Supplier List
</div>

<div class="form-grid">

<input type="text" id="supplierName" class="input-field" placeholder="Supplier Name">

<input type="text" id="supplierCountry" class="input-field" placeholder="Country">

<input type="text" id="supplierCompany" class="input-field" placeholder="Company Name">

</div>

<div class="btn-row">

<button class="btn" onclick="saveSupplier()">
SAVE SUPPLIER
</button>

</div>

<div class="tile-grid" id="supplierContainer"></div>

</div>

<!-- INVOICE SECTION -->

<div class="section-box">

<div class="section-title">
Supplier Invoice Input
</div>

<div class="form-grid">

<select id="invoiceSupplier" class="input-field"></select>

<input type="date" id="invoiceDate" class="input-field">

<input type="date" id="commencementDate" class="input-field">

<input type="text" id="invoiceNo" class="input-field" readonly placeholder="Auto Invoice No">

</div>

<div class="invoice-headings">

<div>NO</div>
<div>ITEM</div>
<div>QTY</div>
<div>RATE</div>
<div>TOTAL</div>

</div>

<div id="invoiceItems"></div>

<div class="btn-row">

<button class="btn" onclick="addInvoiceItem()">
+ ADD ITEM
</button>

</div>

<br>

<textarea id="invoiceNotes" placeholder="Invoice Notes"></textarea>

<br><br>

<h3>
Grand Total :
<span class="amount" id="grandTotal">
₫ 0
</span>
</h3>

<div class="btn-row">

<button class="btn" onclick="saveInvoice()">
SAVE INVOICE
</button>

<button class="btn btn-red" onclick="clearInvoiceForm()">
CLEAR
</button>

</div>

<div class="tile-grid" id="invoiceContainer"></div>

</div>

<!-- PAYMENT SECTION -->

<div class="section-box">

<div class="section-title">
Payment Entry
</div>

<div class="form-grid">

<select id="paymentSupplier" class="input-field" onchange="loadInvoiceDropdown()"></select>

<select id="paymentInvoice" class="input-field"></select>

<input type="number" id="paidAmount" class="input-field" placeholder="Paid Amount">

<input type="date" id="paymentDate" class="input-field">

</div>

<br>

<textarea id="paymentNotes" placeholder="Payment Notes"></textarea>

<div class="btn-row">

<button class="btn" onclick="savePayment()">
SAVE PAYMENT
</button>

</div>

</div>

<!-- STATEMENT -->

<div class="section-box">

<div class="section-title">
Supplier Statement
</div>

<div class="form-grid">

<select id="statementSupplier" class="input-field"></select>

<input type="date" id="statementFrom" class="input-field">

<input type="date" id="statementTo" class="input-field">

</div>

<div class="btn-row">

<button class="btn btn-blue" onclick="downloadStatementPDF()">
DOWNLOAD PDF
</button>

</div>

</div>

<!-- PAYMENT STATUS -->

<div class="section-box">

<div class="section-title">
Payment Status
</div>

<div class="tile-grid" id="paymentStatusContainer"></div>

</div>

</div>

<script type="module">

import {
initializeApp
} from "https://www.gstatic.com/firebasejs/12.13.0/firebase-app.js";

import {
getFirestore,
collection,
addDoc,
onSnapshot,
updateDoc,
deleteDoc,
doc
} from "https://www.gstatic.com/firebasejs/12.13.0/firebase-firestore.js";

const firebaseConfig = {

apiKey: "AIzaSyALSpB73XK5DiR2Ut59NSkKmalPkUGb49c",

authDomain: "travelog-itinerary.firebaseapp.com",

projectId: "travelog-itinerary",

storageBucket: "travelog-itinerary.firebasestorage.app",

messagingSenderId: "33567258851",

appId: "1:33567258851:web:790e8f165a3d917bf7edd6"

};

const app = initializeApp(firebaseConfig);

const db = getFirestore(app);

window.db=db;
window.collection=collection;
window.addDoc=addDoc;
window.onSnapshot=onSnapshot;
window.updateDoc=updateDoc;
window.deleteDoc=deleteDoc;
window.doc=doc;

</script>

<script>

let allSuppliers=[];
let allInvoices=[];
let allPayments=[];
let editingInvoiceId=null;
let editingPaymentId=null;

function formatCurrency(amount){

return '₫ ' +
new Intl.NumberFormat('vi-VN')
.format(amount || 0);

}

function generateInvoiceNo(){

const invoiceNo =
"INV-" +
new Date().getFullYear() +
"-" +
String(Date.now()).slice(-6);

document.getElementById('invoiceNo').value =
invoiceNo;

}

function addInvoiceItem(){

document.getElementById('invoiceItems')
.insertAdjacentHTML('beforeend',`

<div class="invoice-item">

<div class="invoice-grid">

<input type="number"
class="input-field line-no"
placeholder="No">

<input type="text"
class="input-field item-name"
placeholder="Item">

<input type="number"
class="input-field qty"
placeholder="Qty"
oninput="calculateTotals()">

<input type="number"
class="input-field rate"
placeholder="Rate"
oninput="calculateTotals()">

<input type="number"
class="input-field total"
placeholder="Total"
readonly>

</div>

</div>

`);

}

function calculateTotals(){

let grandTotal=0;

document.querySelectorAll('.invoice-item')
.forEach(item=>{

const qty =
Number(item.querySelector('.qty').value)||0;

const rate =
Number(item.querySelector('.rate').value)||0;

const total = qty * rate;

item.querySelector('.total').value = total;

grandTotal += total;

});

document.getElementById('grandTotal')
.innerText = formatCurrency(grandTotal);

}

async function saveSupplier(){

await addDoc(collection(db,'suppliers'),{

name:
document.getElementById('supplierName').value,

country:
document.getElementById('supplierCountry').value,

company:
document.getElementById('supplierCompany').value,

created:new Date().toISOString()

});

alert('Supplier Saved');

}

async function saveInvoice(){

const items =
[...document.querySelectorAll('.invoice-item')]
.map(item=>({

line:item.querySelector('.line-no').value,

item:item.querySelector('.item-name').value,

qty:item.querySelector('.qty').value,

rate:item.querySelector('.rate').value,

total:item.querySelector('.total').value

}));

const grandTotal =
items.reduce((sum,item)=>
sum + Number(item.total || 0),0);

if(editingInvoiceId){

await updateDoc(
doc(db,'supplierInvoices',editingInvoiceId),
{

supplier:
document.getElementById('invoiceSupplier').value,

invoiceDate:
document.getElementById('invoiceDate').value,

commencementDate:
document.getElementById('commencementDate').value,

items,

notes:
document.getElementById('invoiceNotes').value,

grandTotal

}

);

alert('Invoice Updated');

editingInvoiceId=null;

}else{

await addDoc(collection(db,'supplierInvoices'),{

invoiceNo:
document.getElementById('invoiceNo').value,

supplier:
document.getElementById('invoiceSupplier').value,

invoiceDate:
document.getElementById('invoiceDate').value,

commencementDate:
document.getElementById('commencementDate').value,

items,

notes:
document.getElementById('invoiceNotes').value,

grandTotal,

created:new Date().toISOString()

});

alert('Invoice Saved');

}

clearInvoiceForm();

}

function clearInvoiceForm(){

document.getElementById('invoiceItems').innerHTML='';

document.getElementById('invoiceNotes').value='';

addInvoiceItem();

calculateTotals();

generateInvoiceNo();

editingInvoiceId=null;

}

async function savePayment(){

const paymentData = {

supplier:
document.getElementById('paymentSupplier').value,

invoiceId:
document.getElementById('paymentInvoice').value,

amount:
Number(document.getElementById('paidAmount').value),

paymentDate:
document.getElementById('paymentDate').value,

notes:
document.getElementById('paymentNotes').value

};

if(editingPaymentId){

await updateDoc(
doc(db,'supplierPayments',editingPaymentId),
paymentData
);

alert('Payment Updated');

editingPaymentId=null;

}else{

paymentData.created =
new Date().toISOString();

await addDoc(
collection(db,'supplierPayments'),
paymentData
);

alert('Payment Saved');

}

clearPaymentForm();

}

function clearPaymentForm(){

document.getElementById('paymentSupplier').value='';

document.getElementById('paymentInvoice').innerHTML=
'<option value="">Select Invoice</option>';

document.getElementById('paidAmount').value='';

document.getElementById('paymentDate').value='';

document.getElementById('paymentNotes').value='';

editingPaymentId=null;

}

function loadSuppliers(){

onSnapshot(collection(db,'suppliers'),snapshot=>{

allSuppliers=[];

snapshot.forEach(docItem=>{

allSuppliers.push({
id:docItem.id,
...docItem.data()
});

});

let html='';
let options='<option value="">Select Supplier</option>';

allSuppliers.forEach(s=>{

options += `
<option value="${s.name}">
${s.name}
</option>
`;

html += `

<div class="tile"
onclick="this.classList.toggle('active')">

<div class="tile-head">

<div>

<div class="tile-title">
${s.name}
</div>

<div class="tile-sub">
${s.country || ''}
</div>

</div>

</div>

<div class="tile-details">

<div class="tile-block">
Company :
${s.company || '-'}
</div>

</div>

</div>

`;

});

document.getElementById('supplierContainer').innerHTML=html;

document.getElementById('invoiceSupplier').innerHTML=options;
document.getElementById('paymentSupplier').innerHTML=options;
document.getElementById('statementSupplier').innerHTML=options;

});

}

function renderInvoices(){

let html='';

allInvoices.forEach(inv=>{

const totalPaid =
allPayments
.filter(p=>p.invoiceId===inv.id)
.reduce((sum,p)=>
sum + Number(p.amount || 0),0);

const balance =
Number(inv.grandTotal || 0) - totalPaid;

let badge='pending';
let badgeText='PENDING';

if(balance<=0){
badge='paid';
badgeText='PAID';
}else if(totalPaid>0){
badge='partial';
badgeText='PARTIAL';
}

html += `

<div class="tile"
onclick="this.classList.toggle('active')">

<div class="tile-head">

<div>

<div class="tile-title">
${inv.supplier}
</div>

<div class="tile-sub">
${inv.invoiceNo}
</div>

</div>

<div>
<span class="badge ${badge}">
${badgeText}
</span>
</div>

</div>

<div class="tile-details">

<div class="tile-block">

Invoice Date:
${inv.invoiceDate}
<br>

Commencement:
${inv.commencementDate}
<br><br>

Invoice:
<span class="amount">
${formatCurrency(inv.grandTotal)}
</span>
<br>

Paid:
<span class="amount">
${formatCurrency(totalPaid)}
</span>
<br>

Balance:
<span class="amount">
${formatCurrency(balance)}
</span>

</div>

<div class="tile-block">

<b>Invoice Items</b>
<br><br>

${inv.items.map(item=>`

<div style="
margin-bottom:10px;
padding-bottom:10px;
border-bottom:1px solid #eee;
">

${item.line}. ${item.item}
<br>

Qty: ${item.qty}
<br>

Rate: ${formatCurrency(item.rate)}
<br>

Total:
<span class="amount">
${formatCurrency(item.total)}
</span>

</div>

`).join('')}

</div>

<div class="btn-row">

<button
class="btn btn-blue"
onclick="event.stopPropagation();editInvoice('${inv.id}')">

EDIT

</button>

<button
class="btn btn-red"
onclick="event.stopPropagation();deleteInvoice('${inv.id}')">

DELETE

</button>

</div>

</div>

</div>

`;

});

document.getElementById('invoiceContainer').innerHTML=html;

}

function loadInvoices(){

onSnapshot(collection(db,'supplierInvoices'),snapshot=>{

allInvoices=[];

snapshot.forEach(docItem=>{

allInvoices.push({
id:docItem.id,
...docItem.data()
});

});

renderInvoices();

renderPaymentStatus();

updateSummary();

});

}

function loadPayments(){

onSnapshot(collection(db,'supplierPayments'),snapshot=>{

allPayments=[];

snapshot.forEach(docItem=>{

allPayments.push({
id:docItem.id,
...docItem.data()
});

});

renderInvoices();

renderPaymentStatus();

updateSummary();

});

}

async function editInvoice(id){

const invoice =
allInvoices.find(i=>i.id===id);

if(!invoice) return;

editingInvoiceId=id;

document.getElementById('invoiceSupplier').value =
invoice.supplier || '';

document.getElementById('invoiceDate').value =
invoice.invoiceDate || '';

document.getElementById('commencementDate').value =
invoice.commencementDate || '';

document.getElementById('invoiceNo').value =
invoice.invoiceNo || '';

document.getElementById('invoiceNotes').value =
invoice.notes || '';

document.getElementById('invoiceItems').innerHTML='';

(invoice.items || []).forEach(item=>{

document.getElementById('invoiceItems')
.insertAdjacentHTML('beforeend',`

<div class="invoice-item">

<div class="invoice-grid">

<input type="number"
class="input-field line-no"
value="${item.line || ''}">

<input type="text"
class="input-field item-name"
value="${item.item || ''}">

<input type="number"
class="input-field qty"
value="${item.qty || ''}"
oninput="calculateTotals()">

<input type="number"
class="input-field rate"
value="${item.rate || ''}"
oninput="calculateTotals()">

<input type="number"
class="input-field total"
value="${item.total || ''}"
readonly>

</div>

</div>

`);

});

calculateTotals();

window.scrollTo({
top:0,
behavior:'smooth'
});

alert('Invoice Loaded');

}

async function deleteInvoice(id){

if(!confirm('Delete Invoice?'))
return;

await deleteDoc(
doc(db,'supplierInvoices',id)
);

alert('Invoice Deleted');

}

function loadInvoiceDropdown(){

const supplier =
document.getElementById('paymentSupplier').value;

const invoices =
allInvoices.filter(i=>i.supplier===supplier);

let html='<option value="">Select Invoice</option>';

invoices.forEach(inv=>{

html += `

<option value="${inv.id}">
${inv.invoiceNo}
</option>

`;

});

document.getElementById('paymentInvoice').innerHTML=html;

}

function renderPaymentStatus(){

let html='';

allSuppliers.forEach(supplier=>{

const supplierInvoices =
allInvoices.filter(i=>
i.supplier===supplier.name
);

const totalInvoice =
supplierInvoices.reduce((sum,i)=>
sum + Number(i.grandTotal || 0),0);

const totalPaid =
allPayments
.filter(payment=>{

return supplierInvoices.some(inv=>

payment.invoiceId===inv.id ||
payment.invoiceId===inv.invoiceNo ||
payment.invoiceNo===inv.invoiceNo

);

})
.reduce((sum,p)=>
sum + Number(p.amount || 0),0);

const balance =
totalInvoice-totalPaid;

html += `

<div class="tile"
onclick="this.classList.toggle('active')">

<div class="tile-head">

<div>

<div class="tile-title">
${supplier.name}
</div>

<div class="tile-sub">
${supplier.country || ''}
</div>

</div>

<div class="amount">
${formatCurrency(balance)}
</div>

</div>

<div class="tile-details">

<div class="tile-block">

Total Invoice :
<span class="amount">
${formatCurrency(totalInvoice)}
</span>
<br>

Total Paid :
<span class="amount">
${formatCurrency(totalPaid)}
</span>
<br>

Balance :
<span class="amount">
${formatCurrency(balance)}
</span>

</div>

${supplierInvoices.map(inv=>{

const relatedPayments =
allPayments.filter(payment=>

payment.invoiceId===inv.id ||
payment.invoiceId===inv.invoiceNo ||
payment.invoiceNo===inv.invoiceNo

);

const paid =
relatedPayments.reduce((sum,p)=>
sum + Number(p.amount || 0),0);

const pending =
Number(inv.grandTotal || 0) - paid;

return `

<div class="tile-block">

<b>${inv.invoiceNo}</b>
<br>

Invoice Date :
${inv.invoiceDate || '-'}
<br>

Invoice :
${formatCurrency(inv.grandTotal)}
<br>

Paid :
${formatCurrency(paid)}
<br>

Balance :
${formatCurrency(pending)}

${relatedPayments.length ? `

<br><br>
<b>Payments</b>

${relatedPayments.map(pay=>`

<div style="
margin-top:8px;
padding:8px;
background:#f8f8f8;
border-radius:8px;
">

Date :
${pay.paymentDate || '-'}
<br>

Amount :
<span class="amount">
${formatCurrency(pay.amount)}
</span>

${pay.notes ? `
<br>
Note : ${pay.notes}
` : ''}

</div>

`).join('')}

` : `

<br><br>
<span style="color:#999;">
No Payments Added
</span>

`}

</div>

`;

}).join('')}

</div>

</div>

`;

});

document.getElementById('paymentStatusContainer').innerHTML=html;

}

function updateSummary(){

const totalInvoice =
allInvoices.reduce((sum,i)=>
sum + Number(i.grandTotal || 0),0);

const totalPaid =
allPayments.reduce((sum,p)=>
sum + Number(p.amount || 0),0);

const totalBalance =
totalInvoice-totalPaid;

document.getElementById('totalInvoice')
.innerText = formatCurrency(totalInvoice);

document.getElementById('totalPaid')
.innerText = formatCurrency(totalPaid);

document.getElementById('totalBalance')
.innerText = formatCurrency(totalBalance);

}

async function downloadStatementPDF(){

const supplier =
document.getElementById('statementSupplier').value;

const fromDate =
document.getElementById('statementFrom').value;

const toDate =
document.getElementById('statementTo').value;

const supplierInvoices =
allInvoices.filter(inv=>{

if(inv.supplier !== supplier)
return false;

if(fromDate && inv.invoiceDate < fromDate)
return false;

if(toDate && inv.invoiceDate > toDate)
return false;

return true;

});

const { jsPDF } = window.jspdf;

const pdf = new jsPDF();

let y=20;

pdf.setFontSize(18);

pdf.text(
"SUPPLIER ACCOUNT STATEMENT",
20,
y
);

y += 12;

pdf.setFontSize(11);

pdf.text(
`Supplier: ${supplier}`,
20,
y
);

y += 8;

pdf.text(
`Period: ${fromDate || '-'} to ${toDate || '-'}`,
20,
y
);

y += 15;

let totalInvoice=0;
let totalPaid=0;

supplierInvoices.forEach(inv=>{

const payments =
allPayments.filter(
p=>p.invoiceId===inv.id
);

const paid =
payments.reduce((sum,p)=>
sum + Number(p.amount || 0),0);

const balance =
Number(inv.grandTotal || 0)-paid;

totalInvoice += Number(inv.grandTotal || 0);
totalPaid += paid;

pdf.setFontSize(13);

pdf.text(
`${inv.invoiceNo}`,
20,
y
);

y += 8;

pdf.setFontSize(10);

pdf.text(
`Invoice Date: ${inv.invoiceDate}`,
20,
y
);

y += 6;

pdf.text(
`Commencement: ${inv.commencementDate}`,
20,
y
);

y += 8;

pdf.text("DATE",20,y);
pdf.text("PARTICULARS",55,y);
pdf.text("DEBIT",140,y);
pdf.text("CREDIT",175,y);

y += 6;

pdf.line(20,y,190,y);

y += 8;

pdf.text(
inv.invoiceDate,
20,
y
);

pdf.text(
"Invoice Amount",
55,
y
);

pdf.text(
formatCurrency(inv.grandTotal),
140,
y
);

y += 8;

payments.forEach(pay=>{

pdf.text(
pay.paymentDate || '-',
20,
y
);

pdf.text(
"Payment",
55,
y
);

pdf.text(
formatCurrency(pay.amount),
175,
y
);

y += 8;

});

pdf.text(
"Balance",
55,
y
);

pdf.text(
formatCurrency(balance),
140,
y
);

y += 12;

pdf.line(20,y,190,y);

y += 12;

if(y > 260){

pdf.addPage();

y=20;

}

});

const finalBalance =
totalInvoice-totalPaid;

pdf.setFontSize(13);

pdf.text(
"SUMMARY",
20,
y
);

y += 10;

pdf.setFontSize(11);

pdf.text(
`Total Invoice : ${formatCurrency(totalInvoice)}`,
20,
y
);

y += 8;

pdf.text(
`Total Paid : ${formatCurrency(totalPaid)}`,
20,
y
);

y += 8;

pdf.text(
`Balance : ${formatCurrency(finalBalance)}`,
20,
y
);

pdf.save(
supplier + "-statement.pdf"
);

}

window.addEventListener('load',()=>{

generateInvoiceNo();

addInvoiceItem();

loadSuppliers();

loadInvoices();

loadPayments();

});

</script>

</body>

</html>
