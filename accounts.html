<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Accounts Platform | Travelog</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
background:#f4f7fb;
padding:30px 20px;
color:#222;
}

.wrapper{
max-width:1600px;
margin:auto;
}

.page-title{
font-size:42px;
font-weight:700;
text-align:center;
margin-bottom:10px;
}

.page-subtitle{
text-align:center;
color:#666;
margin-bottom:35px;
}

.dashboard-grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(240px,1fr));
gap:20px;
margin-bottom:30px;
}

.dashboard-card{
background:#fff;
padding:28px;
border-radius:24px;
border:1px solid #E4ECE9;
box-shadow:0 8px 25px rgba(0,0,0,.04);
}

.dashboard-label{
font-size:14px;
font-weight:600;
color:#666;
margin-bottom:10px;
}

.dashboard-value{
font-size:32px;
font-weight:700;
color:#1D9E75;
}

.tabs{
display:flex;
justify-content:center;
gap:15px;
flex-wrap:wrap;
margin-bottom:30px;
}

.tab-btn{
padding:12px 24px;
border:none;
border-radius:999px;
background:#fff;
border:1px solid #ddd;
font-weight:600;
cursor:pointer;
}

.tab-btn.active{
background:#1D9E75;
color:#fff;
border-color:#1D9E75;
}

.top-actions{
display:flex;
justify-content:center;
gap:15px;
flex-wrap:wrap;
margin-bottom:30px;
}

.action-btn{
background:#1D9E75;
color:#fff;
border:none;
padding:14px 24px;
border-radius:40px;
font-weight:600;
cursor:pointer;
transition:.3s;
}

.action-btn:hover{
background:#0F6E56;
transform:translateY(-2px);
}

.search-box{
max-width:500px;
margin:0 auto 30px;
}

.search-input{
width:100%;
padding:16px;
border-radius:16px;
border:1px solid #ddd;
font-size:15px;
outline:none;
}

.form-box{
background:#fff;
padding:30px;
border-radius:24px;
border:1px solid #E4ECE9;
box-shadow:0 8px 30px rgba(0,0,0,.04);
margin-bottom:35px;
display:none;
}

.section-title{
font-size:22px;
font-weight:700;
margin-bottom:20px;
}

.form-grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(240px,1fr));
gap:18px;
}

.input-field,
select,
textarea{
width:100%;
padding:14px;
border-radius:14px;
border:1px solid #ddd;
font-size:15px;
outline:none;
}

textarea{
resize:vertical;
min-height:120px;
}

.save-btn{
margin-top:25px;
background:#1D9E75;
color:#fff;
border:none;
padding:15px 28px;
border-radius:40px;
font-size:16px;
font-weight:700;
cursor:pointer;
}

.data-grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(380px,1fr));
gap:24px;
}

.list-tile{
background:#fff;
border-radius:24px;
padding:24px;
border:1px solid #E4ECE9;
box-shadow:0 8px 25px rgba(0,0,0,.04);
cursor:pointer;
overflow:hidden;
transition:.3s;
}

.list-tile:hover{
transform:translateY(-3px);
}

.list-head{
display:flex;
justify-content:space-between;
align-items:center;
gap:20px;
}

.invoice-no{
font-size:13px;
font-weight:700;
color:#1D9E75;
margin-bottom:6px;
}

.list-name{
font-size:24px;
font-weight:700;
}

.expand-content{
max-height:0;
overflow:hidden;
transition:.4s ease;
}

.list-tile.active .expand-content{
max-height:2000px;
margin-top:20px;
}

.badge{
padding:8px 16px;
border-radius:999px;
font-size:12px;
font-weight:700;
color:#fff;
}

.sales-badge{
background:#0077ff;
}

.purchase-badge{
background:#ff9800;
}

.customer-badge{
background:#673ab7;
}

.supplier-badge{
background:#795548;
}

.detail{
margin-bottom:12px;
font-size:15px;
line-height:1.7;
color:#555;
}

.label{
font-weight:700;
color:#222;
}

.amount{
font-weight:700;
color:#1D9E75;
}

.action-row{
display:flex;
gap:10px;
margin-top:20px;
flex-wrap:wrap;
}

.edit-btn,
.delete-btn,
.pdf-btn{
border:none;
padding:10px 16px;
border-radius:12px;
font-weight:600;
color:#fff;
cursor:pointer;
}

.edit-btn{
background:#0B3D91;
}

.delete-btn{
background:#ff4d4f;
}

.pdf-btn{
background:#ff5722;
}

.hidden{
display:none;
}

@media(max-width:768px){

.page-title{
font-size:32px;
}

.form-box{
padding:20px;
}

.list-head{
flex-direction:column;
align-items:flex-start;
}

}

</style>

</head>

<body>

<div class="wrapper">

<h1 class="page-title">
Accounts Platform
</h1>

<p class="page-subtitle">
Purchase & Sales Tracker
</p>

<div class="dashboard-grid">

<div class="dashboard-card">
<div class="dashboard-label">Total Sales</div>
<div class="dashboard-value" id="totalSales">₹ 0</div>
</div>

<div class="dashboard-card">
<div class="dashboard-label">Total Purchases</div>
<div class="dashboard-value" id="totalPurchases">₫ 0</div>
</div>

<div class="dashboard-card">
<div class="dashboard-label">Pending Receivable</div>
<div class="dashboard-value" id="pendingReceivable">₹ 0</div>
</div>

<div class="dashboard-card">
<div class="dashboard-label">Pending Payable</div>
<div class="dashboard-value" id="pendingPayable">₫ 0</div>
</div>

</div>

<div class="tabs">

<button class="tab-btn active" onclick="showTab('sales',this)">
Sales
</button>

<button class="tab-btn" onclick="showTab('purchases',this)">
Purchases
</button>

<button class="tab-btn" onclick="showTab('customers',this)">
Customers
</button>

<button class="tab-btn" onclick="showTab('suppliers',this)">
Suppliers
</button>

</div>

<div class="top-actions">

<button class="action-btn" onclick="toggleForm('salesForm')">
+ Add Sale
</button>

<button class="action-btn" onclick="toggleForm('purchaseForm')">
+ Add Purchase
</button>

<button class="action-btn" onclick="toggleForm('customerForm')">
+ Add Customer
</button>

<button class="action-btn" onclick="toggleForm('supplierForm')">
+ Add Supplier
</button>

</div>

<div class="search-box">

<input
type="text"
class="search-input"
placeholder="Search..."
onkeyup="searchCards(this.value)">

</div>

<!-- SALES FORM -->

<div class="form-box" id="salesForm">

<div class="section-title">
Add Sale
</div>

<div class="form-grid">

<input type="text" id="saleCustomer" class="input-field" placeholder="Customer Name">

<input type="text" id="salePackage" class="input-field" placeholder="Package / Product">

<input type="text" id="salePerson" class="input-field" placeholder="Sales Person">

<input type="number" id="saleAmount" class="input-field" placeholder="Invoice Amount ₹">

<input type="number" id="saleReceived" class="input-field" placeholder="Amount Received ₹">

<select id="saleStatus" class="input-field">
<option>PAYMENT PENDING</option>
<option>PARTIAL PAYMENT</option>
<option>PAYMENT COMPLETED</option>
</select>

<textarea id="saleNotes" placeholder="Notes"></textarea>

</div>

<button class="save-btn" onclick="saveSale()">
SAVE SALE
</button>

</div>

<!-- PURCHASE FORM -->

<div class="form-box" id="purchaseForm">

<div class="section-title">
Add Purchase
</div>

<div class="form-grid">

<input type="text" id="purchaseSupplier" class="input-field" placeholder="Supplier Name">

<input type="text" id="purchaseService" class="input-field" placeholder="Service Type">

<input type="number" id="purchaseAmount" class="input-field" placeholder="Purchase Amount ₫">

<input type="number" id="purchasePaid" class="input-field" placeholder="Paid Amount ₫">

<select id="purchaseStatus" class="input-field">
<option>PAYMENT PENDING</option>
<option>PARTIAL PAYMENT</option>
<option>PAYMENT COMPLETED</option>
</select>

<textarea id="purchaseNotes" placeholder="Notes"></textarea>

</div>

<button class="save-btn" onclick="savePurchase()">
SAVE PURCHASE
</button>

</div>

<!-- CUSTOMER FORM -->

<div class="form-box" id="customerForm">

<div class="section-title">
Add Customer
</div>

<div class="form-grid">

<input type="text" id="customerName" class="input-field" placeholder="Customer Name">

<input type="text" id="customerPhone" class="input-field" placeholder="Phone">

<input type="email" id="customerEmail" class="input-field" placeholder="Email">

<input type="text" id="customerCompany" class="input-field" placeholder="Company">

<textarea id="customerNotes" placeholder="Notes"></textarea>

</div>

<button class="save-btn" onclick="saveCustomer()">
SAVE CUSTOMER
</button>

</div>

<!-- SUPPLIER FORM -->

<div class="form-box" id="supplierForm">

<div class="section-title">
Add Supplier
</div>

<div class="form-grid">

<input type="text" id="supplierName" class="input-field" placeholder="Supplier Name">

<input type="text" id="supplierCountry" class="input-field" placeholder="Country">

<input type="text" id="supplierContact" class="input-field" placeholder="Contact">

<input type="text" id="supplierTerms" class="input-field" placeholder="Payment Terms">

<textarea id="supplierNotes" placeholder="Notes"></textarea>

</div>

<button class="save-btn" onclick="saveSupplier()">
SAVE SUPPLIER
</button>

</div>

<div id="salesTab">
<div class="data-grid" id="salesContainer"></div>
</div>

<div id="purchasesTab" class="hidden">
<div class="data-grid" id="purchaseContainer"></div>
</div>

<div id="customersTab" class="hidden">
<div class="data-grid" id="customerContainer"></div>
</div>

<div id="suppliersTab" class="hidden">
<div class="data-grid" id="supplierContainer"></div>
</div>

</div>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.13.0/firebase-app.js";

import {
getFirestore,
collection,
addDoc,
onSnapshot,
deleteDoc,
doc,
updateDoc,
getDoc
}
from "https://www.gstatic.com/firebasejs/12.13.0/firebase-firestore.js";

const firebaseConfig = {

apiKey: "YOUR_API_KEY",
authDomain: "YOUR_AUTH_DOMAIN",
projectId: "YOUR_PROJECT_ID",
storageBucket: "YOUR_STORAGE_BUCKET",
messagingSenderId: "YOUR_MESSAGING_ID",
appId: "YOUR_APP_ID"

};

const app = initializeApp(firebaseConfig);

const db = getFirestore(app);

window.db = db;
window.collection = collection;
window.addDoc = addDoc;
window.onSnapshot = onSnapshot;
window.deleteDoc = deleteDoc;
window.doc = doc;
window.updateDoc = updateDoc;
window.getDoc = getDoc;

</script>

<script>

let editingSaleId = null;
let editingPurchaseId = null;
let editingCustomerId = null;
let editingSupplierId = null;

function toggleForm(id){

const form = document.getElementById(id);

form.style.display =
form.style.display === "block"
? "none"
: "block";

}

function showTab(tab,btn){

document.querySelectorAll('.tab-btn')
.forEach(b=>b.classList.remove('active'));

btn.classList.add('active');

document.getElementById('salesTab').classList.add('hidden');
document.getElementById('purchasesTab').classList.add('hidden');
document.getElementById('customersTab').classList.add('hidden');
document.getElementById('suppliersTab').classList.add('hidden');

document.getElementById(tab + 'Tab').classList.remove('hidden');

}

async function saveSale(){

const data = {

customer:
document.getElementById('saleCustomer').value,

package:
document.getElementById('salePackage').value,

salesPerson:
document.getElementById('salePerson').value,

amount:
Number(document.getElementById('saleAmount').value),

received:
Number(document.getElementById('saleReceived').value),

status:
document.getElementById('saleStatus').value,

notes:
document.getElementById('saleNotes').value,

created:
new Date().toISOString()

};

if(editingSaleId){

await updateDoc(doc(db,"sales",editingSaleId),data);

editingSaleId = null;

alert("Sale Updated");

}else{

await addDoc(collection(db,"sales"),data);

alert("Sale Saved");

}

}

async function savePurchase(){

const data = {

supplier:
document.getElementById('purchaseSupplier').value,

service:
document.getElementById('purchaseService').value,

amount:
Number(document.getElementById('purchaseAmount').value),

paid:
Number(document.getElementById('purchasePaid').value),

status:
document.getElementById('purchaseStatus').value,

notes:
document.getElementById('purchaseNotes').value,

created:
new Date().toISOString()

};

if(editingPurchaseId){

await updateDoc(doc(db,"purchases",editingPurchaseId),data);

editingPurchaseId = null;

alert("Purchase Updated");

}else{

await addDoc(collection(db,"purchases"),data);

alert("Purchase Saved");

}

}

async function saveCustomer(){

const data = {

name:
document.getElementById('customerName').value,

phone:
document.getElementById('customerPhone').value,

email:
document.getElementById('customerEmail').value,

company:
document.getElementById('customerCompany').value,

notes:
document.getElementById('customerNotes').value

};

if(editingCustomerId){

await updateDoc(doc(db,"customers",editingCustomerId),data);

editingCustomerId = null;

alert("Customer Updated");

}else{

await addDoc(collection(db,"customers"),data);

alert("Customer Saved");

}

}

async function saveSupplier(){

const data = {

name:
document.getElementById('supplierName').value,

country:
document.getElementById('supplierCountry').value,

contact:
document.getElementById('supplierContact').value,

terms:
document.getElementById('supplierTerms').value,

notes:
document.getElementById('supplierNotes').value

};

if(editingSupplierId){

await updateDoc(doc(db,"suppliers",editingSupplierId),data);

editingSupplierId = null;

alert("Supplier Updated");

}else{

await addDoc(collection(db,"suppliers"),data);

alert("Supplier Saved");

}

}

function loadSales(){

onSnapshot(collection(db,"sales"),snapshot=>{

let html = "";
let total = 0;
let pending = 0;

snapshot.forEach((docItem,index)=>{

const s = docItem.data();

const balance =
Number(s.amount || 0) -
Number(s.received || 0);

total += Number(s.amount || 0);

pending += balance;

html += `

<div class="list-tile searchable"
onclick="this.classList.toggle('active')">

<div class="list-head">

<div>

<div class="invoice-no">
INV-${1000 + index}
</div>

<div class="list-name">
${s.customer || ""}
</div>

</div>

<div class="badge sales-badge">
SALE
</div>

</div>

<div class="expand-content">

<div class="detail">
<span class="label">Package:</span>
${s.package || ""}
</div>

<div class="detail">
<span class="label">Sales Person:</span>
${s.salesPerson || ""}
</div>

<div class="detail">
<span class="label">Invoice:</span>
₹ ${Number(s.amount || 0).toLocaleString()}
</div>

<div class="detail">
<span class="label">Received:</span>
₹ ${Number(s.received || 0).toLocaleString()}
</div>

<div class="detail">
<span class="label">Balance:</span>
₹ ${balance.toLocaleString()}
</div>

<div class="detail">
<span class="label">Status:</span>
${s.status || ""}
</div>

<div class="detail">
<span class="label">Notes:</span>
${s.notes || ""}
</div>

<div class="action-row">

<button class="edit-btn"
onclick="event.stopPropagation();editSale('${docItem.id}')">
Edit
</button>

<button class="pdf-btn"
onclick="event.stopPropagation();downloadSalePDF('${s.customer}',${s.amount})">
PDF
</button>

<button class="delete-btn"
onclick="event.stopPropagation();deleteSale('${docItem.id}')">
Delete
</button>

</div>

</div>

</div>

`;

});

document.getElementById('salesContainer').innerHTML = html;

document.getElementById('totalSales').innerHTML =
`₹ ${total.toLocaleString()}`;

document.getElementById('pendingReceivable').innerHTML =
`₹ ${pending.toLocaleString()}`;

});

}

function loadPurchases(){

onSnapshot(collection(db,"purchases"),snapshot=>{

let html = "";
let total = 0;
let pending = 0;

snapshot.forEach((docItem,index)=>{

const p = docItem.data();

const balance =
Number(p.amount || 0) -
Number(p.paid || 0);

total += Number(p.amount || 0);

pending += balance;

html += `

<div class="list-tile searchable"
onclick="this.classList.toggle('active')">

<div class="list-head">

<div>

<div class="invoice-no">
PUR-${1000 + index}
</div>

<div class="list-name">
${p.supplier || ""}
</div>

</div>

<div class="badge purchase-badge">
PURCHASE
</div>

</div>

<div class="expand-content">

<div class="detail">
<span class="label">Service:</span>
${p.service || ""}
</div>

<div class="detail">
<span class="label">Amount:</span>
₫ ${Number(p.amount || 0).toLocaleString()}
</div>

<div class="detail">
<span class="label">Paid:</span>
₫ ${Number(p.paid || 0).toLocaleString()}
</div>

<div class="detail">
<span class="label">Balance:</span>
₫ ${balance.toLocaleString()}
</div>

<div class="detail">
<span class="label">Status:</span>
${p.status || ""}
</div>

<div class="detail">
<span class="label">Notes:</span>
${p.notes || ""}
</div>

<div class="action-row">

<button class="edit-btn"
onclick="event.stopPropagation();editPurchase('${docItem.id}')">
Edit
</button>

<button class="pdf-btn"
onclick="event.stopPropagation();downloadPurchasePDF('${p.supplier}',${p.amount})">
PDF
</button>

<button class="delete-btn"
onclick="event.stopPropagation();deletePurchase('${docItem.id}')">
Delete
</button>

</div>

</div>

</div>

`;

});

document.getElementById('purchaseContainer').innerHTML = html;

document.getElementById('totalPurchases').innerHTML =
`₫ ${total.toLocaleString()}`;

document.getElementById('pendingPayable').innerHTML =
`₫ ${pending.toLocaleString()}`;

});

}

async function editSale(id){

const snap = await getDoc(doc(db,"sales",id));

const s = snap.data();

editingSaleId = id;

document.getElementById('salesForm').style.display = "block";

document.getElementById('saleCustomer').value = s.customer || "";
document.getElementById('salePackage').value = s.package || "";
document.getElementById('salePerson').value = s.salesPerson || "";
document.getElementById('saleAmount').value = s.amount || "";
document.getElementById('saleReceived').value = s.received || "";
document.getElementById('saleStatus').value = s.status || "";
document.getElementById('saleNotes').value = s.notes || "";

}

async function editPurchase(id){

const snap = await getDoc(doc(db,"purchases",id));

const p = snap.data();

editingPurchaseId = id;

document.getElementById('purchaseForm').style.display = "block";

document.getElementById('purchaseSupplier').value = p.supplier || "";
document.getElementById('purchaseService').value = p.service || "";
document.getElementById('purchaseAmount').value = p.amount || "";
document.getElementById('purchasePaid').value = p.paid || "";
document.getElementById('purchaseStatus').value = p.status || "";
document.getElementById('purchaseNotes').value = p.notes || "";

}

async function editCustomer(id){

const snap = await getDoc(doc(db,"customers",id));

const c = snap.data();

editingCustomerId = id;

document.getElementById('customerForm').style.display = "block";

document.getElementById('customerName').value = c.name || "";
document.getElementById('customerPhone').value = c.phone || "";
document.getElementById('customerEmail').value = c.email || "";
document.getElementById('customerCompany').value = c.company || "";
document.getElementById('customerNotes').value = c.notes || "";

}

async function editSupplier(id){

const snap = await getDoc(doc(db,"suppliers",id));

const s = snap.data();

editingSupplierId = id;

document.getElementById('supplierForm').style.display = "block";

document.getElementById('supplierName').value = s.name || "";
document.getElementById('supplierCountry').value = s.country || "";
document.getElementById('supplierContact').value = s.contact || "";
document.getElementById('supplierTerms').value = s.terms || "";
document.getElementById('supplierNotes').value = s.notes || "";

}

async function deleteSale(id){

if(!confirm("Delete Sale?")) return;

await deleteDoc(doc(db,"sales",id));

}

async function deletePurchase(id){

if(!confirm("Delete Purchase?")) return;

await deleteDoc(doc(db,"purchases",id));

}

async function deleteCustomer(id){

if(!confirm("Delete Customer?")) return;

await deleteDoc(doc(db,"customers",id));

}

async function deleteSupplier(id){

if(!confirm("Delete Supplier?")) return;

await deleteDoc(doc(db,"suppliers",id));

}

function downloadSalePDF(name,amount){

const { jsPDF } = window.jspdf;

const docu = new jsPDF();

docu.text("SALE INVOICE",20,20);
docu.text("Customer: " + name,20,40);
docu.text("Amount: ₹ " + amount,20,60);

docu.save(name + "-sale.pdf");

}

function downloadPurchasePDF(name,amount){

const { jsPDF } = window.jspdf;

const docu = new jsPDF();

docu.text("PURCHASE INVOICE",20,20);
docu.text("Supplier: " + name,20,40);
docu.text("Amount: ₫ " + amount,20,60);

docu.save(name + "-purchase.pdf");

}

function searchCards(value){

const cards =
document.querySelectorAll('.searchable');

cards.forEach(card=>{

card.style.display =
card.innerText.toLowerCase()
.includes(value.toLowerCase())
? "block"
: "none";

});

}

window.addEventListener('load',()=>{

loadSales();
loadPurchases();
loadCustomers();
loadSuppliers();

});

</script>

</body>

</html>
