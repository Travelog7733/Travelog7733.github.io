<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Places Heading Style</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- Google Font (same clean modern style) -->
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
body {
  margin: 0;
  font-family: 'Poppins', sans-serif;
  background: #ffffff;
  color: #222;
}

/* ===== Ribbon Bar ===== */
.section-header {
  width: 100%;
  background: #2f2f2f;
  padding: 18px 0;
  text-align: center;
}

.section-header .small-title {
  letter-spacing: 6px;
  font-size: 14px;
  color: #ffffff;
  font-weight: 500;
}

/* ===== Big Title ===== */
.section-title {
  font-size: 64px;
  font-weight: 300;
  text-align: center;
  margin: 40px 0 20px;
  color: #222;
}

/* ===== Demo content area ===== */
.demo-content {
  max-width: 1200px;
  margin: 0 auto;
  padding: 20px;
  text-align: center;
  color: #666;
}

/* ===== Mobile ===== */
@media (max-width: 768px) {
  .section-title {
    font-size: 36px;
    margin: 24px 0 16px;
  }

  .section-header .small-title {
    font-size: 12px;
    letter-spacing: 4px;
  }
}
</style>
</head>
<body>

<!-- ===== RIBBON (KEEP YOUR TEXT SAME) ===== -->
<div class="section-header">
  <div class="small-title">PLACES</div>
</div>

<!-- ===== BIG TITLE (KEEP YOUR TEXT SAME) ===== -->
<h1 class="section-title">Top Places Around The World</h1>

<!-- Demo content (you can remove this) -->
<div class="demo-content">
  <p>Your page content goes here…</p>
</div>

</body>
</html>
