<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Travelog | Home</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Google Font: Poppins -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #7dd3fc, #38bdf8, #0ea5e9);
      color: #fff;
      text-transform: uppercase;
    }

    /* ===== Top Ribbon ===== */
    header {
      position: sticky;
      top: 0;
      width: 100%;
      background: rgba(0, 0, 0, 0.75); /* 75% visible black */
      backdrop-filter: blur(4px);
      z-index: 1000;
    }

    .nav-bar {
      max-width: 1200px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      padding: 15px 20px;
    }

    /* Logo on left */
    .logo {
      height: 50px;
      width: auto;
    }

    /* Center menu */
    nav {
      flex: 1;
      display: flex;
      justify-content: center;
      gap: 30px;
    }

    nav a {
      color: #fff;
      text-decoration: none;
      font-weight: 600;
      letter-spacing: 1px;
      transition: opacity 0.2s ease;
    }

    nav a:hover {
      opacity: 0.7;
    }

    /* ===== Main Content ===== */
    main {
      max-width: 1200px;
      margin: 60px auto;
      padding: 0 20px;
    }

    .tiles {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 20px;
    }

    .tile {
      background: rgba(0, 0, 0, 0.35);
      border-radius: 16px;
      padding: 40px 20px;
      text-align: center;
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 1px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.2);
      transition: transform 0.2s ease, background 0.2s ease;
    }

    .tile:hover {
      transform: translateY(-6px);
      background: rgba(0, 0, 0, 0.45);
    }

    /* ===== Responsive ===== */
    @media (max-width: 900px) {
      .tiles {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (max-width: 500px) {
      nav {
        gap: 15px;
        flex-wrap: wrap;
      }

      .tiles {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>

  <!-- ===== Header / Ribbon ===== -->
  <header>
    <div class="nav-bar">
      <!-- Left Logo -->
      <img src="logo.png" alt="Logo" class="logo">

      <!-- Center Menu -->
      <nav>
        <a href="#">Home</a>
        <a href="#">Gallery</a>
        <a href="#">Tour Packages</a>
        <a href="#">About Us</a>
        <a href="#">Contact Us</a>
        <a href="#">Feedback</a>
      </nav>
    </div>
  </header>

  <!-- ===== Main Content ===== -->
  <main>
    <div class="tiles">
      <!-- You can change these headings -->
      <div class="tile">Popular Tours</div>
      <div class="tile">Top Destinations</div>
      <div class="tile">Best Deals</div>
      <div class="tile">Why Choose Us</div>
    </div>
  </main>

</body>
</html>
