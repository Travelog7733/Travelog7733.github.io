<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Travelog | Vietnam Tours</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">

  <style>
    * {
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
    }

    body {
      margin: 0;
      background: #ffffff;
      color: #111;
      min-height: 100vh;
    }

    nav {
      display: flex;
      gap: 20px;
      padding: 14px 24px;
      background: #0b5ed7;
    }

    nav a {
      color: #fff;
      text-decoration: none;
      font-weight: 500;
    }

    /* ===== Glass Hero Header ===== */
    .hero-header {
      position: relative;
      margin: 20px;
      border-radius: 24px;
      padding: 60px 20px 50px;
      text-align: center;

      background: rgba(255, 255, 255, 0.75);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);

      border: 1px solid rgba(0, 0, 0, 0.08);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.12);

      color: #111;
    }

    .hero-header p {
      color: #333;
      font-size: 18px;
      margin-top: 12px;
    }

    /* Center and resize logo */
    .hero-header .brand {
      display: flex;
      justify-content: center;
      align-items: center;
      margin-bottom: 12px;
    }

    .hero-header .logo {
      height: 90px;   /* increase/decrease if needed */
      width: auto;
      display: block;
    }

    /* Plane */
    .plane {
      position: absolute;
      right: 20px;
      bottom: 20px;
      font-size: 32px;
      opacity: 0.7;
    }

    /* Top-right contact buttons */
    .header-contact {
      position: absolute;
      top: 20px;
      right: 20px;
      display: flex;
      gap: 12px;
    }

    .contact-btn {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      background: #0b5ed7;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 16px rgba(0,0,0,0.2);
      text-decoration: none;
      transition: transform 0.2s ease;
    }

    .contact-btn:hover {
      transform: translateY(-2px);
    }

    .contact-btn svg {
      width: 22px;
      height: 22px;
      fill: #fff; /* white vector icons */
    }

    /* Cards */
    .main-content {
      padding: 20px;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
    }

    .card {
      background: #fff;
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 10px 20px rgba(0,0,0,0.08);
    }

    footer {
      text-align: center;
      padding: 20px;
      margin-top: 40px;
      color: #555;
    }

    /* WhatsApp Button */
    .whatsapp-float {
      position: fixed;
      bottom: 100px;
      left: 50%;
      transform: translateX(-50%);
      background: #25D366;
      color: white;
      padding: 14px 28px;
      border-radius: 50px;
      font-weight: 600;
      text-decoration: none;
      box-shadow: 0 10px 20px rgba(0,0,0,0.25);
      z-index: 99;
    }

    /* Social buttons */
    .social-float {
      position: fixed;
      bottom: 30px;
      left: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      z-index: 9999;
    }

    .social-btn {
      width: 52px;
      height: 52px;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 16px rgba(0,0,0,0.25);
      text-decoration: none;
    }

    .social-btn img {
      width: 24px;
      height: 24px;
    }

    .social-btn.instagram {
      background: linear-gradient(45deg, #f58529, #dd2a7b, #8134af);
    }

    .social-btn.facebook {
      background: #1877F2;
    }

    /* Feedback popup */
    .feedback-popup {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: #fff;
      padding: 16px 18px;
      border-radius: 14px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.15);
      max-width: 260px;
      z-index: 9999;
      animation: fadeIn 0.4s ease;
    }

    .feedback-popup .stars {
      color: #f5b301;
      margin: 4px 0;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
