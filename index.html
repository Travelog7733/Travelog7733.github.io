<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Travelog | Vietnam Tours</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="style.css">

<style>
/* Page background so glass effect is visible */
body {
  background: linear-gradient(135deg, #0b5ed7, #0d6efd, #20c997);
  min-height: 100vh;
  margin: 0;
}

/* ===== Desktop Nav (unchanged) ===== */
nav {
  display: flex;
  gap: 20px;
  padding: 20px;
  justify-content: center;
}
nav a {
  color: #fff;
  text-decoration: none;
  font-weight: 600;
}

/* ===== Hamburger (hidden on desktop) ===== */
.hamburger {
  display: none;
  position: fixed;
  top: 20px;
  left: 20px;
  width: 44px;
  height: 44px;
  border-radius: 12px;
  border: 1px solid rgba(255,255,255,0.3);
  background: rgba(255,255,255,0.2);
  backdrop-filter: blur(10px);
  color: #fff;
  font-size: 24px;
  z-index: 10001;
}

/* ===== WhatsApp Button (Floating) ===== */
.whatsapp-float {
  position: fixed;
  bottom: 100px;
  left: 50%;
  transform: translateX(-50%);
  background: #25D366;
  color: white;
  padding: 14px 28px;
  border-radius: 50px;
  font-weight: 600;
  text-decoration: none;
  box-shadow: 0 10px 20px rgba(0,0,0,0.25);
  z-index: 99;
}

/* ===== Social buttons ===== */
.social-float {
  position: fixed;
  bottom: 30px;
  left: 20px;
  display: flex;
  flex-direction: column;
  gap: 12px;
  z-index: 9999;
}
.social-btn {
  width: 52px;
  height: 52px;
  border-radius: 14px;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 8px 16px rgba(0,0,0,0.25);
  text-decoration: none;
}
.social-btn img {
  width: 24px;
  height: 24px;
}
.social-btn.instagram { background: linear-gradient(45deg, #f58529, #dd2a7b, #8134af); }
.social-btn.facebook { background: #1877F2; }

/* ===== Glass Hero Header ===== */
.hero-header {
  position: relative;
  margin: 20px;
  border-radius: 24px;
  padding: 60px 20px;
  text-align: center;
  background: rgba(255, 255, 255, 0.12);
  backdrop-filter: blur(14px);
  border: 1px solid rgba(255, 255, 255, 0.25);
  box-shadow: 0 20px 40px rgba(0, 0, 0, 0.25);
  color: #fff;
}
.hero-header p {
  font-size: 18px;
  margin-top: 12px;
  opacity: 0.95;
}

/* ===== Header Contact Buttons ===== */
.header-contact {
  position: absolute;
  top: 20px;
  right: 20px;
  display: flex;
  gap: 12px;
  z-index: 10;
  transition: transform 0.3s ease, opacity 0.3s ease;
}
.header-contact.hide {
  transform: translateY(-20px);
  opacity: 0;
  pointer-events: none;
}
.header-contact a {
  width: 46px;
  height: 46px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  text-decoration: none;
  backdrop-filter: blur(10px);
  background: rgba(255, 255, 255, 0.18);
  border: 1px solid rgba(255, 255, 255, 0.3);
  box-shadow: 0 8px 20px rgba(0,0,0,0.25);
}
.header-contact svg {
  width: 20px;
  height: 20px;
  fill: white;
}

/* ===== Brand ===== */
.brand {
  display: flex;
  justify-content: center;
}
.logo {
  height: 90px;
  width: auto;
}

/* ===== Cards ===== */
.cards {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 20px;
  padding: 20px;
}
.card {
  background: rgba(255,255,255,0.15);
  border-radius: 16px;
  padding: 20px;
  color: #fff;
}

/* ===== Footer ===== */
footer {
  text-align: center;
  padding: 20px;
  color: #fff;
}

/* ================= MOBILE ONLY CHANGES ================= */
@media (max-width: 768px) {

  /* Show hamburger */
  .hamburger {
    display: block;
  }

  /* Turn nav into sidebar drawer */
  nav {
    position: fixed;
    top: 0;
    left: -100%;
    height: 100vh;
    width: 75%;
    max-width: 280px;
    flex-direction: column;
    align-items: flex-start;
    padding: 80px 20px;
    gap: 16px;
    background: rgba(15, 30, 60, 0.95);
    backdrop-filter: blur(10px);
    transition: left 0.3s ease;
    z-index: 10000;
  }

  body.nav-open nav {
    left: 0;
  }

  nav a {
    font-size: 18px;
  }

  /* Hero spacing smaller */
  .hero-header {
    margin: 12px;
    padding: 40px 16px;
  }

  .logo {
    height: 70px;
  }

  .hero-header p {
    font-size: 16px;
  }

  /* Cards stack */
  .cards {
    grid-template-columns: 1fr;
    padding: 16px;
  }

  /* Buttons scale */
  .whatsapp-float {
    bottom: 90px;
    padding: 12px 22px;
    font-size: 14px;
  }

  .social-float {
    left: 12px;
    bottom: 20px;
  }

  .social-btn {
    width: 46px;
    height: 46px;
  }

  .header-contact {
    top: 16px;
    right: 16px;
  }
}
</style>
</head>

<body>

<button class="hamburger" id="hamburgerBtn">☰</button>

<nav id="mainNav">

  <a href="gallery.html">Gallery</a>

  <a href="about.html">About Us</a>
  <a href="contact.html">Contact</a>
  <a href="feedback.html">Feedback</a>
</n
