<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Accounts Platform | Travelog</title>
<link href="https://fonts.googleapis.com/css2?
family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}
body{
background:#f5f7fb;
padding:40px 20px;
}
.accounts-wrapper{
max-width:1500px;
margin:auto;
}
.page-title{
font-size:38px;
font-weight:700;
text-align:center;
color:#222;
margin-bottom:10px;
}
.page-subtitle{
text-align:center;
color:#666;
margin-bottom:35px;
}
.dashboard-grid{
1
display:grid;
grid-template-columns:repeat(auto-fit,minmax(240px,1fr));
gap:20px;
margin-bottom:35px;
}
.dashboard-card{
background:#fff;
padding:25px;
border-radius:24px;
border:1px solid #E4ECE9;
box-shadow:0 8px 30px rgba(0,0,0,.04);
}
.dashboard-label{
font-size:15px;
color:#666;
margin-bottom:12px;
}
.dashboard-value{
font-size:30px;
font-weight:700;
color:#1D9E75;
}
.top-buttons{
display:flex;
flex-wrap:wrap;
gap:15px;
justify-content:center;
margin-bottom:35px;
}
.action-btn{
background:#1D9E75;
color:#fff;
border:none;
padding:14px 24px;
border-radius:40px;
font-size:15px;
font-weight:600;
cursor:pointer;
transition:.3s;
}
.action-btn:hover{
background:#0F6E56;
transform:translateY(-2px);
}
2
.form-box{
background:#fff;
padding:30px;
border-radius:24px;
border:1px solid #E4ECE9;
box-shadow:0 8px 30px rgba(0,0,0,.04);
margin-bottom:35px;
display:none;
}
.section-title{
font-size:22px;
font-weight:700;
margin-bottom:20px;
color:#222;
}
.form-grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:18px;
}
.input-field,
select,
textarea{
width:100%;
padding:14px;
border-radius:12px;
border:1px solid #dcdcdc;
font-size:15px;
outline:none;
}
.input-field:focus,
select:focus,
textarea:focus{
border-color:#1D9E75;
}
textarea{
resize:vertical;
min-height:120px;
margin-top:18px;
}
.save-btn{
margin-top:30px;
background:#1D9E75;
color:#fff;
border:none;
3
padding:15px 28px;
border-radius:40px;
font-size:16px;
font-weight:700;
cursor:pointer;
}
.records-grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(360px,1fr));
gap:25px;
}
.record-card{
background:#fff;
padding:24px;
border-radius:24px;
border:1px solid #E4ECE9;
box-shadow:0 8px 30px rgba(0,0,0,.04);
}
.record-title{
font-size:22px;
font-weight:700;
margin-bottom:10px;
color:#222;
}
.record-date{
font-size:14px;
color:#666;
margin-bottom:16px;
}
.detail{
margin-bottom:12px;
font-size:15px;
line-height:1.7;
color:#555;
}
.label{
font-weight:700;
color:#222;
}
.amount{
font-weight:700;
color:#1D9E75;
}
4
.card-actions{
display:flex;
gap:10px;
margin-top:20px;
}
.edit-btn,
.delete-btn{
border:none;
padding:10px 16px;
border-radius:10px;
cursor:pointer;
font-weight:600;
color:#fff;
}
.edit-btn{
background:#0B3D91;
}
.delete-btn{
background:#ff4d4f;
}
.type-badge{
display:inline-block;
padding:8px 14px;
border-radius:999px;
font-size:12px;
font-weight:700;
color:#fff;
margin-bottom:14px;
}
.sales{
background:#1D9E75;
}
.purchase{
background:#ff9800;
}
.expense{
background:#0077ff;
}
@media(max-width:768px){
.page-title{
font-size:30px;
}
5
.form-box{
padding:20px;
}
}
</style>
</head>
<body>
<div class="accounts-wrapper">
<h1 class="page-title">
Accounts Platform
</h1>
<p class="page-subtitle">
Manage sales, purchases, expenses and profit tracking
</p>
<div class="dashboard-grid">
<div class="dashboard-card">
<div class="dashboard-label">Total Sales</div>
<div class="dashboard-value" id="totalSales">₹ 0</div>
</div>
<div class="dashboard-card">
<div class="dashboard-label">Total Purchases</div>
<div class="dashboard-value" id="totalPurchases">₹ 0</div>
</div>
<div class="dashboard-card">
<div class="dashboard-label">Total Expenses</div>
<div class="dashboard-value" id="totalExpenses">₹ 0</div>
</div>
<div class="dashboard-card">
<div class="dashboard-label">Net Profit</div>
<div class="dashboard-value" id="netProfit">₹ 0</div>
</div>
</div>
<div class="top-buttons">
<button class="action-btn" onclick="showSalesForm()">
+ ADD SALE
6
</button>
<button class="action-btn" onclick="showPurchaseForm()">
+ ADD PURCHASE
</button>
<button class="action-btn" onclick="showExpenseForm()">
+ ADD EXPENSE
</button>
</div>
<div class="form-box" id="salesForm">
<div class="section-title">
Sales Entry
</div>
<div class="form-grid">
<input type="text" id="saleDate" class="input-field" placeholder="Invoice
Date DD/MM/YYYY" maxlength="10" oninput="formatDate(this)">
<input type="text" id="saleInvoice" class="input-field" placeholder="Invoice
Number">
<input type="text" id="saleCustomer" class="input-field"
placeholder="Customer Name">
<input type="text" id="saleDestination" class="input-field"
placeholder="Destination">
<input type="text" id="salePerson" class="input-field" placeholder="Sales
Person">
<input type="number" id="saleAmount" class="input-field" placeholder="₹ Sale
Amount">
<input type="number" id="saleReceived" class="input-field" placeholder="₹
Amount Received">
<input type="number" id="saleBalance" class="input-field" placeholder="₹
Balance Amount">
<select id="saleStatus" class="input-field">
<option>PAYMENT COMPLETED</option>
<option>ADVANCE RECEIVED</option>
<option>PAYMENT PENDING</option>
</select>
</div>
7
<textarea id="saleNotes" placeholder="Notes"></textarea>
<button class="save-btn" onclick="saveSale()">
SAVE SALE
</button>
</div>
<div class="form-box" id="purchaseForm">
<div class="section-title">
Purchase Entry
</div>
<div class="form-grid">
<input type="text" id="purchaseDate" class="input-field"
placeholder="Purchase Date DD/MM/YYYY" maxlength="10"
oninput="formatDate(this)">
<input type="text" id="supplierName" class="input-field"
placeholder="Supplier Name">
<input type="text" id="purchaseInvoice" class="input-field"
placeholder="Invoice Number">
<input type="number" id="amountVND" class="input-field"
placeholder="₫ Amount in VND">
<input type="text" id="exchangeRate" class="input-field"
placeholder="Exchange Rate" readonly>
<input type="text" id="amountINR" class="input-field" placeholder="₹
Converted INR" readonly>
<select id="purchaseStatus" class="input-field">
<option>PAYMENT COMPLETED</option>
<option>PAYMENT PENDING</option>
</select>
<input type="file" id="purchaseFile" class="input-field">
</div>
<textarea id="purchaseNotes" placeholder="Notes"></textarea>
<button class="save-btn" onclick="savePurchase()">
SAVE PURCHASE
</button>
8
</div>
<div class="form-box" id="expenseForm">
<div class="section-title">
Expense Entry
</div>
<div class="form-grid">
<input type="text" id="expenseDate" class="input-field" placeholder="Expense
Date DD/MM/YYYY" maxlength="10" oninput="formatDate(this)">
<select id="expenseCategory" class="input-field">
<option>Office Expense</option>
<option>Salary</option>
<option>Marketing</option>
<option>Transport</option>
<option>Visa</option>
<option>Miscellaneous</option>
</select>
<input type="text" id="expenseDescription" class="input-field"
placeholder="Expense Description">
<input type="number" id="expenseAmount" class="input-field" placeholder="₹
Expense Amount">
<input type="text" id="expensePaidBy" class="input-field" placeholder="Paid
By">
<input type="file" id="expenseFile" class="input-field">
</div>
<textarea id="expenseNotes" placeholder="Notes"></textarea>
<button class="save-btn" onclick="saveExpense()">
SAVE EXPENSE
</button>
</div>
<div class="records-grid" id="recordsContainer"></div>
</div>
<script type="module">
import {
initializeApp
9
} from "https://www.gstatic.com/firebasejs/12.13.0/firebase-app.js";
import {
getFirestore,
collection,
addDoc,
onSnapshot
} from "https://www.gstatic.com/firebasejs/12.13.0/firebase-firestore.js";
import {
getStorage,
ref,
uploadBytes,
getDownloadURL
} from "https://www.gstatic.com/firebasejs/12.13.0/firebase-storage.js";
const firebaseConfig = {
apiKey: "YOUR_API_KEY",
authDomain: "YOUR_PROJECT.firebaseapp.com",
projectId: "YOUR_PROJECT_ID",
storageBucket: "YOUR_PROJECT.appspot.com",
messagingSenderId: "YOUR_SENDER_ID",
appId: "YOUR_APP_ID"
};
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const storage = getStorage(app);
window.db = db;
window.storage = storage;
window.collection = collection;
window.addDoc = addDoc;
window.onSnapshot = onSnapshot;
window.ref = ref;
window.uploadBytes = uploadBytes;
window.getDownloadURL = getDownloadURL;
</script>
<script>
10
function hideForms(){
const forms = document.querySelectorAll('.form-box');
forms.forEach(form=>{
form.style.display = 'none';
});
}
function showSalesForm(){
hideForms();
document.getElementById('salesForm').style.display='block';
}
function showPurchaseForm(){
hideForms();
document.getElementById('purchaseForm').style.display='block';
}
function showExpenseForm(){
hideForms();
document.getElementById('expenseForm').style.display='block';
}
function formatDate(input){
let value = input.value.replace(/\D/g,'');
if(value.length > 2){
value = value.substring(0,2) + '/' + value.substring(2);
}
if(value.length > 5){
value = value.substring(0,5) + '/' + value.substring(5,9);
}
input.value = value;
}
function convertDate(date){
const parts = date.split('/');
return `${parts[2]}-${parts[1]}-${parts[0]}`;
}
async function fetchExchangeRate(){
11
const date = document.getElementById('purchaseDate').value;
const amountVND = document.getElementById('amountVND').value;
if(!date || !amountVND) return;
const apiDate = convertDate(date);
const response = await fetch(
`https://api.exchangerate.host/${apiDate}?base=VND&symbols=INR`
);
const data = await response.json();
const rate = data.rates.INR;
const amountINR = amountVND * rate;
document.getElementById('exchangeRate').value = rate.toFixed(6);
document.getElementById('amountINR').value = amountINR.toFixed(2);
}
document.getElementById('amountVND').addEventListener('input',fetchExchangeRate);
document.getElementById('purchaseDate').addEventListener('input',fetchExchangeRate);
async function uploadFile(fileInputId,folder){
const file = document.getElementById(fileInputId).files[0];
if(!file) return "";
const storageRef = ref(
storage,
`${folder}/${Date.now()}_${file.name}`
);
await uploadBytes(storageRef,file);
const url = await getDownloadURL(storageRef);
return url;
}
async function saveSale(){
const sale = {
type:'SALE',
12
date:document.getElementById('saleDate').value,
invoice:document.getElementById('saleInvoice').value,
customer:document.getElementById('saleCustomer').value,
destination:document.getElementById('saleDestination').value,
salesPerson:document.getElementById('salePerson').value,
amount:Number(document.getElementById('saleAmount').value || 0),
received:Number(document.getElementById('saleReceived').value || 0),
balance:Number(document.getElementById('saleBalance').value || 0),
status:document.getElementById('saleStatus').value,
notes:document.getElementById('saleNotes').value,
created:new Date().toISOString()
};
await addDoc(collection(db,'salesEntries'),sale);
alert('Sale Saved');
}
async function savePurchase(){
const invoiceURL = await uploadFile('purchaseFile','purchaseInvoices');
const purchase = {
type:'PURCHASE',
date:document.getElementById('purchaseDate').value,
supplier:document.getElementById('supplierName').value,
invoice:document.getElementById('purchaseInvoice').value,
amountVND:Number(document.getElementById('amountVND').value || 0),
exchangeRate:Number(document.getElementById('exchangeRate').value || 0),
amountINR:Number(document.getElementById('amountINR').value || 0),
status:document.getElementById('purchaseStatus').value,
notes:document.getElementById('purchaseNotes').value,
invoiceFile:invoiceURL,
created:new Date().toISOString()
};
await addDoc(collection(db,'purchaseEntries'),purchase);
alert('Purchase Saved');
}
async function saveExpense(){
const expenseFile = await uploadFile('expenseFile','expenseBills');
13
const expense = {
type:'EXPENSE',
date:document.getElementById('expenseDate').value,
category:document.getElementById('expenseCategory').value,
description:document.getElementById('expenseDescription').value,
amount:Number(document.getElementById('expenseAmount').value || 0),
paidBy:document.getElementById('expensePaidBy').value,
notes:document.getElementById('expenseNotes').value,
file:expenseFile,
created:new Date().toISOString()
};
await addDoc(collection(db,'expenseEntries'),expense);
alert('Expense Saved');
}
function loadDashboard(){
let totalSales = 0;
let totalPurchases = 0;
let totalExpenses = 0;
onSnapshot(collection(db,'salesEntries'),snapshot=>{
snapshot.forEach(doc=>{
totalSales += Number(doc.data().amount || 0);
});
document.getElementById('totalSales').innerText = `₹ $
{totalSales.toLocaleString()}`;
const profit = totalSales - totalPurchases - totalExpenses;
document.getElementById('netProfit').innerText = `₹ $
{profit.toLocaleString()}`;
});
onSnapshot(collection(db,'purchaseEntries'),snapshot=>{
snapshot.forEach(doc=>{
totalPurchases += Number(doc.data().amountINR || 0);
14
});
document.getElementById('totalPurchases').innerText = `₹ $
{totalPurchases.toLocaleString()}`;
const profit = totalSales - totalPurchases - totalExpenses;
document.getElementById('netProfit').innerText = `₹ $
{profit.toLocaleString()}`;
});
onSnapshot(collection(db,'expenseEntries'),snapshot=>{
snapshot.forEach(doc=>{
totalExpenses += Number(doc.data().amount || 0);
});
document.getElementById('totalExpenses').innerText = `₹ $
{totalExpenses.toLocaleString()}`;
const profit = totalSales - totalPurchases - totalExpenses;
document.getElementById('netProfit').innerText = `₹ $
{profit.toLocaleString()}`;
});
}
window.addEventListener('load',()=>{
loadDashboard();
});
</script>
</body>
</html>
