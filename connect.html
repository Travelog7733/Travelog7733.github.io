<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Connect | Travelog</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

body{
margin:0;
font-family:'Poppins',sans-serif;
background:#f5f7fb;
}

.connect-page{
min-height:100vh;
display:flex;
align-items:center;
justify-content:center;
padding:40px 20px;
}

.connect-box{
background:#fff;
padding:50px;
border-radius:20px;
text-align:center;
max-width:700px;
width:100%;
box-shadow:0 10px 30px rgba(0,0,0,0.1);
}

.connect-box h1{
font-size:32px;
margin-bottom:10px;
color:#222;
}

.connect-box p{
font-size:16px;
color:#666;
margin-bottom:30px;
line-height:1.6;
}

.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(160px,1fr));
gap:20px;
margin-top:20px;
}

.tile{
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
padding:25px 15px;
border-radius:16px;
text-decoration:none;
color:#222;
border:1px solid #eee;
transition:0.3s ease;
background:#fff;
}

.tile:hover{
transform:translateY(-5px);
box-shadow:0 8px 20px rgba(0,0,0,0.08);
border-color:#ff7a00;
}

.icon{
font-size:28px;
margin-bottom:10px;
}

.label{
font-size:14px;
font-weight:600;
}

/* brand colors */
.whatsapp{color:#25D366;}
.instagram{color:#E1306C;}
.facebook{color:#1877F2;}
.google{color:#DB4437;}
.email{color:#555;}
.website{color:#ff7a00;}

</style>

<!-- Font Awesome -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

</head>

<body>

<div class="connect-page">

<div class="connect-box">

<h1>Connect With Travelog</h1>

<p>
Reach us instantly on your preferred platform. We are always available to assist you.
</p>

<div class="grid">

<a class="tile" href="https://wa.me/917994256121" target="_blank">
<div class="icon whatsapp"><i class="fa-brands fa-whatsapp"></i></div>
<div class="label">WhatsApp</div>
</a>

<a class="tile" href="https://instagram.com/" target="_blank">
<div class="icon instagram"><i class="fa-brands fa-instagram"></i></div>
<div class="label">Instagram</div>
</a>

<a class="tile" href="https://www.facebook.com/" target="_blank">
<div class="icon facebook"><i class="fa-brands fa-facebook"></i></div>
<div class="label">Facebook</div>
</a>

<a class="tile" href="https://search.google.com/local/writereview?placeid=YOUR_PLACE_ID" target="_blank">
<div class="icon google"><i class="fa-brands fa-google"></i></div>
<div class="label">Google Review</div>
</a>

<a class="tile" href="mailto:info@travelog.com">
<div class="icon email"><i class="fa-solid fa-envelope"></i></div>
<div class="label">Email</div>
</a>

<a class="tile" href="https://yourwebsite.com" target="_blank">
<div class="icon website"><i class="fa-solid fa-globe"></i></div>
<div class="label">Website</div>
</a>

</div>

</div>

</div>

</body>
</html>
