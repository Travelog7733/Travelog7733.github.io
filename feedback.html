<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Feedback | Travelog</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">

  <!-- Extra styles for floating buttons -->
  <style>
    /* WhatsApp Button (Floating) */
    .whatsapp-float {
      position: fixed;
      bottom: 75px;
      left: 50%;
      transform: translateX(-50%);
      background: #25D366;
      color: white;
      padding: 14px 28px;
      border-radius: 50px;
      font-weight: 600;
      text-decoration: none;
      box-shadow: 0 10px 20px rgba(0,0,0,0.25);
      z-index: 99;
    }

    /* Social buttons container */
    .social-float {
      position: fixed;
      bottom: 30px;
      left: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      z-index: 9999;
    }

    .social-btn {
      width: 52px;      /* FIXED button size */
      height: 52px;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 16px rgba(0,0,0,0.25);
      text-decoration: none;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .social-btn img {
      width: 24px;      /* FIXED icon size */
      height: 24px;
      display: block;
      object-fit: contain;
    }

    .social-btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 12px 22px rgba(0,0,0,0.3);
    }

    .social-btn.instagram {
      background: linear-gradient(45deg, #f58529, #dd2a7b, #8134af);
    }

    .social-btn.facebook {
      background: #1877F2;
    }
  </style>
</head>
<body>

<nav>
  <a href="index.html">Home</a>
  <a href="gallery.html">Gallery</a>
  <a href="packages.html">Tour Packages</a>
  <a href="about.html">About Us</a>
  <a href="contact.html">Contact</a>
  <a href="feedback.html">Feedback</a>
</nav>

<header class="page-header">
  <div class="brand">
    <img src="logo.png" alt="Travelog Logo" class="logo">
    <h1>CUSTOMER FEEDBACK</h1>
  </div>
  <p>Your feedback helps us improve</p>
</header>

<!-- ===== MAIN CONTENT WRAPPER ===== -->
<div class="main-content">

  <section class="feedback-section">
    <div class="feedback-page">

      <form class="feedback-form" id="feedbackForm">
        <h2>Submit Your Feedback</h2>

        <input type="text" id="name" placeholder="Your Name" required>

        <select id="rating" required>
          <option value="">Rating</option>
          <option value="5">⭐⭐⭐⭐⭐</option>
          <option value="4">⭐⭐⭐⭐</option>
          <option value="3">⭐⭐⭐</option>
          <option value="2">⭐⭐</option>
          <option value="1">⭐</option>
        </select>

        <textarea id="message" placeholder="Your Feedback" required></textarea>

        <button type="submit">Submit Feedback</button>
      </form>

      <!-- POPUP CONTAINER -->
      <div id="popupContainer"></div>

      <div class="feedback-list">
        <h2>What Our Clients Say</h2>

        <div id="feedbackCards"></div>

        <!-- VIEW ALL BUTTON -->
        <div style="text-align:center; margin-top:20px;">
          <a href="all-reviews.html" class="view-all-btn">View All Reviews</a>
        </div>
      </div>

    </div>
  </section>

</div>
<!-- ===== END MAIN CONTENT ===== -->

<!-- WhatsApp Floating Button -->
<a class="whatsapp-float"
   href="https://wa.me/917994256121"
   target="_blank">
   WhatsApp Us
</a>

<!-- Social Floating Buttons -->
<div class="social-float">
  <a href="https://www.instagram.com/flywith_travelog_dmc/" target="_blank" class="social-btn instagram">
    <img src="instagram.svg" alt="Instagram">
  </a>
  <a href="https://www.facebook.com/profile.php?id=61578953265001" target="_blank" class="social-btn facebook">
    <img src="facebook.svg" alt="Facebook">
  </a>
</div>

<!-- Footer -->
<footer>
  © 2026 Travelog. All rights reserved.
</footer>

<script>
const popupContainer = document.getElementById("popupContainer");
const feedbackCards = document.getElementById("feedbackCards");

// Create stars
function makeStars(rating) {
  return "★".repeat(rating) + "☆".repeat(5 - rating);
}

// Show popup
function showPopup(feedback) {
  const popup = document.createElement("div");
  popup.className = "feedback-popup";

  let stars = makeStars(Number(feedback.rating));

  popup.innerHTML = `
    <strong>${feedback.name}</strong>
    <div class="stars">${stars}</div>
    <p>${feedback.message}</p>
  `;

  popupContainer.appendChild(popup);

  setTimeout(() => {
    popup.style.animation = "fadeOut 0.6s ease forwards";
    setTimeout(() => popup.remove(), 600);
  }, 5000);
}

// Example auto popup demo data
const demoFeedbacks = [
  { name: "Rahul Sharma", rating: 5, message: "Excellent service!" },
  { name: "Anita Patel", rating: 4, message: "Very smooth experience." },
  { name: "Mohammed Ali", rating: 5, message: "Best Vietnam partner!" }
];

let demoIndex = 0;

setInterval(() => {
  showPopup(demoFeedbacks[demoIndex]);
  demoIndex = (demoIndex + 1) % demoFeedbacks.length;
}, 6000);
</script>

</body>
</html>

</html>
