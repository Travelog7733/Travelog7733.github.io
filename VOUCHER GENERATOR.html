/* Formal booking voucher: restrained letterhead and tabular reservation details. */
.paper{font-family:"Bahnschrift","Trebuchet MS",Arial,sans-serif;color:#202b39;padding:42px 46px;min-height:1000px}
.voucher-top{align-items:start;border-bottom:2px solid #24364c;padding-bottom:20px;gap:22px}
.agency{font-size:26px;font-weight:700;color:#182b43;letter-spacing:.3px}
.issuer-contact{font-size:13px;line-height:1.7;color:#475569;white-space:pre-line}
.document-label{text-align:right;font-size:12px;line-height:1.7;letter-spacing:1.4px;color:#64748b}
.document-heading{text-align:center;padding:25px 0 22px}
.voucher-title{font-family:Cambria,"Palatino Linotype",serif;font-size:27px;line-height:1.3;font-weight:700;letter-spacing:.8px;margin:0 0 7px}
.document-subtitle{font-size:13px;line-height:1.6;color:#596579}
.booking-strip{display:grid;grid-template-columns:1.3fr 1fr;border:1px solid #cbd3dd;background:#f6f8fa;print-color-adjust:exact;-webkit-print-color-adjust:exact}
.booking-strip>div{padding:13px 16px;min-width:0}.booking-strip>div+div{border-left:1px solid #cbd3dd}
.booking-strip strong{display:block;font-size:16px;margin-top:7px;line-height:1.5}
.booking-strip .status{font-size:14px;text-transform:uppercase;letter-spacing:.6px}.status.confirmed{color:#215341}.status.pending{color:#486e99}.status.cancelled{color:#a12b2b}
.label{font-size:12px;letter-spacing:.6px;color:#556275;line-height:1.5}
.section-title{font-size:14px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;border-bottom:1px solid #aeb9c7;padding-bottom:8px;margin:23px 0 12px;color:#24364c;break-after:avoid}
.hotel-block{background:transparent;border:0;padding:0;margin:0}.hotel-name{font-size:23px;margin:0 0 6px;color:#202b39}.address{font-size:14px;line-height:1.6;color:#465468}.hotel-contact{font-size:13px;color:#465468;line-height:1.6}
.dates{border:1px solid #cbd3dd;padding:0;gap:0;grid-template-columns:1fr 1fr 110px}.dates>div{padding:13px 16px}.dates>div+div{border-left:1px solid #cbd3dd}.dates .value{font-size:16px;margin-top:5px}.small{font-size:12px;color:#596579}
.reservation-table{width:100%;border-collapse:collapse;font-size:14px;line-height:1.55;table-layout:fixed}.reservation-table th,.reservation-table td{border:1px solid #d4dae2;padding:9px 13px;vertical-align:top;text-align:left;overflow-wrap:anywhere}.reservation-table th{width:35%;font-weight:500;color:#4c596b;background:#f7f8fa;print-color-adjust:exact;-webkit-print-color-adjust:exact}.reservation-table td{font-weight:500;color:#202b39}.reservation-table tr{break-inside:avoid}
.notes{border:0;padding:0;font-size:13px;line-height:1.75;color:#465468}.footer{margin-top:30px;padding-top:12px;border-top:1px solid #aeb9c7;font-size:12px;line-height:1.6;color:#64748b;display:flex;justify-content:space-between}
@media(max-width:1050px){.paper{padding:28px}.voucher-title{font-size:24px}.dates{grid-template-columns:1fr 1fr}.nights{grid-column:span 2}.dates>.nights{border-left:0;border-top:1px solid #cbd3dd}}
@media(max-width:800px){.paper{padding:24px;min-height:0}.voucher-top{flex-wrap:wrap}.document-label{text-align:left}.booking-strip{grid-template-columns:1fr 1fr}.booking-strip>div{padding:12px}.voucher-title{font-size:24px;letter-spacing:.3px}}
@media(max-width:400px){.booking-strip{grid-template-columns:1fr}.booking-strip>div+div{border-left:0;border-top:1px solid #cbd3dd}.dates{grid-template-columns:1fr}.dates>div+div{border-left:0;border-top:1px solid #cbd3dd}.nights{grid-column:auto}.reservation-table th{width:42%}}
@media print{.paper{padding:5mm 6mm;min-height:0}.voucher-top{flex-wrap:nowrap}.document-label{text-align:right}.voucher-title{font-size:25px}.document-heading{padding:20px 0}.section-title{margin-top:18px}.booking-strip{grid-template-columns:1.3fr 1fr}.dates{grid-template-columns:1fr 1fr 110px}.dates>.nights{grid-column:auto;border-left:1px solid #cbd3dd;border-top:0}.footer{margin-top:22px}.notes,.booking-strip{break-inside:avoid}}

function prepareSinglePagePrint(){
  const paper=document.querySelector('#voucher');
  paper.style.removeProperty('--voucher-print-scale');
  paper.classList.add('print-layout');
  const ruler=document.createElement('div');
  ruler.style.cssText='position:absolute;visibility:hidden;width:1mm;height:1mm;';
  document.body.append(ruler);
  const pxPerMm=ruler.getBoundingClientRect().height;
  ruler.remove();
  const height=paper.getBoundingClientRect().height;
  const scale=Math.min(1,(275*pxPerMm)/height);
  paper.style.setProperty('--voucher-print-scale',String(scale));
}
