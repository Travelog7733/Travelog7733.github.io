<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Itinerary View | Travelog</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',sans-serif;}
body{background:#f1f5f9;padding:20px;}
.header-img{
  width:100%;height:300px;object-fit:cover;border-radius:16px;margin-bottom:20px;
}
.card{
  background:#fff;border-radius:16px;padding:20px;box-shadow:0 10px 25px rgba(0,0,0,0.1);
  max-width:900px;margin:auto;
}
h1{margin-bottom:10px;}
.info{margin-bottom:8px;color:#334155;}
.desc{margin-top:15px;white-space:pre-line;}
</style>
</head>
<body>

<img id="headerImage" class="header-img" src="" alt="Tour Image">

<div class="card">
  <h1 id="dest"></h1>
  <div class="info" id="customer"></div>
  <div class="info" id="createdBy"></div>
  <div class="info" id="dates"></div>
  <div class="desc" id="description"></div>
</div>

<script>
const data = JSON.parse(localStorage.getItem("currentItinerary"));

if(!data){
  alert("No itinerary found!");
  window.location.href = "create.html";
}

document.getElementById("dest").innerText = data.destination;
document.getElementById("customer").innerText = "Customer: " + data.customerName;
document.getElementById("createdBy").innerText = "Created by: " + data.createdBy;
document.getElementById("dates").innerText = "Dates: " + data.startDate + " to " + data.endDate;
document.getElementById("description").innerText = data.description;

// 🔥 Auto header image using free image source (based on destination)
const imgUrl = "https://source.unsplash.com/1600x900/?" + encodeURIComponent(data.destination + " travel");
document.getElementById("headerImage").src = imgUrl;
</script>

</body>
</html>
