<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Travelog | Employee Login</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',sans-serif;}
body{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  background:linear-gradient(135deg,#7dd3fc,#38bdf8,#0ea5e9);
}

.login-box{
  background:rgba(0,0,0,0.75);
  padding:30px;
  border-radius:16px;
  width:100%;
  max-width:380px;
  color:#fff;
  box-shadow:0 10px 25px rgba(0,0,0,0.3);
  text-align:center;
}

.login-box h2{
  margin-bottom:20px;
  letter-spacing:1px;
}

.login-box input{
  width:100%;
  padding:12px 14px;
  margin:10px 0;
  border:none;
  border-radius:8px;
  outline:none;
  font-size:15px;
}

.login-box button{
  width:100%;
  padding:12px;
  margin-top:15px;
  border:none;
  border-radius:8px;
  background:#38bdf8;
  color:#000;
  font-weight:600;
  font-size:16px;
  cursor:pointer;
}

.login-box button:hover{opacity:0.9;}

.error{
  margin-top:10px;
  color:#ff6b6b;
  display:none;
  font-size:14px;
}
</style>
</head>
<body>

<div class="login-box">
  <h2>Employee Login</h2>
  <form onsubmit="loginEmployee(event)">
    <input type="text" id="username" placeholder="Username" required>
    <input type="password" id="password" placeholder="Password" required>
    <button type="submit">Login</button>
    <div class="error" id="errorMsg">Invalid username or password</div>
  </form>
</div>

<script>
function loginEmployee(e){
  e.preventDefault();

  const user = document.getElementById("username").value;
  const pass = document.getElementById("password").value;

  const correctUser = "sales01";
  const correctPass = "Travelog01";

  if(user === correctUser && pass === correctPass){
    // Open dashboard page
    window.location.href = "dashboard.html";
  } else {
    document.getElementById("errorMsg").style.display = "block";
  }
}
</script>

</body>
</html>
