<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Employee Platform | Travelog</title>

<link rel="stylesheet" href="style.css">
<link rel="icon" href="images/icon.png" type="image/png">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

.top-logo{
position:fixed;
top:25px;
left:30px;
z-index:1000;
}

.top-logo img{
height:55px;
width:auto;
object-fit:contain;
}
  
.employee-page{
min-height:100vh;
display:flex;
align-items:center;
justify-content:center;
padding:40px 20px;

/* PREMIUM DARK BLUE + RED BACKGROUND */
background:
linear-gradient(135deg,
#071426 0%,
#0c1d38 35%,
#1b1030 65%,
#3b0b17 100%);

position:relative;
overflow:hidden;
}

/* RED GLOW */
.employee-page::before{
content:'';
position:absolute;
width:500px;
height:500px;
background:rgba(255,40,90,0.18);
border-radius:50%;
top:-180px;
right:-180px;
filter:blur(120px);
}

/* BLUE GLOW */
.employee-page::after{
content:'';
position:absolute;
width:450px;
height:450px;
background:rgba(0,140,255,0.15);
border-radius:50%;
bottom:-180px;
left:-180px;
filter:blur(120px);
}

.employee-box{
position:relative;
z-index:2;

background:rgba(255,255,255,0.08);
backdrop-filter:blur(18px);
-webkit-backdrop-filter:blur(18px);

padding:50px;
border-radius:24px;
text-align:center;
max-width:500px;
width:100%;

border:1px solid rgba(255,255,255,0.12);

box-shadow:
0 10px 40px rgba(0,0,0,0.4);

border-top:4px solid #ff3c5f;
}

.employee-box h1{
font-size:34px;
margin-bottom:15px;
color:#fff;
font-weight:700;
}

.employee-box p{
font-size:15px;
color:#d7d7d7;
margin-bottom:30px;
line-height:1.8;
}

.employee-btn{
display:inline-block;
padding:14px 30px;

background:
linear-gradient(135deg,#ff3c5f,#ff7a00);

color:#fff;
text-decoration:none;
border:none;
border-radius:50px;
font-weight:600;
font-size:15px;
cursor:pointer;
transition:0.3s ease;
width:100%;
max-width:320px;

box-shadow:
0 8px 20px rgba(255,60,95,0.35);
}

.employee-btn:hover{
transform:translateY(-3px);
box-shadow:
0 12px 28px rgba(255,60,95,0.45);
}

.password-input{
width:100%;
padding:14px 18px;

border-radius:14px;

border:1px solid rgba(255,255,255,0.15);

background:rgba(255,255,255,0.08);

color:#fff;

font-size:15px;
margin-bottom:15px;
outline:none;
box-sizing:border-box;
transition:0.3s ease;
}

.password-input::placeholder{
color:#bdbdbd;
}

.password-input:focus{
border-color:#ff4b6e;
box-shadow:0 0 0 4px rgba(255,75,110,0.12);
}

#error-msg{
color:#ff5b6e;
margin-top:15px;
display:none;
font-size:14px;
font-weight:500;
}

#password-section{
display:none;
margin-top:25px;
}

#itinerary-section{
display:none;
margin-top:30px;
}

@media(max-width:768px){

.top-logo{
top:18px;
left:18px;
}

.top-logo img{
height:42px;
}
  
.employee-box{
padding:35px 22px;
border-radius:20px;
}

.employee-box h1{
font-size:28px;
}

.employee-box p{
font-size:14px;
}

.employee-btn{
font-size:14px;
padding:13px 20px;
}

}

</style>

</head>

<body>

<div class="top-logo">
<img src="images/logo.png" alt="Travelog Logo">
</div>  
  
<div class="employee-page">

<div class="employee-box">

<h1>EMPLOYEE PLATFORM</h1>

<p>
Welcome to the Travelog Employee Portal.
Manage operations, bookings, customer support and internal services from one place.
</p>

<button class="employee-btn" onclick="showPasswordBox()">
LOGIN TO PLATFORM
</button>

<div id="password-section">

<input 
type="password" 
id="employeePassword" 
class="password-input"
placeholder="Enter Password">

<button class="employee-btn" onclick="validatePassword()">
SUBMIT
</button>

<p id="error-msg">
Incorrect Password
</p>

</div>

<div id="itinerary-section">

<a 
href="https://www.travelogdrop.online/Itinerary-Builder.html" 
target="_blank" 
class="employee-btn itinerary-builder-btn">
OPEN ITINERARY BUILDER
</a>

<br><br>

<a 
href="https://www.travelogdrop.online/guest-status.html" 
target="_blank" 
class="employee-btn guest-status-btn">
GUEST STATUS
</a>

<br><br>

<a 
href="https://www.travelogdrop.online/accounts.html" 
target="_blank" 
class="employee-btn accounts-platform-btn">
ACCOUNTS PLATFORM
</a>

<br><br>

<a 
href="https://www.travelogdrop.online/travelog_margin_checker.html" 
target="_blank" 
class="employee-btn profit-checker-btn">
PROFIT CHECKER
</a>

<br><br>

<button
class="employee-btn supplier-payment-details-btn"
onclick="openSupplierPayments()">
SUPPLIER PAYMENT STATUS
</button>

</div>

</div>

</div>

<script>

function showPasswordBox(){

document.getElementById("password-section").style.display = "block";

document.getElementById("employeePassword").focus();

}

function validatePassword(){

const password = document.getElementById("employeePassword").value;

if(password === "7733"){

document.getElementById("itinerary-section").style.display = "block";

document.getElementById("error-msg").style.display = "none";

}else{

document.getElementById("error-msg").style.display = "block";

document.getElementById("itinerary-section").style.display = "none";

}

}


document.getElementById("employeePassword")
.addEventListener("keypress", function(event){

if(event.key === "Enter"){

validatePassword();

}

});

<script>

function showPasswordBox(){

document.getElementById("password-section").style.display = "block";
document.getElementById("employeePassword").focus();

}

function validatePassword(){

const password = document.getElementById("employeePassword").value;

if(password === "7733"){

document.getElementById("itinerary-section").style.display = "block";
document.getElementById("error-msg").style.display = "none";

}else{

document.getElementById("error-msg").style.display = "block";
document.getElementById("itinerary-section").style.display = "none";

}

}

function openSupplierPayments(){

const supplierPassword = prompt(
"Enter Supplier Payment Access Password"
);

if(supplierPassword === "5655"){

window.open(
"https://www.travelogdrop.online/supplier_payment_details.html",
"_blank"
);

}else if(supplierPassword !== null){

alert("Incorrect Password");

}

}

document.getElementById("employeePassword")
.addEventListener("keypress", function(event){

if(event.key === "Enter"){

validatePassword();

}

});

</script>

</body>
</html>
