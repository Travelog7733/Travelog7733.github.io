<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Employee Platform | Travelog</title>

<link rel="stylesheet" href="style.css">
<link rel="icon" href="images/icon.png" type="image/png">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

.employee-page{
min-height:100vh;
display:flex;
align-items:center;
justify-content:center;
padding:40px 20px;
background:#f5f7fb;
font-family:'Poppins',sans-serif;
}

.employee-box{
background:#fff;
padding:50px;
border-radius:20px;
text-align:center;
max-width:500px;
width:100%;
box-shadow:0 10px 30px rgba(0,0,0,0.1);
border-top:5px solid #ff7a00;
}

.employee-box h1{
font-size:32px;
margin-bottom:15px;
color:#222;
}

.employee-box p{
font-size:16px;
color:#666;
margin-bottom:30px;
line-height:1.7;
}

.employee-btn{
display:inline-block;
padding:14px 30px;
background:#ff7a00;
color:#fff;
text-decoration:none;
border:none;
border-radius:40px;
font-weight:600;
font-size:16px;
cursor:pointer;
transition:0.3s ease;
width:100%;
max-width:320px;
}

.employee-btn:hover{
background:#e86e00;
transform:translateY(-2px);
}

.password-input{
width:100%;
padding:14px;
border-radius:12px;
border:1px solid #ccc;
font-size:16px;
margin-bottom:15px;
outline:none;
box-sizing:border-box;
}

#error-msg{
color:red;
margin-top:15px;
display:none;
font-size:14px;
}

#password-section{
display:none;
margin-top:25px;
}

#itinerary-section{
display:none;
margin-top:30px;
}

@media(max-width:768px){

.employee-box{
padding:35px 20px;
}

.employee-box h1{
font-size:28px;
}

.employee-btn{
font-size:15px;
padding:13px 20px;
}

}

</style>

</head>

<body>

<div class="employee-page">

<div class="employee-box">

<h1>Employee Platform</h1>

<p>
Welcome to the Travelog Employee Portal.
Manage operations, bookings, customer support and internal services from one place.
</p>

<button class="employee-btn" onclick="showPasswordBox()">
LOGIN TO PLATFORM
</button>

<div id="password-section">

<input 
type="password" 
id="employeePassword" 
class="password-input"
placeholder="Enter Password">

<button class="employee-btn" onclick="validatePassword()">
SUBMIT
</button>

<p id="error-msg">
Incorrect Password
</p>

</div>

<div id="itinerary-section">

<a 
href="https://www.travelogdrop.online/Itinerary-Builder/" 
target="_blank" 
class="employee-btn itinerary-builder-btn">
OPEN ITINERARY BUILDER
</a>

<br><br>

<a 
href="https://www.travelogdrop.online/guest-status.html" 
target="_blank" 
class="employee-btn guest-status-btn">
GUEST STATUS
</a>

<br><br>

<a 
href="https://www.travelogdrop.online/accounts.html" 
target="_blank" 
class="employee-btn accounts-platform-btn">
ACCOUNTS PLATFORM
</a>

<br><br>

<button 
class="employee-btn supplier-payments-btn"
onclick="openSupplierPayments()">
SUPPLIER PAYMENTS STATUS
</button>

<br><br>

<a 
href="https://www.travelogdrop.online/travelog_margin_checker.html" 
target="_blank" 
class="employee-btn profit-checker-btn">
PROFIT CHECKER
</a>

<br><br>

<a 
href="https://www.travelogdrop.online/supplier_payment_details.html" 
target="_blank" 
class="employee-btn supplier-payment-details-btn">
SUPPLIER PAYMENT STATUS
</a>

</div>

</div>

</div>

<script>

function showPasswordBox(){

document.getElementById("password-section").style.display = "block";

document.getElementById("employeePassword").focus();

}

function validatePassword(){

const password = document.getElementById("employeePassword").value;

if(password === "7733"){

document.getElementById("itinerary-section").style.display = "block";

document.getElementById("error-msg").style.display = "none";

}else{

document.getElementById("error-msg").style.display = "block";

document.getElementById("itinerary-section").style.display = "none";

}

}

function openSupplierPayments(){

const password = prompt(
"Enter Supplier Payments Password"
);

if(password === "5655"){

window.open(
"https://www.travelogdrop.online/supplier-payments.html",
"_blank"
);

}else{

alert("Incorrect Password");

}

}

document.getElementById("employeePassword")
.addEventListener("keypress", function(event){

if(event.key === "Enter"){

validatePassword();

}

});

</script>

</body>
</html>
