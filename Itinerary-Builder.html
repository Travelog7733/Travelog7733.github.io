<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Travelog Pro</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js"></script>

<style>
:root{
--navy:#0f2137;
--gold:#c9a84c;
--cream:#f8f5f0;
--white:#fff;
--border:#e2d9ce;
--red:#dc2626;
--muted:#6b7280;
--shadow:0 10px 30px rgba(0,0,0,.06);
}

*{margin:0;padding:0;box-sizing:border-box;}

body{
font-family:'DM Sans',sans-serif;
background:var(--cream);
color:var(--navy);
}

.hidden{display:none!important;}

.app{
display:grid;
grid-template-columns:280px 1fr;
min-height:100vh;
}

/* (rest of your CSS unchanged — trimmed for clarity) */

</style>

</head>

<body>

<!-- AUTH -->
<div id="authScreen" class="auth-screen">
<div class="auth-box">
<div class="auth-title">Travel<span style="color:#c9a84c">og</span></div>

<div class="grid">
<input type="email" id="authEmail" placeholder="Email">
<input type="password" id="authPassword" placeholder="Password">

<button onclick="login()">Login</button>
<button onclick="register()">Register</button>
</div>

</div>
</div>

<!-- APP -->
<div id="app" class="app hidden">

<!-- SIDEBAR + MAIN (UNCHANGED UI) -->

<!-- PRICING SECTION EXISTS HERE -->
<!-- grandTotal, adultPrice, childPrice, infantPrice etc -->

</div>

<div class="toast" id="toast"></div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-auth.js";
import { getFirestore, collection, addDoc, doc, deleteDoc, updateDoc, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-firestore.js";

/* FIREBASE */
const firebaseConfig = {
apiKey: "AIzaSyALSpB73XK5DiR2Ut59NSkKmalPkUGb49c",
authDomain: "travelog-itinerary.firebaseapp.com",
projectId: "travelog-itinerary",
storageBucket: "travelog-itinerary.firebasestorage.app",
messagingSenderId: "33567258851",
appId: "1:33567258851:web:790e8f165a3d917bf7edd6"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

/* STATE */
window.state = {
user:null,
logo:null,
editingId:null,
itineraries:[],
tours:[],
hotels:[],
visas:[],
currentItinerary:{days:[]}
};

/* ELEMENTS */
const authScreen = document.getElementById("authScreen");
const appScreen = document.getElementById("app");

/* TOAST */
function toast(msg){
const t = document.getElementById("toast");
t.innerText = msg;
t.classList.add("show");
setTimeout(()=>t.classList.remove("show"),2000);
}

/* =========================
   PRICING CALCULATION FIX
========================= */

function calculateTotal() {
const adultPriceVal = Number(adultPrice.value) || 0;
const childPriceVal = Number(childPrice.value) || 0;
const infantPriceVal = Number(infantPrice.value) || 0;

const adultQtyVal = Number(adultQty.value) || 0;
const childQtyVal = Number(childQty.value) || 0;
const infantQtyVal = Number(infantQty.value) || 0;

const total =
(adultPriceVal * adultQtyVal) +
(childPriceVal * childQtyVal) +
(infantPriceVal * infantQtyVal);

grandTotal.value = total;
}

/* attach listeners safely */
function attachPricingListeners() {
[
adultPrice,
childPrice,
infantPrice,
adultQty,
childQty,
infantQty
].forEach(el=>{
if(el){
el.addEventListener("input", calculateTotal);
}
});
}

/* AUTH STATE */
onAuthStateChanged(auth,(user)=>{

if(user){
state.user = user;
authScreen.classList.add("hidden");
appScreen.classList.remove("hidden");

loadCollections();

/* attach pricing after UI ready */
setTimeout(attachPricingListeners, 500);

}else{
state.user = null;
authScreen.classList.remove("hidden");
appScreen.classList.add("hidden");
}

});

/* LOGIN */
window.login = async()=>{
await signInWithEmailAndPassword(auth,authEmail.value,authPassword.value);
toast("Login successful");
};

/* REGISTER */
window.register = async()=>{
await createUserWithEmailAndPassword(auth,authEmail.value,authPassword.value);
toast("Account created");
};

/* LOGOUT */
window.logout = ()=>signOut(auth);

/* FIRESTORE LOAD */
function loadCollections(){
onSnapshot(collection(db,"itineraries"),snap=>{
state.itineraries=[];
snap.forEach(d=>{
state.itineraries.push({id:d.id,...d.data()});
});
renderItineraries();
});
}

/* SAVE ITINERARY */
window.saveItinerary = async()=>{

const data = {
customer:customerName.value,
destination:destination.value,
travelDate:travelDate.value,
currentDate:currentDate.value,
expiryDate:expiryDate.value,
status:itineraryStatus.value,

adultPrice:adultPrice.value,
childPrice:childPrice.value,
infantPrice:infantPrice.value,
grandTotal:grandTotal.value,

days:state.currentItinerary.days,
logo:state.logo || "",
updatedBy:state.user.email,
updatedAt:serverTimestamp()
};

if(state.editingId){
await updateDoc(doc(db,"itineraries",state.editingId),data);
toast("Updated");
}else{
await addDoc(collection(db,"itineraries"),data);
toast("Saved");
}
};

/* LOGO */
logoInput.addEventListener("change",(e)=>{
const file = e.target.files[0];
const reader = new FileReader();
reader.onload=()=>{
logoPreview.innerHTML=`<img src="${reader.result}">`;
state.logo = reader.result;
};
reader.readAsDataURL(file);
});

</script>

</body>
</html>
