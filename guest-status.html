<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Guest Status | Travelog</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
/* ===== YOUR EXISTING CSS (UNCHANGED) ===== */

*{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',sans-serif;}

body{background:#f5f7fb;padding:40px 20px;}

.status-wrapper{max-width:1400px;margin:auto;}

.page-title{text-align:center;font-size:38px;font-weight:700;margin-bottom:10px;color:#222;}

.page-subtitle{text-align:center;color:#666;margin-bottom:30px;}

.top-bar{display:flex;justify-content:center;margin-bottom:30px;}

.add-btn{background:#1D9E75;color:#fff;border:none;padding:14px 28px;border-radius:40px;font-size:16px;font-weight:600;cursor:pointer;}

.form-box{background:#fff;padding:30px;border-radius:24px;border:1px solid #E4ECE9;box-shadow:0 8px 30px rgba(0,0,0,.04);margin-bottom:30px;display:none;}

.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:18px;}

.input-field,select,textarea{width:100%;padding:14px;border-radius:12px;border:1px solid #dcdcdc;font-size:15px;}

.status-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(350px,1fr));gap:25px;}

.guest-tile{background:#fff;padding:25px;border-radius:24px;border:1px solid #E4ECE9;cursor:pointer;}

.tile-details{max-height:0;overflow:hidden;transition:.4s;}

.guest-tile.active .tile-details{max-height:5000px;margin-top:20px;}

.status-badge{padding:8px 16px;border-radius:999px;color:#fff;font-weight:700;font-size:13px;}

.confirmed{background:#00a86b;}
.pending{background:#ff9800;}
.completed{background:#0077ff;}

.detail{margin-bottom:14px;color:#555;}

.label{font-weight:700;color:#222;}

.amount{font-weight:700;color:#1D9E75;}

.card-actions{display:flex;gap:10px;margin-top:25px;}

.edit-btn{background:#0B3D91;color:#fff;padding:10px 16px;border:none;border-radius:10px;}
.delete-btn{background:#ff4d4f;color:#fff;padding:10px 16px;border:none;border-radius:10px;}
</style>

</head>

<body>

<div class="status-wrapper">

<h1 class="page-title">Guest Status</h1>

<div class="top-bar">
<button class="add-btn" onclick="toggleForm()">+ ADD NEW GUEST</button>
</div>

<div class="form-box" id="guestFormBox">

<div class="form-grid">

<input id="guestName" class="input-field" placeholder="Guest Name">
<input id="travelDate" class="input-field" placeholder="DD/MM/YYYY" oninput="formatDate(this);generateDates()">
<input id="salesPerson" class="input-field" placeholder="Sales Person">

<input id="invoiceAmount" class="input-field" placeholder="Invoice Amount">
<input id="amountReceived" class="input-field" placeholder="Amount Received">
<input id="balanceAmount" class="input-field" placeholder="Balance">

</div>

<div class="form-grid">

<select id="travelStatus" class="input-field">
<option>CONFIRMED</option>
<option>PENDING FOR CONFIRMATION</option>
<option>COMPLETED</option>
</select>

<select id="paymentStatus" class="input-field">
<option>ADVANCE PAID</option>
<option>PAYMENT PENDING</option>
<option>PAYMENT COMPLETED</option>
</select>

</div>

<button onclick="addGuest()" class="add-btn">SAVE</button>

</div>

<div id="guestContainer" class="status-grid"></div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-app.js";
import { getFirestore, collection, addDoc, deleteDoc, doc, onSnapshot, updateDoc } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-firestore.js";

const firebaseConfig = {
apiKey: "AIzaSyALSpB73XK5DiR2Ut59NSkKmalPkUGb49c",
authDomain: "travelog-itinerary.firebaseapp.com",
projectId: "travelog-itinerary",
storageBucket: "travelog-itinerary.firebasestorage.app",
messagingSenderId: "33567258851",
appId: "1:33567258851:web:790e8f165a3d917bf7edd6"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

window.db = db;
window.collection = collection;
window.addDoc = addDoc;
window.deleteDoc = deleteDoc;
window.doc = doc;
window.onSnapshot = onSnapshot;
window.updateDoc = updateDoc;

</script>

<script>

let editingId = null;

function formatDate(input){
let value = input.value.replace(/\D/g,'');
if(value.length>2)value=value.substring(0,2)+'/'+value.substring(2);
if(value.length>5)value=value.substring(0,5)+'/'+value.substring(5,9);
input.value=value;
}

function toggleForm(){
document.getElementById("guestFormBox").style.display =
document.getElementById("guestFormBox").style.display==="block"?"none":"block";
}

function parseDate(str){
if(!str) return new Date(9999,0,1);
const p = str.split('/');
return new Date(p[2],p[1]-1,p[0]);
}

async function addGuest(){

const guest = {
guestName:document.getElementById("guestName").value,
travelDate:document.getElementById("travelDate").value,
salesPerson:document.getElementById("salesPerson").value,
travelStatus:document.getElementById("travelStatus").value,
paymentStatus:document.getElementById("paymentStatus").value,
invoiceAmount:document.getElementById("invoiceAmount").value,
amountReceived:document.getElementById("amountReceived").value,
balanceAmount:document.getElementById("balanceAmount").value,
created:new Date().toISOString()
};

if(editingId){
await updateDoc(doc(db,"guestStatus",editingId),guest);
editingId=null;
alert("Updated");
}else{
await addDoc(collection(db,"guestStatus"),guest);
alert("Saved");
}

document.getElementById("guestFormBox").style.display="none";
}

function loadGuests(){

onSnapshot(collection(db,"guestStatus"),(snapshot)=>{

let guests=[];
snapshot.forEach(d=>{
guests.push({id:d.id,...d.data()});
});

window.allGuests = guests;

/* ===== SORT BY NEAREST DATE ===== */
guests.sort((a,b)=>parseDate(a.travelDate)-parseDate(b.travelDate));

let html="";

guests.forEach(g=>{

let badge="confirmed";
if(g.travelStatus==="PENDING FOR CONFIRMATION")badge="pending";
if(g.travelStatus==="COMPLETED")badge="completed";

html+=`

<div class="guest-tile" onclick="this.classList.toggle('active')">

<div>
<div style="font-size:22px;font-weight:700">${g.guestName||""}</div>
<div class="status-badge ${badge}">${g.travelStatus||""}</div>
</div>

<div class="tile-details">

<div class="detail"><span class="label">Date:</span> ${g.travelDate}</div>
<div class="detail"><span class="label">Sales:</span> ${g.salesPerson||""}</div>

<div class="detail"><span class="label">Invoice:</span> ₹${g.invoiceAmount||0}</div>
<div class="detail"><span class="label">Received:</span> ₹${g.amountReceived||0}</div>
<div class="detail"><span class="label">Balance:</span> ₹${g.balanceAmount||0}</div>

<div class="card-actions">
<button class="edit-btn" onclick="event.stopPropagation();editGuest('${g.id}')">Edit</button>
<button class="delete-btn" onclick="event.stopPropagation();deleteGuest('${g.id}')">Delete</button>
</div>

</div>
</div>

`;
});

document.getElementById("guestContainer").innerHTML=html;

});
}

async function editGuest(id){

const pass=prompt("Enter password");
if(pass!=="5655")return alert("Wrong password");

const g=window.allGuests.find(x=>x.id===id);
if(!g)return;

editingId=id;

document.getElementById("guestFormBox").style.display="block";

document.getElementById("guestName").value=g.guestName||"";
document.getElementById("travelDate").value=g.travelDate||"";
document.getElementById("salesPerson").value=g.salesPerson||"";
document.getElementById("invoiceAmount").value=g.invoiceAmount||"";
document.getElementById("amountReceived").value=g.amountReceived||"";
document.getElementById("balanceAmount").value=g.balanceAmount||"";
document.getElementById("travelStatus").value=g.travelStatus||"";
document.getElementById("paymentStatus").value=g.paymentStatus||"";
}

async function deleteGuest(id){

const pass=prompt("Enter password");
if(pass!=="5655")return;

if(!confirm("Delete?"))return;

await deleteDoc(doc(db,"guestStatus",id));
}

window.addEventListener("load",loadGuests);

</script>

</body>
</html>
