<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Guest Status | Travelog</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
background:#f5f7fb;
padding:40px 20px;
}

.status-wrapper{
max-width:1400px;
margin:auto;
}

.page-title{
text-align:center;
font-size:38px;
font-weight:700;
margin-bottom:10px;
color:#222;
}

.page-subtitle{
text-align:center;
color:#666;
margin-bottom:30px;
}

.top-bar{
display:flex;
justify-content:center;
margin-bottom:30px;
}

.add-btn{
background:#1D9E75;
color:#fff;
border:none;
padding:14px 28px;
border-radius:40px;
font-size:16px;
font-weight:600;
cursor:pointer;
transition:.3s;
}

.add-btn:hover{
background:#0F6E56;
transform:translateY(-2px);
}

.form-box{
background:#fff;
padding:30px;
border-radius:24px;
border:1px solid #E4ECE9;
box-shadow:0 8px 30px rgba(0,0,0,.04);
margin-bottom:30px;
display:none;
}

.form-grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:18px;
}

.input-field,
select,
textarea{
width:100%;
padding:14px;
border-radius:12px;
border:1px solid #dcdcdc;
font-size:15px;
outline:none;
}

.input-field:focus,
select:focus,
textarea:focus{
border-color:#1D9E75;
}

textarea{
resize:vertical;
min-height:120px;
}

.section-title{
font-size:20px;
font-weight:700;
margin-bottom:18px;
color:#222;
}

.sub-section{
margin-top:35px;
}

.add-small-btn{
margin-top:12px;
background:#1D9E75;
color:#fff;
border:none;
padding:10px 16px;
border-radius:10px;
cursor:pointer;
font-weight:600;
}

.save-btn{
margin-top:30px;
background:#1D9E75;
color:#fff;
border:none;
padding:15px 28px;
border-radius:40px;
font-size:16px;
font-weight:700;
cursor:pointer;
}

.status-grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(350px,1fr));
gap:25px;
}

.guest-tile{
background:#fff;
padding:25px;
border-radius:24px;
border:1px solid #E4ECE9;
box-shadow:0 8px 30px rgba(0,0,0,.04);
cursor:pointer;
transition:.3s;
overflow:hidden;
}

.guest-tile:hover{
transform:translateY(-4px);
}

.tile-head{
display:flex;
justify-content:space-between;
gap:20px;
}

.tile-details{
max-height:0;
overflow:hidden;
transition:.4s ease;
}

.guest-tile.active .tile-details{
max-height:5000px;
margin-top:20px;
}

.guest-name{
font-size:25px;
font-weight:700;
margin-bottom:6px;
}

.company-name{
font-size:13px;
font-weight:600;
color:#1D9E75;
margin-bottom:10px;
}

.status-badge{
display:inline-block;
padding:8px 16px;
border-radius:999px;
font-size:13px;
font-weight:700;
color:#fff;
}

.confirmed{
background:#00a86b;
}

.pending{
background:#ff9800;
}

.completed{
background:#0077ff;
}

.detail{
margin-bottom:14px;
line-height:1.7;
color:#555;
font-size:15px;
}

.label{
font-weight:700;
color:#222;
}

.card-date{
font-size:14px;
font-weight:600;
color:#666;
text-align:right;
}

.card-actions{
display:flex;
gap:10px;
margin-top:25px;
}

.edit-btn,
.delete-btn{
border:none;
padding:10px 16px;
border-radius:10px;
cursor:pointer;
font-weight:600;
color:#fff;
}

.edit-btn{
background:#0B3D91;
}

.delete-btn{
background:#ff4d4f;
}

.radio-group{
display:flex;
flex-wrap:wrap;
gap:14px;
margin-top:10px;
}

.radio-item{
display:flex;
align-items:center;
gap:6px;
background:#fff;
border:1px solid #ddd;
padding:10px 14px;
border-radius:12px;
}

.day-card,
.hotel-card{
background:#f9fbfb;
border:1px solid #E4ECE9;
padding:16px;
border-radius:16px;
margin-bottom:14px;
}

.day-title{
font-weight:700;
margin-bottom:12px;
color:#1D9E75;
}

.hotel-grid{
display:grid;
grid-template-columns:1fr 1fr 1fr;
gap:12px;
}

.amount{
font-weight:700;
color:#1D9E75;
}

.tile-block{
margin-top:18px;
padding-top:18px;
border-top:1px solid #eee;
}

.payment-circles{
display:flex;
gap:25px;
flex-wrap:wrap;
margin-top:20px;
}

.payment-circle{
width:130px;
height:130px;
border-radius:50%;
display:flex;
align-items:center;
justify-content:center;
text-align:center;
font-size:13px;
font-weight:700;
padding:10px;
line-height:1.5;
}

.advance-circle{
border:10px solid #1D9E75;
color:#1D9E75;
}

.balance-circle{
border:10px solid orange;
color:orange;
}

@media(max-width:768px){

.page-title{
font-size:30px;
}

.form-box{
padding:20px;
}

.tile-head{
flex-direction:column;
}

.hotel-grid{
grid-template-columns:1fr;
}

.payment-circle{
width:110px;
height:110px;
font-size:12px;
}

}

</style>

</head>

<body>

<div class="status-wrapper">

<h1 class="page-title">
Guest Status
</h1>

<p class="page-subtitle">
Track booking and payment status of guests
</p>

<div class="top-bar">

<button class="add-btn" onclick="toggleForm()">
+ ADD NEW GUEST
</button>

</div>

<div class="form-box" id="guestFormBox">

<div class="section-title">
Guest Details
</div>

<div class="form-grid">

<input
type="text"
id="guestName"
class="input-field"
placeholder="Guest Name">

<input
type="text"
id="companyName"
class="input-field"
placeholder="Company Name (Optional)">

<input
type="text"
id="salesPerson"
class="input-field"
placeholder="Sales Person">

<input
type="text"
id="destination"
class="input-field"
placeholder="Destination">

<input
type="text"
id="travelDate"
class="input-field"
placeholder="DD/MM/YYYY"
maxlength="10"
oninput="formatDate(this);generateDates()">

<input
type="number"
id="days"
class="input-field"
placeholder="No of Days">

<input
type="number"
id="guests"
class="input-field"
placeholder="No of Guests">

<select
id="travelStatus"
class="input-field">

<option>
CONFIRMED
</option>

<option>
PENDING FOR CONFIRMATION
</option>

<option>
COMPLETED
</option>

</select>

<select
id="paymentStatus"
class="input-field">

<option>
ADVANCE PAID
</option>

<option>
PAYMENT PENDING
</option>

<option>
PAYMENT COMPLETED
</option>

</select>

<input
type="number"
id="invoiceAmount"
class="input-field"
placeholder="₹ Total Invoice Amount"
oninput="calculatePayments()">

<input
type="number"
id="amountReceived"
class="input-field"
placeholder="₹ Amount Received"
oninput="calculatePayments()">

<input
type="text"
id="advancePending"
class="input-field"
placeholder="Advance Pending"
readonly>

<input
type="text"
id="balanceAmount"
class="input-field"
placeholder="Balance Receivable"
readonly>

</div>

<div class="sub-section">

<div class="section-title">
Visa Status
</div>

<div class="radio-group">

<label class="radio-item">
<input type="radio" name="visaStatus" value="PENDING FOR APPLYING" checked>
PENDING FOR APPLYING
</label>

<label class="radio-item">
<input type="radio" name="visaStatus" value="APPLIED BY CUSTOMER">
APPLIED BY CUSTOMER
</label>

<label class="radio-item">
<input type="radio" name="visaStatus" value="APPLIED">
APPLIED
</label>

<label class="radio-item">
<input type="radio" name="visaStatus" value="APPROVED">
APPROVED
</label>

<label class="radio-item">
<input type="radio" name="visaStatus" value="REJECTED">
REJECTED
</label>

<label class="radio-item">
<input type="radio" name="visaStatus" value="NOT REQUIRED">
NOT REQUIRED
</label>

</div>

</div>

<div class="sub-section">

<div class="section-title">
Hotel Status
</div>

<div id="hotelContainer">

<div class="hotel-card">

<div class="hotel-grid">

<input
type="text"
class="input-field hotel-place"
placeholder="Place">

<input
type="text"
class="input-field hotel-name"
placeholder="Hotel Name">

<select
class="input-field hotel-status">

<option>
BOOKED
</option>

<option>
BOOKED BY CUSTOMER
</option>

<option>
PENDING FOR BOOKING
</option>

</select>

</div>

</div>

</div>

<button
class="add-small-btn"
onclick="addHotel()">

+ Add Hotel

</button>

</div>

<div class="sub-section">

<div class="section-title">
Day-wise Itinerary
</div>

<div id="dayContainer">

<div class="day-card">

<div class="day-title">
Day 1 - <span class="auto-date"></span>
</div>

<textarea
class="input-field itinerary-text"
placeholder="Activity / Plans"></textarea>

</div>

</div>

<button
class="add-small-btn"
onclick="addDay()">

+ Add Day

</button>

</div>

<div class="sub-section">

<div class="section-title">
Notes
</div>

<textarea
id="inclusions"
placeholder="Notes / Inclusions"></textarea>

</div>

<button
class="save-btn"
onclick="addGuest()">

SAVE GUEST

</button>

</div>

<div
class="status-grid"
id="guestContainer"></div>

</div>

<script type="module">

import {
initializeApp
} from "https://www.gstatic.com/firebasejs/12.13.0/firebase-app.js";

import {
getFirestore,
collection,
addDoc,
deleteDoc,
doc,
onSnapshot,
updateDoc
}
from "https://www.gstatic.com/firebasejs/12.13.0/firebase-firestore.js";

const firebaseConfig = {

apiKey: "YOUR_API_KEY",

authDomain: "YOUR_AUTH_DOMAIN",

projectId: "YOUR_PROJECT_ID",

storageBucket: "YOUR_BUCKET",

messagingSenderId: "YOUR_MSG_ID",

appId: "YOUR_APP_ID"

};

const app = initializeApp(firebaseConfig);

const db = getFirestore(app);

window.db = db;
window.collection = collection;
window.addDoc = addDoc;
window.deleteDoc = deleteDoc;
window.doc = doc;
window.onSnapshot = onSnapshot;
window.updateDoc = updateDoc;

</script>

<script>

let editingId = null;
let dayCount = 1;

function calculatePayments(){

let invoice =
Number(
document.getElementById(
"invoiceAmount"
).value
) || 0;

let paid =
Number(
document.getElementById(
"amountReceived"
).value
) || 0;

let advanceRequired =
invoice * 0.60;

let balanceRequired =
invoice * 0.40;

let advancePending =
Math.max(
advanceRequired - paid,
0
);

document.getElementById(
"advancePending"
).value =
"₹ " +
advancePending.toLocaleString();

document.getElementById(
"balanceAmount"
).value =
"₹ " +
balanceRequired.toLocaleString();

}

function formatDate(input){

let value = input.value.replace(/\D/g,'');

if(value.length > 2){
value = value.substring(0,2) + '/' + value.substring(2);
}

if(value.length > 5){
value = value.substring(0,5) + '/' + value.substring(5,9);
}

input.value = value;

}

function toggleForm(){

const form =
document.getElementById("guestFormBox");

form.style.display =
form.style.display==="block"
? "none"
: "block";

}

function generateDates(){

const startDate =
document.getElementById("travelDate").value;

if(startDate.length !== 10) return;

const parts = startDate.split('/');

const baseDate = new Date(
parts[2],
parts[1]-1,
parts[0]
);

document.querySelectorAll(".day-card")
.forEach((card,index)=>{

const date = new Date(baseDate);

date.setDate(baseDate.getDate() + index);

const dd = String(date.getDate()).padStart(2,'0');
const mm = String(date.getMonth()+1).padStart(2,'0');
const yyyy = date.getFullYear();

card.querySelector(".auto-date").innerText =
`${dd}/${mm}/${yyyy}`;

});

}

function addDay(){

dayCount++;

document.getElementById("dayContainer")
.insertAdjacentHTML("beforeend",`

<div class="day-card">

<div class="day-title">
Day ${dayCount} -
<span class="auto-date"></span>
</div>

<textarea
class="input-field itinerary-text"
placeholder="Activity / Plans"></textarea>

</div>

`);

generateDates();

}

function addHotel(){

document.getElementById("hotelContainer")
.insertAdjacentHTML("beforeend",`

<div class="hotel-card">

<div class="hotel-grid">

<input
type="text"
class="input-field hotel-place"
placeholder="Place">

<input
type="text"
class="input-field hotel-name"
placeholder="Hotel Name">

<select
class="input-field hotel-status">

<option>
BOOKED
</option>

<option>
BOOKED BY CUSTOMER
</option>

<option>
PENDING FOR BOOKING
</option>

</select>

</div>

</div>

`);

}

async function addGuest(){

const visaStatus =
document.querySelector(
'input[name="visaStatus"]:checked'
).value;

const hotels =
[...document.querySelectorAll(".hotel-card")]
.map(card=>({

place:
card.querySelector(".hotel-place").value,

hotel:
card.querySelector(".hotel-name").value,

status:
card.querySelector(".hotel-status").value

}));

const itineraryDays =
[...document.querySelectorAll(".day-card")]
.map((card,index)=>({

day:index+1,

date:
card.querySelector(".auto-date").innerText,

activity:
card.querySelector(".itinerary-text").value

}));

const guest = {

guestName:
document.getElementById("guestName").value,

companyName:
document.getElementById("companyName").value,

salesPerson:
document.getElementById("salesPerson").value,

destination:
document.getElementById("destination").value,

travelDate:
document.getElementById("travelDate").value,

days:
document.getElementById("days").value,

guests:
document.getElementById("guests").value,

travelStatus:
document.getElementById("travelStatus").value,

paymentStatus:
document.getElementById("paymentStatus").value,

invoiceAmount:
document.getElementById("invoiceAmount").value,

amountReceived:
document.getElementById("amountReceived").value,

advancePending:
document.getElementById("advancePending").value,

balanceAmount:
document.getElementById("balanceAmount").value,

visaStatus,
hotels,
itineraryDays,

notes:
document.getElementById("inclusions").value,

created:
new Date().toISOString()

};

if(editingId){

await updateDoc(
doc(db,"guestStatus",editingId),
guest
);

alert("Guest Updated!");

editingId = null;

}else{

await addDoc(
collection(db,"guestStatus"),
guest
);

alert("Guest Saved!");

}

location.reload();

}

</script>

</body>

</html>
