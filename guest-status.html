<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Guest Status | Travelog</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
background:#f5f7fb;
padding:40px 20px;
}

.status-wrapper{
max-width:1400px;
margin:auto;
}

.page-title{
text-align:center;
font-size:38px;
font-weight:700;
margin-bottom:10px;
color:#222;
}

.page-subtitle{
text-align:center;
color:#666;
margin-bottom:30px;
}

.top-bar{
display:flex;
justify-content:center;
margin-bottom:30px;
}

.add-btn{
background:#1D9E75;
color:#fff;
border:none;
padding:14px 28px;
border-radius:40px;
font-size:16px;
font-weight:600;
cursor:pointer;
transition:.3s;
}

.add-btn:hover{
background:#0F6E56;
transform:translateY(-2px);
}

.form-box{
background:#fff;
padding:30px;
border-radius:24px;
border:1px solid #E4ECE9;
box-shadow:0 8px 30px rgba(0,0,0,.04);
margin-bottom:30px;
display:none;
}

.form-grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:18px;
}

.input-field,
select,
textarea{
width:100%;
padding:14px;
border-radius:12px;
border:1px solid #dcdcdc;
font-size:15px;
outline:none;
}

.input-field:focus,
select:focus,
textarea:focus{
border-color:#1D9E75;
}

textarea{
resize:vertical;
min-height:120px;
}

.section-title{
font-size:20px;
font-weight:700;
margin-bottom:18px;
color:#222;
}

.sub-section{
margin-top:35px;
}

.add-small-btn{
margin-top:12px;
background:#1D9E75;
color:#fff;
border:none;
padding:10px 16px;
border-radius:10px;
cursor:pointer;
font-weight:600;
}

.save-btn{
margin-top:30px;
background:#1D9E75;
color:#fff;
border:none;
padding:15px 28px;
border-radius:40px;
font-size:16px;
font-weight:700;
cursor:pointer;
}

.status-grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(350px,1fr));
gap:25px;
}

.guest-tile{
background:#fff;
padding:25px;
border-radius:24px;
border:1px solid #E4ECE9;
box-shadow:0 8px 30px rgba(0,0,0,.04);
cursor:pointer;
transition:.3s;
overflow:hidden;
}

.guest-tile:hover{
transform:translateY(-4px);
}

.tile-head{
display:flex;
justify-content:space-between;
gap:20px;
}

.tile-details{
max-height:0;
overflow:hidden;
transition:.4s ease;
}

.guest-tile.active .tile-details{
max-height:5000px;
margin-top:20px;
}

.guest-name{
font-size:25px;
font-weight:700;
margin-bottom:6px;
}

.company-name{
font-size:13px;
font-weight:600;
color:#1D9E75;
margin-bottom:10px;
}

.status-badge{
display:inline-block;
padding:8px 16px;
border-radius:999px;
font-size:13px;
font-weight:700;
color:#fff;
}

.confirmed{
background:#00a86b;
}

.pending{
background:#ff9800;
}

.completed{
background:#0077ff;
}

.detail{
margin-bottom:14px;
line-height:1.7;
color:#555;
font-size:15px;
}

.label{
font-weight:700;
color:#222;
}

.card-date{
font-size:14px;
font-weight:600;
color:#666;
text-align:right;
}

.card-actions{
display:flex;
gap:10px;
margin-top:25px;
}

.edit-btn,
.delete-btn{
border:none;
padding:10px 16px;
border-radius:10px;
cursor:pointer;
font-weight:600;
color:#fff;
}

.edit-btn{
background:#0B3D91;
}

.delete-btn{
background:#ff4d4f;
}

.radio-group{
display:flex;
flex-wrap:wrap;
gap:14px;
margin-top:10px;
}

.radio-item{
display:flex;
align-items:center;
gap:6px;
background:#fff;
border:1px solid #ddd;
padding:10px 14px;
border-radius:12px;
}

.day-card,
.hotel-card{
background:#f9fbfb;
border:1px solid #E4ECE9;
padding:16px;
border-radius:16px;
margin-bottom:14px;
}

.day-title{
font-weight:700;
margin-bottom:12px;
color:#1D9E75;
}

.hotel-grid{
display:grid;
grid-template-columns:1fr 1fr 1fr;
gap:12px;
}

.amount{
font-weight:700;
color:#1D9E75;
}

.tile-block{
margin-top:18px;
padding-top:18px;
border-top:1px solid #eee;
}

.remove-btn{
background:#ff4d4f;
color:#fff;
border:none;
padding:8px 14px;
border-radius:10px;
cursor:pointer;
font-size:13px;
font-weight:600;
margin-top:12px;
}

.remove-btn:hover{
opacity:.9;
}
  
@media(max-width:768px){

.page-title{
font-size:30px;
}

.form-box{
padding:20px;
}

.tile-head{
flex-direction:column;
}

.hotel-grid{
grid-template-columns:1fr;
}

}

</style>

</head>

<body>

<div class="status-wrapper">

<h1 class="page-title">
Guest Status
</h1>

<p class="page-subtitle">
Track booking and payment status of guests
</p>

<div class="top-bar">

<button class="add-btn" onclick="toggleForm()">
+ ADD NEW GUEST
</button>

</div>

<div class="form-box" id="guestFormBox">

<div class="section-title">

<div class="form-grid">

<input type="radio" name="visaStatus" value="APPROVED">

<div class="hotel-grid">

<input
type="text"
class="input-field cruise-place"
placeholder="Cruise Place">

<input
type="text"
class="input-field cruise-name"
placeholder="Cruise Name">

<select
class="input-field cruise-status">

<option>BOOKED</option>
<option>BOOKED BY CUSTOMER</option>

</div>

<script type="module">

import {
initializeApp
} from "https://www.gstatic.com/firebasejs/12.13.0/firebase-app.js";

import {
getFirestore,
collection,
addDoc,
deleteDoc,
doc,
onSnapshot,
updateDoc
}
from "https://www.gstatic.com/firebasejs/12.13.0/firebase-firestore.js";

const firebaseConfig = {

apiKey: "AIzaSyALSpB73XK5DiR2Ut59NSkKmalPkUGb49c",

authDomain: "travelog-itinerary.firebaseapp.com",

projectId: "travelog-itinerary",

storageBucket: "travelog-itinerary.firebasestorage.app",

messagingSenderId: "33567258851",

appId: "1:33567258851:web:790e8f165a3d917bf7edd6"

};

const app = initializeApp(firebaseConfig);

const db = getFirestore(app);

window.db = db;
window.collection = collection;
window.addDoc = addDoc;
window.deleteDoc = deleteDoc;
window.doc = doc;
window.onSnapshot = onSnapshot;
window.updateDoc = updateDoc;

</script>

<script>

let editingId = null;
let dayCount = 1;

function formatDate(input){

let value = input.value.replace(/\D/g,'');

if(value.length > 2){
value = value.substring(0,2) + '/' + value.substring(2);
}

if(value.length > 5){
value = value.substring(0,5) + '/' + value.substring(5,9);
}

input.value = value;

}
  
function calculateBalance(){

const invoice =
parseFloat(
document.getElementById("invoiceAmount").value
) || 0;

const received =
parseFloat(
document.getElementById("amountReceived").value
) || 0;

const balance = invoice - received;

document.getElementById(
"balanceAmount"
).value = balance;

}
function toggleForm(){

const form =
document.getElementById("guestFormBox");

form.style.display =
form.style.display==="block"
? "none"
: "block";

}

function generateDates(){

const startDate =
document.getElementById("travelDate").value;

if(startDate.length !== 10) return;

const parts = startDate.split('/');

const baseDate = new Date(
parts[2],
parts[1]-1,
parts[0]
);

document.querySelectorAll(".day-card")
.forEach((card,index)=>{

const date = new Date(baseDate);

date.setDate(baseDate.getDate() + index);

const dd = String(date.getDate()).padStart(2,'0');
const mm = String(date.getMonth()+1).padStart(2,'0');
const yyyy = date.getFullYear();

card.querySelector(".auto-date").innerText =
`${dd}/${mm}/${yyyy}`;

});

}

function addDay(){

dayCount++;

document.getElementById("dayContainer")
.insertAdjacentHTML("beforeend",`

<div class="day-card">

<div class="day-title">
Day ${dayCount} -
<span class="auto-date"></span>
</div>

<textarea
class="input-field itinerary-text"
placeholder="Activity / Plans"></textarea>

<button
type="button"
class="remove-btn"
onclick="removeDay(this)">
Remove Day
</button>

</div>

`);

generateDates();

}

function removeDay(button){

button.closest(".day-card").remove();

const allDays =
document.querySelectorAll(".day-card");

dayCount = 0;

allDays.forEach((card,index)=>{

dayCount++;

card.querySelector(".day-title").innerHTML =
`Day ${dayCount} -
<span class="auto-date"></span>`;

});

generateDates();

}

function addHotel(){

document.getElementById("hotelContainer")
.insertAdjacentHTML("beforeend",`

<div class="hotel-card">

<div class="hotel-grid">

<input
type="text"
class="input-field hotel-place"
placeholder="Place">

<input
type="text"
class="input-field hotel-name"
placeholder="Hotel Name">

<select
class="input-field hotel-status">

<option>BOOKED</option>
<option>BOOKED BY CUSTOMER</option>
<option>PENDING FOR BOOKING</option>

</select>

</div>

</div>

`);

}

function addCruise(){

document.getElementById(
"cruiseContainer"
).insertAdjacentHTML(

"beforeend",

`

<div class="hotel-card">

<div class="hotel-grid">

<input
class="input-field cruise-place"
placeholder="Cruise Place">

<input
class="input-field cruise-name"
placeholder="Cruise Name">

<select
class="input-field cruise-status">

<option>BOOKED</option>
<option>BOOKED BY CUSTOMER</option>
<option>PENDING FOR BOOKING</option>

</select>

</div>

</div>

`

);

}

async function addGuest(){

const visaStatus =
document.querySelector(
'input[name="visaStatus"]:checked'
).value;

const hotels =
[...document.querySelectorAll("#hotelContainer .hotel-card")]
.map(card=>({

place:
card.querySelector(".hotel-place").value,

hotel:
card.querySelector(".hotel-name").value,

status:
card.querySelector(".hotel-status").value

}));

const cruises =
[...document.querySelectorAll(".cruise-status")]
.map((item,index)=>({

place:
document.querySelectorAll(
".cruise-place"
)[index].value,

name:
document.querySelectorAll(
".cruise-name"
)[index].value,

status:
item.value

}));

const itineraryDays =
[...document.querySelectorAll(".day-card")]
.map((card,index)=>({

day:index+1,

date:
card.querySelector(".auto-date").innerText,

activity:
card.querySelector(".itinerary-text").value

}));

const guest = {

guestName:
document.getElementById("guestName").value,

companyName:
document.getElementById("companyName").value,

salesPerson:
document.getElementById("salesPerson").value,

destination:
document.getElementById("destination").value,

travelDate:
document.getElementById("travelDate").value,

days:
document.getElementById("days").value,

guests:
document.getElementById("guests").value,

travelStatus:
document.getElementById("travelStatus").value,

paymentStatus:
document.getElementById("paymentStatus").value,

invoiceAmount:
document.getElementById("invoiceAmount").value,

amountReceived:
document.getElementById("amountReceived").value,

balanceAmount:
document.getElementById("balanceAmount").value,

visaStatus,
hotels,
cruises,
itineraryDays,

notes:
document.getElementById("inclusions").value,

created:
new Date().toISOString()

};

if(editingId){

await updateDoc(
doc(db,"guestStatus",editingId),
guest
);

alert("Guest Updated!");

editingId = null;

}else{

await addDoc(
collection(db,"guestStatus"),
guest
);

alert("Guest Saved!");

}

document.getElementById("guestFormBox")
.style.display = "none";

}

function loadGuests(){

onSnapshot(collection(db,"guestStatus"),(snapshot)=>{

let guests = [];

snapshot.forEach((docItem)=>{
guests.push({
id:docItem.id,
...docItem.data()
});
});

// ✅ SINGLE CLEAN SORT: nearest date first
const parseDate = (d) => {
if(!d || !d.includes('/')) return new Date(9999, 11, 31);

const [dd, mm, yyyy] = d.split('/');
return new Date(yyyy, mm - 1, dd);
};

guests.sort((a, b) => parseDate(a.travelDate) - parseDate(b.travelDate));

window.allGuests = guests;

let html = "";

guests.forEach((g)=>{

let badge = "confirmed";

if(g.travelStatus === "PENDING FOR CONFIRMATION"){
badge = "pending";
}

if(g.travelStatus === "COMPLETED"){
badge = "completed";
}

let tripStage = "UPCOMING";
let tripStageClass = "pending";

if(g.itineraryDays && g.itineraryDays.length){

const today = new Date();

today.setHours(0,0,0,0);

const parseDate = (dateStr) => {

if(!dateStr || !dateStr.includes('/'))
return null;

const [dd, mm, yyyy] = dateStr.split('/');

return new Date(yyyy, mm - 1, dd);

};

const firstDay =
parseDate(g.itineraryDays[0].date);

const lastDay =
parseDate(
g.itineraryDays[g.itineraryDays.length - 1].date
);

if(firstDay && lastDay){

if(today > lastDay){

tripStage = "COMPLETED";
tripStageClass = "completed";

}
else if(today >= firstDay && today <= lastDay){

tripStage = "ONGOING";
tripStageClass = "confirmed";

}
else{

const diffTime =
firstDay - today;

const daysLeft =
Math.ceil(
diffTime / (1000 * 60 * 60 * 24)
);

tripStage =
`UPCOMING IN ${daysLeft} DAY${daysLeft > 1 ? "S" : ""}`;

tripStageClass = "pending";

}

}

}
  
html += `
<div class="guest-tile" onclick="this.classList.toggle('active')">

<div class="tile-head">

<div>

<div class="guest-name">
${g.guestName || ""}
</div>

${
g.companyName
? `<div class="company-name">🏢 ${g.companyName}</div>`
: ""
}

<div class="status-badge ${badge}">
${g.travelStatus || ""}
</div>

<div
class="status-badge ${tripStageClass}"
style="margin-top:10px;">
${tripStage}
</div>

</div>

<div class="card-date">
${g.travelDate || "-"} <br>
👤 ${g.salesPerson || "-"}
</div>

</div>

<div class="tile-details">

<div class="detail"><span class="label">Destination:</span> ${g.destination || ""}</div>

<div class="detail"><span class="label">Visa Status:</span> ${g.visaStatus || ""}</div>

<div class="detail"><span class="label">Guests:</span> ${g.guests || ""}</div>

<div class="detail"><span class="label">Payment:</span> ${g.paymentStatus || ""}</div>

<div class="detail"><span class="label">Invoice Amount:</span> <span class="amount">₹ ${g.invoiceAmount || 0}</span></div>

<div class="detail"><span class="label">Advance:</span> <span class="amount">₹ ${g.amountReceived || 0}</span></div>

<div class="detail"><span class="label">Balance:</span> <span class="amount">₹ ${g.balanceAmount || 0}</span></div>

<div class="tile-block">
<div class="label">Hotel Status</div><br>

${(g.hotels || []).map(h=>`
<div class="detail">
🏨 ${h.place || ""}<br>
Hotel: <b>${h.hotel || ""}</b><br>
Status: <b>${h.status || ""}</b>
</div>
`).join("")}

</div>

<div class="tile-block">
<div class="label">Cruise Status</div><br>

${(g.cruises || []).map(c=>`
<div class="detail">
🛳️ ${c.place || ""}<br>
Cruise: <b>${c.name || ""}</b><br>
Status: <b>${c.status || ""}</b>
</div>
`).join("")}

</div>

<div class="tile-block">
<div class="label">Day-wise Itinerary</div><br>

${(g.itineraryDays || []).map(d=>`
<div class="detail">
<b>Day ${d.day} - ${d.date}</b><br>
${d.activity || ""}
</div>
`).join("")}

</div>

<div class="tile-block">
<div class="label">Notes</div><br>
<div class="detail">${g.notes || ""}</div>
</div>

<div class="card-actions">

<button class="edit-btn"
onclick="event.stopPropagation(); editGuest('${g.id}')">
Edit
</button>

<button class="delete-btn"
onclick="event.stopPropagation(); deleteGuest('${g.id}')">
Delete
</button>

</div>

</div>

</div>
`;

});

document.getElementById("guestContainer").innerHTML = html;

});

}

async function editGuest(id){

const password =
prompt("Enter password");

if(password !== "5655"){

alert("Wrong password");
return;

}

editingId = id;

const guest =
window.allGuests.find(
g=>g.id===id
);

if(!guest) return;

document.getElementById(
"guestFormBox"
).style.display="block";

document.getElementById(
"guestName"
).value =
guest.guestName || "";

document.getElementById(
"companyName"
).value =
guest.companyName || "";

document.getElementById(
"salesPerson"
).value =
guest.salesPerson || "";

document.getElementById(
"destination"
).value =
guest.destination || "";

document.getElementById(
"travelDate"
).value =
guest.travelDate || "";

document.getElementById(
"days"
).value =
guest.days || "";

document.getElementById(
"guests"
).value =
guest.guests || "";

document.getElementById(
"travelStatus"
).value =
guest.travelStatus || "";

document.getElementById(
"paymentStatus"
).value =
guest.paymentStatus || "";

document.getElementById(
"invoiceAmount"
).value =
guest.invoiceAmount || "";

document.getElementById(
"amountReceived"
).value =
guest.amountReceived || "";

document.getElementById(
"balanceAmount"
).value =
guest.balanceAmount || "";

document.getElementById(
"inclusions"
).value =
guest.notes || "";

document.querySelectorAll(
'input[name="visaStatus"]'
).forEach(r=>{

r.checked =
r.value===guest.visaStatus;

});

document.getElementById(
"hotelContainer"
