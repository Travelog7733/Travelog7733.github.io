<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Guest Status | Travelog</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
background:#f5f7fb;
padding:40px 20px;
}

.status-wrapper{
max-width:1300px;
margin:auto;
}

.page-title{
text-align:center;
font-size:38px;
font-weight:700;
margin-bottom:10px;
color:#222;
}

.page-subtitle{
text-align:center;
color:#666;
margin-bottom:30px;
}

.top-bar{
display:flex;
justify-content:center;
margin-bottom:30px;
}

.add-btn{
background:#1D9E75;
color:#fff;
border:none;
padding:14px 28px;
border-radius:40px;
font-size:16px;
font-weight:600;
cursor:pointer;
transition:0.3s;
}

.add-btn:hover{
background:#0F6E56;
transform:translateY(-2px);
}

.form-box{
background:#fff;
padding:30px;
border-radius:20px;
margin-bottom:35px;
border:1px solid #E4ECE9;
box-shadow:0 8px 30px rgba(0,0,0,.04);
display:none;
}

.form-grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:18px;
}

.input-field,
textarea,
select{
width:100%;
padding:14px;
border-radius:12px;
border:1px solid #ccc;
font-size:15px;
outline:none;
}

textarea{
min-height:120px;
resize:vertical;
}

.save-btn{
margin-top:25px;
background:#1D9E75;
color:#fff;
border:none;
padding:14px 28px;
border-radius:35px;
font-size:16px;
font-weight:600;
cursor:pointer;
}

.status-grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(340px,1fr));
gap:25px;
}

.guest-tile{
background:#fff;
padding:25px;
border-radius:20px;
border:1px solid #E4ECE9;
box-shadow:0 8px 30px rgba(0,0,0,.04);
cursor:pointer;
transition:.3s;
overflow:hidden;
}

.guest-tile:hover{
transform:translateY(-4px);
}

.tile-head{
display:flex;
justify-content:space-between;
align-items:center;
gap:20px;
}

.tile-details{
max-height:0;
overflow:hidden;
transition:.4s ease;
margin-top:0;
}

.guest-tile.active .tile-details{
max-height:1500px;
margin-top:20px;
}

.guest-name{
font-size:24px;
font-weight:600;
margin-bottom:6px;
color:#222;
}

.company-name{
font-size:13px;
color:#1D9E75;
font-weight:600;
margin-bottom:12px;
}

.status-badge{
display:inline-block;
padding:8px 18px;
border-radius:30px;
font-size:14px;
font-weight:600;
color:#fff;
}

.confirmed{
background:#00a86b;
}

.pending{
background:#ff9800;
}

.completed{
background:#0077ff;
}

.detail{
margin-bottom:12px;
font-size:15px;
color:#555;
line-height:1.7;
}

.label{
font-weight:600;
color:#222;
}

.card-date{
font-size:14px;
font-weight:600;
color:#666;
}

.card-actions{
display:flex;
gap:10px;
margin-top:20px;
}

.delete-btn{
background:#ff4d4f;
color:#fff;
border:none;
padding:10px 16px;
border-radius:10px;
cursor:pointer;
font-weight:600;
}

.edit-btn{
background:#0b3d91;
color:#fff;
border:none;
padding:10px 16px;
border-radius:10px;
cursor:pointer;
font-weight:600;
}

@media(max-width:768px){

.page-title{
font-size:30px;
}

.form-box{
padding:20px;
}

.tile-head{
flex-direction:column;
align-items:flex-start;
}

}

</style>

</head>

<body>

<div class="status-wrapper">

<h1 class="page-title">
Guest Status
</h1>

<p class="page-subtitle">
Track booking and payment status of guests
</p>

<div class="top-bar">

<button class="add-btn" onclick="toggleForm()">
+ ADD NEW GUEST
</button>

</div>

<div class="form-box" id="guestFormBox">

<div class="form-grid">

<input
type="text"
id="guestName"
class="input-field"
placeholder="Guest Name">

<input
type="text"
id="companyName"
class="input-field"
placeholder="Company Name (Optional)">

<input
type="text"
id="destination"
class="input-field"
placeholder="Destination">

<input
type="date"
id="travelDate"
class="input-field">

<input
type="number"
id="days"
class="input-field"
placeholder="No of Days">

<input
type="number"
id="guests"
class="input-field"
placeholder="No of Guests">

<select
id="travelStatus"
class="input-field">

<option>CONFIRMED</option>
<option>PENDING FOR CONFIRMATION</option>
<option>COMPLETED</option>

</select>

<select
id="paymentStatus"
class="input-field">

<option>ADVANCE PAID</option>
<option>PAYMENT PENDING</option>
<option>PAYMENT COMPLETED</option>

</select>

<input
type="text"
id="amountReceived"
class="input-field"
placeholder="Amount Received">

<input
type="text"
id="balanceAmount"
class="input-field"
placeholder="Balance Receivable">

</div>

<br>

<textarea
id="itinerary"
placeholder="Day Wise Itinerary"></textarea>

<br><br>

<textarea
id="inclusions"
placeholder="Inclusions / Notes"></textarea>

<button
class="save-btn"
onclick="addGuest()">

SAVE GUEST

</button>

</div>

<div
class="status-grid"
id="guestContainer"></div>

</div>

<!-- FIREBASE -->

<script type="module">

import {
initializeApp
} from "https://www.gstatic.com/firebasejs/12.13.0/firebase-app.js";

import {
getFirestore,
collection,
addDoc,
deleteDoc,
doc,
onSnapshot,
query,
orderBy,
Timestamp,
updateDoc,
getDoc
}
from "https://www.gstatic.com/firebasejs/12.13.0/firebase-firestore.js";

const firebaseConfig = {

apiKey: "AIzaSyALSpB73XK5DiR2Ut59NSkKmalPkUGb49c",

authDomain: "travelog-itinerary.firebaseapp.com",

projectId: "travelog-itinerary",

storageBucket: "travelog-itinerary.firebasestorage.app",

messagingSenderId: "33567258851",

appId: "1:33567258851:web:790e8f165a3d917bf7edd6"

};

const app = initializeApp(firebaseConfig);

const db = getFirestore(app);

window.db = db;
window.collection = collection;
window.addDoc = addDoc;
window.deleteDoc = deleteDoc;
window.doc = doc;
window.onSnapshot = onSnapshot;
window.query = query;
window.orderBy = orderBy;
window.Timestamp = Timestamp;
window.updateDoc = updateDoc;
window.getDoc = getDoc;

</script>

<script>

let editingId = null;

/* TOGGLE FORM */

function toggleForm(){

const form =
document.getElementById("guestFormBox");

if(form.style.display==="block"){

form.style.display="none";

}else{

form.style.display="block";

}

}

/* SAVE / UPDATE */

async function addGuest(){

const guest = {

guestName:
document.getElementById("guestName").value,

companyName:
document.getElementById("companyName").value,

destination:
document.getElementById("destination").value,

travelDate:
document.getElementById("travelDate").value,

days:
document.getElementById("days").value,

guests:
document.getElementById("guests").value,

travelStatus:
document.getElementById("travelStatus").value,

paymentStatus:
document.getElementById("paymentStatus").value,

amountReceived:
document.getElementById("amountReceived").value,

balanceAmount:
document.getElementById("balanceAmount").value,

itinerary:
document.getElementById("itinerary").value,

inclusions:
document.getElementById("inclusions").value,

created:
Timestamp.now()

};

if(editingId){

await updateDoc(
doc(db,"guestStatus",editingId),
guest
);

alert("Guest Updated!");

editingId = null;

}else{

await addDoc(
collection(db,"guestStatus"),
guest
);

alert("Guest Saved!");

}

document
.querySelectorAll(
"#guestFormBox input,#guestFormBox textarea"
)
.forEach(i=>i.value="");

document.getElementById(
"travelStatus"
).selectedIndex = 0;

document.getElementById(
"paymentStatus"
).selectedIndex = 0;

}

/* LOAD GUESTS */

function loadGuests(){

const q =
query(
collection(db,"guestStatus"),
orderBy("travelDate","asc")
);

onSnapshot(q,(snapshot)=>{

let html = "";

snapshot.forEach((docItem)=>{

const g = docItem.data();

let badge = "confirmed";

if(
g.travelStatus==="PENDING FOR CONFIRMATION"
){
badge="pending";
}

if(
g.travelStatus==="COMPLETED"
){
badge="completed";
}

html += `

<div
class="guest-tile"
onclick="this.classList.toggle('active')"
>

<div class="tile-head">

<div>

<div class="guest-name">
${g.guestName}
</div>

${
g.companyName
?

`<div class="company-name">
🏢 ${g.companyName}
</div>`

:

""

}

<div class="status-badge ${badge}">
${g.travelStatus}
</div>

</div>

<div class="card-date">
${g.travelDate}
</div>

</div>

<div class="tile-details">

<div class="detail">
<span class="label">Destination:</span>
${g.destination}
</div>

<div class="detail">
<span class="label">No of Days:</span>
${g.days}
</div>

<div class="detail">
<span class="label">No of Guests:</span>
${g.guests}
</div>

<div class="detail">
<span class="label">Payment Status:</span>
${g.paymentStatus}
</div>

<div class="detail">
<span class="label">Amount Received:</span>
${g.amountReceived}
</div>

<div class="detail">
<span class="label">Balance Receivable:</span>
${g.balanceAmount}
</div>

<div class="detail">
<span class="label">Itinerary:</span>
<br>
${g.itinerary}
</div>

<div class="detail">
<span class="label">Notes:</span>
<br>
${g.inclusions}
</div>

<div class="card-actions">

<button
class="edit-btn"
onclick="
event.stopPropagation();
editGuest('${docItem.id}')
">

Edit

</button>

<button
class="delete-btn"
onclick="
event.stopPropagation();
deleteGuest('${docItem.id}')
">

Delete

</button>

</div>

</div>

</div>

`;

});

document.getElementById(
"guestContainer"
).innerHTML = html;

});

}

/* EDIT */

async function editGuest(id){

const password =
prompt("Enter password");

if(password!=="5655"){

alert("Wrong password");

return;

}

const snap =
await getDoc(
doc(db,"guestStatus",id)
);

const g = snap.data();

editingId = id;

document.getElementById(
"guestName"
).value =
g.guestName || "";

document.getElementById(
"companyName"
).value =
g.companyName || "";

document.getElementById(
"destination"
).value =
g.destination || "";

document.getElementById(
"travelDate"
).value =
g.travelDate || "";

document.getElementById(
"days"
).value =
g.days || "";

document.getElementById(
"guests"
).value =
g.guests || "";

document.getElementById(
"travelStatus"
).value =
g.travelStatus || "";

document.getElementById(
"paymentStatus"
).value =
g.paymentStatus || "";

document.getElementById(
"amountReceived"
).value =
g.amountReceived || "";

document.getElementById(
"balanceAmount"
).value =
g.balanceAmount || "";

document.getElementById(
"itinerary"
).value =
g.itinerary || "";

document.getElementById(
"inclusions"
).value =
g.inclusions || "";

document.getElementById(
"guestFormBox"
).style.display = "block";

window.scrollTo({
top:0,
behavior:"smooth"
});

}

/* DELETE */

async function deleteGuest(id){

const password =
prompt("Enter password");

if(password!=="5655"){

alert("Wrong password");

return;

}

if(!confirm("Delete Guest?")) return;

await deleteDoc(
doc(db,"guestStatus",id)
);

}

/* INIT */

window.addEventListener(
"load",
()=>{

loadGuests();

}
);

</script>

</body>
</html>
