<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Global Itinerary Maker</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --navy: #0d1b2a;
    --navy-mid: #162032;
    --navy-light: #1e2f44;
    --gold: #c9a84c;
    --gold-light: #e2c478;
    --gold-pale: #f5e9c8;
    --slate: #8fa0b4;
    --white: #ffffff;
    --off-white: #f8f6f1;
    --border: rgba(201,168,76,0.18);
    --shadow: 0 8px 40px rgba(13,27,42,0.18);
    --radius: 12px;
  }

  body {
    font-family: 'Poppins', sans-serif;
    background: var(--navy);
    color: var(--white);
    min-height: 100vh;
  }

  /* ── HEADER ── */
  header {
    background: linear-gradient(135deg, var(--navy) 0%, var(--navy-mid) 60%, #1a2a1a 100%);
    border-bottom: 1px solid var(--border);
    padding: 20px 40px;
    display: flex;
    align-items: center;
    gap: 16px;
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: 0 2px 24px rgba(0,0,0,0.3);
  }
  .logo-mark {
    width: 42px; height: 42px;
    background: linear-gradient(135deg, var(--gold), var(--gold-light));
    border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    font-size: 20px;
  }
  header h1 {
    font-family: 'Poppins', sans-serif;
    font-size: 22px;
    font-weight: 600;
    letter-spacing: 0.3px;
    color: var(--white);
  }
  header h1 span { color: var(--gold); }

  /* ── TABS ── */
  .tabs {
    display: flex;
    gap: 4px;
    padding: 20px 40px 0;
    border-bottom: 1px solid var(--border);
  }
  .tab-btn {
    padding: 10px 24px;
    border: none;
    background: transparent;
    color: var(--slate);
    font-family: 'Poppins', sans-serif;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    border-bottom: 2px solid transparent;
    transition: all 0.2s;
    letter-spacing: 0.3px;
  }
  .tab-btn.active {
    color: var(--gold);
    border-bottom-color: var(--gold);
  }
  .tab-btn:hover:not(.active) { color: var(--white); }

  .tab-panel { display: none; }
  .tab-panel.active { display: block; }

  /* ── MAIN LAYOUT ── */
  .container { max-width: 1000px; margin: 0 auto; padding: 36px 24px; }

  /* ── SECTION CARD ── */
  .card {
    background: var(--navy-light);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 28px 32px;
    margin-bottom: 20px;
  }
  .card-title {
    font-family: 'Poppins', sans-serif;
    font-size: 16px;
    font-weight: 600;
    color: var(--gold);
    margin-bottom: 20px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .card-title::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--border);
  }

  /* ── FORM ELEMENTS ── */
  .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .form-grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 16px; }
  .form-group { display: flex; flex-direction: column; gap: 6px; }
  .form-group.full { grid-column: 1 / -1; }

  label {
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.8px;
    color: var(--slate);
  }

  input[type="text"], input[type="date"], input[type="number"], select, textarea {
    background: var(--navy-mid);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 8px;
    color: var(--white);
    font-family: 'Poppins', sans-serif;
    font-size: 14px;
    padding: 10px 14px;
    outline: none;
    transition: border-color 0.2s;
    width: 100%;
  }
  input:focus, select:focus, textarea:focus {
    border-color: var(--gold);
  }
  input::placeholder, textarea::placeholder { color: var(--slate); }
  select option { background: var(--navy); }

  .searchable-wrapper { position: relative; }
  .searchable-input {
    width: 100%;
    background: var(--navy-mid);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 8px;
    color: var(--white);
    font-family: 'Poppins', sans-serif;
    font-size: 14px;
    padding: 10px 14px;
    outline: none;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: space-between;
    transition: border-color 0.2s;
  }
  .searchable-input:focus, .searchable-input.open { border-color: var(--gold); }
  .dropdown-panel {
    display: none;
    position: absolute;
    top: calc(100% + 4px);
    left: 0; right: 0;
    background: var(--navy-mid);
    border: 1px solid var(--gold);
    border-radius: 8px;
    z-index: 200;
    overflow: hidden;
    box-shadow: var(--shadow);
  }
  .dropdown-panel.open { display: block; }
  .dropdown-search {
    padding: 10px 14px;
    border-bottom: 1px solid var(--border);
    background: transparent;
    border-radius: 0;
    border-left: none; border-right: none; border-top: none;
  }
  .dropdown-list {
    max-height: 220px;
    overflow-y: auto;
    scrollbar-width: thin;
    scrollbar-color: var(--gold) transparent;
  }
  .dropdown-item {
    padding: 9px 14px;
    cursor: pointer;
    font-size: 13px;
    color: var(--white);
    transition: background 0.15s;
  }
  .dropdown-item:hover, .dropdown-item.selected { background: rgba(201,168,76,0.15); color: var(--gold-light); }

  /* ── PRICE TABLE ── */
  .price-table { width: 100%; border-collapse: collapse; }
  .price-table th {
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.8px;
    color: var(--slate);
    padding: 8px 10px;
    text-align: left;
    border-bottom: 1px solid var(--border);
  }
  .price-table td {
    padding: 10px 10px;
    vertical-align: middle;
  }
  .price-table td:first-child { font-size: 13px; font-weight: 500; color: var(--white); }
  .price-table input[type="number"] { text-align: right; }
  .total-cell {
    font-size: 14px;
    font-weight: 600;
    color: var(--gold-light);
    text-align: right;
  }
  .grand-total-row td {
    padding-top: 14px;
    border-top: 1px solid var(--border);
    font-family: 'Poppins', sans-serif;
    font-size: 16px;
    font-weight: 700;
    color: var(--gold);
  }

  /* ── DAY CARDS ── */
  .day-card {
    background: var(--navy-mid);
    border: 1px solid var(--border);
    border-radius: 10px;
    margin-bottom: 14px;
    overflow: hidden;
  }
  .day-header {
    background: linear-gradient(90deg, rgba(201,168,76,0.12), transparent);
    padding: 14px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    cursor: pointer;
    border-bottom: 1px solid var(--border);
  }
  .day-label {
    font-family: 'Poppins', sans-serif;
    font-size: 15px;
    font-weight: 600;
    color: var(--gold);
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .day-num {
    background: var(--gold);
    color: var(--navy);
    border-radius: 6px;
    width: 28px; height: 28px;
    display: flex; align-items: center; justify-content: center;
    font-family: 'Poppins', sans-serif;
    font-size: 12px;
    font-weight: 700;
  }
  .day-remove {
    background: rgba(255,80,80,0.1);
    border: 1px solid rgba(255,80,80,0.25);
    color: #ff6b6b;
    border-radius: 6px;
    padding: 4px 10px;
    font-size: 12px;
    cursor: pointer;
    font-family: 'Poppins', sans-serif;
    transition: background 0.2s;
  }
  .day-remove:hover { background: rgba(255,80,80,0.2); }
  .day-body { padding: 20px; display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .day-body .full { grid-column: 1 / -1; }
  .day-body textarea { resize: vertical; min-height: 80px; }
  .hotel-card {
    background: var(--navy-mid);
    border: 1px solid var(--border);
    border-radius: 10px;
    margin-bottom: 12px;
    overflow: hidden;
  }
  .hotel-body {
    padding: 18px 20px;
    display: grid;
    grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr) 180px auto;
    gap: 14px;
    align-items: end;
  }
  @media (max-width: 760px) {
    .hotel-body { grid-template-columns: 1fr; }
    .hotel-body .day-remove { justify-self: start; }
  }

  .pill-group { display: flex; gap: 8px; flex-wrap: wrap; }
  .pill {
    padding: 6px 14px;
    border-radius: 20px;
    border: 1px solid rgba(255,255,255,0.12);
    font-size: 12px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.18s;
    color: var(--slate);
    background: transparent;
    font-family: 'Poppins', sans-serif;
  }
  .pill.active { background: rgba(201,168,76,0.2); border-color: var(--gold); color: var(--gold-light); }

  /* ── BUTTONS ── */
  .btn-primary {
    background: linear-gradient(135deg, var(--gold), var(--gold-light));
    color: var(--navy);
    border: none;
    border-radius: 8px;
    padding: 12px 28px;
    font-family: 'Poppins', sans-serif;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: opacity 0.2s, transform 0.15s;
    letter-spacing: 0.3px;
  }
  .btn-primary:hover { opacity: 0.92; transform: translateY(-1px); }

  .btn-ghost {
    background: transparent;
    color: var(--gold);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 20px;
    font-family: 'Poppins', sans-serif;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    transition: background 0.2s;
  }
  .btn-ghost:hover { background: rgba(201,168,76,0.08); }

  .btn-add-day {
    width: 100%;
    border: 2px dashed rgba(201,168,76,0.3);
    background: transparent;
    border-radius: 10px;
    padding: 14px;
    color: var(--gold);
    font-family: 'Poppins', sans-serif;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    transition: background 0.2s, border-color 0.2s;
    letter-spacing: 0.3px;
  }
  .btn-add-day:hover { background: rgba(201,168,76,0.06); border-color: var(--gold); }

  .action-bar {
    display: flex;
    gap: 12px;
    margin-top: 24px;
    justify-content: flex-end;
  }

  /* ── LIBRARY ── */
  .library-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .itinerary-card {
    background: var(--navy-light);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 22px 24px;
    cursor: pointer;
    transition: border-color 0.2s, transform 0.15s;
    position: relative;
  }
  .itinerary-card:hover { border-color: var(--gold); transform: translateY(-2px); }
  .itinerary-card .ic-dest {
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.8px;
    color: var(--gold);
    margin-bottom: 6px;
  }
  .itinerary-card .ic-title {
    font-family: 'Poppins', sans-serif;
    font-size: 17px;
    font-weight: 600;
    color: var(--white);
    margin-bottom: 10px;
    line-height: 1.35;
  }
  .itinerary-card .ic-meta {
    font-size: 12px;
    color: var(--slate);
    display: flex;
    gap: 16px;
    flex-wrap: wrap;
    margin-bottom: 14px;
  }
  .ic-actions { display: flex; gap: 8px; flex-wrap: wrap; }
  .ic-btn {
    padding: 5px 14px;
    border-radius: 6px;
    font-size: 12px;
    font-weight: 500;
    cursor: pointer;
    font-family: 'Poppins', sans-serif;
    border: 1px solid;
    transition: background 0.2s;
  }
  .ic-btn.view { border-color: var(--gold); color: var(--gold); background: transparent; }
  .ic-btn.view:hover { background: rgba(201,168,76,0.12); }
  .ic-btn.edit { border-color: rgba(95,180,120,0.45); color: #7ee29a; background: transparent; }
  .ic-btn.edit:hover { background: rgba(95,180,120,0.12); }
  .ic-btn.pdf { border-color: rgba(255,255,255,0.15); color: var(--white); background: transparent; }
  .ic-btn.pdf:hover { background: rgba(255,255,255,0.06); }
  .ic-btn.del { border-color: rgba(255,80,80,0.25); color: #ff6b6b; background: transparent; }
  .ic-btn.del:hover { background: rgba(255,80,80,0.1); }

  .empty-state {
    text-align: center;
    padding: 60px 20px;
    color: var(--slate);
  }
  .empty-state .es-icon { font-size: 48px; margin-bottom: 16px; opacity: 0.4; }
  .empty-state p { font-size: 14px; }

  /* ── MODAL ── */
  .modal-overlay {
    display: none;
    position: fixed; inset: 0;
    background: rgba(13,27,42,0.85);
    backdrop-filter: blur(6px);
    z-index: 500;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .modal-overlay.open { display: flex; }
  .modal {
    background: var(--navy-light);
    border: 1px solid var(--border);
    border-radius: 16px;
    width: 100%;
    max-width: 700px;
    max-height: 90vh;
    overflow-y: auto;
    scrollbar-width: thin;
    scrollbar-color: var(--gold) transparent;
    box-shadow: 0 24px 80px rgba(0,0,0,0.5);
  }
  .modal-header {
    padding: 24px 28px 0;
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 16px;
  }
  .modal-close {
    background: rgba(255,255,255,0.06);
    border: none;
    color: var(--slate);
    border-radius: 6px;
    width: 30px; height: 30px;
    cursor: pointer;
    font-size: 18px;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
    margin-top: 2px;
  }
  .modal-close:hover { color: var(--white); }
  .modal-body { padding: 20px 28px 28px; }

  /* ═══════════════════════════════════════════════════════════════
     PDF LIGHT BLUE TEMPLATE
     Palette: Light Blue #EAF7FF · Sky Blue #4FA7D8 · White #FFFFFF
  ═══════════════════════════════════════════════════════════════ */
  .pdf-template {
    display: none;
    background: #F4FAFF;
    color: #14324A;
    font-family: 'Poppins', Segoe UI, sans-serif;
  }

  .pdf-page {
    width: min(980px, 100%);
    margin: 0 auto;
    background: #F4FAFF;
    padding: 36px;
  }

  /* ── COVER ── */
  .pdf-cover {
    position: relative;
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 24px;
    align-items: center;
    padding: 32px 36px;
    border-radius: 6px;
    overflow: hidden;
    background:
      linear-gradient(108deg, rgba(255,255,255,0.96) 0%, rgba(234,247,255,0.92) 55%, rgba(207,235,250,0.88) 100%),
      url("https://images.unsplash.com/photo-1528127269322-539801943592?auto=format&fit=crop&w=1400&q=80") center / cover;
    border: 1px solid rgba(79,167,216,0.28);
    box-shadow: 0 24px 60px rgba(36,112,154,0.16);
  }
  .pdf-cover::before {
    content: "";
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 4px;
    background: linear-gradient(180deg, #4FA7D8 0%, #9DD8F4 100%);
  }
  .pdf-cover::after {
    content: "";
    position: absolute;
    right: 0; top: 0;
    width: 120px; height: 120px;
    background: radial-gradient(circle at 100% 0%, rgba(79,167,216,0.18) 0%, transparent 65%);
    pointer-events: none;
  }

  .pdf-brand { display: flex; gap: 18px; align-items: center; }
  .pdf-logo-stack {
    display: grid;
    gap: 8px;
    align-items: start;
  }
  .pdf-logo {
    width: 220px;
    height: 72px;
    display: grid;
    place-items: center;
    background: transparent;
    border: 0;
    border-radius: 0;
    color: #24709A;
    font-weight: 600;
    overflow: hidden;
    padding: 0;
    font-size: 13px;
    letter-spacing: .06em;
    text-transform: uppercase;
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;
  }
  .pdf-logo img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    display: none;
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;
  }
  .pdf-logo.has-logo img { display: block; }
  .pdf-logo.has-logo span { display: none; }
  .pdf-brand-divider {
    width: 1px;
    height: 52px;
    background: linear-gradient(180deg, transparent, rgba(79,167,216,0.45), transparent);
  }

  /* Hide the PDF cover H2 header (Travel Itinerary Proposal) only on the cover */
  .pdf-cover .pdf-brand-text h2 {
    display: none !important;
  }

  .pdf-brand-text h2 {
    margin: 0;
    font-family: 'Poppins', sans-serif;
    font-size: 26px;
    color: #14324A;
    font-weight: 600;
    letter-spacing: .01em;
    line-height: 1.2;
  }
  .pdf-brand-text p {
    margin: 5px 0 0;
    color: #4FA7D8;
    font-size: 11px;
    font-weight: 400;
    letter-spacing: .12em;
    text-transform: uppercase;
  }

  .pdf-meta { text-align: right; }
  .pdf-meta strong {
    display: block;
    font-size: 20px;
    color: #24709A;
    font-weight: 600;
    letter-spacing: .04em;
  }
  .pdf-meta p {
    margin: 4px 0 0;
    color: #5B7C91;
    font-size: 11px;
    letter-spacing: .06em;
  }
  .pdf-contact {
    margin-top: 0;
    display: grid;
    gap: 3px;
    color: #14324A;
    font-size: 10.5px;
    font-weight: 500;
    letter-spacing: .02em;
  }
  .pdf-contact span {
    white-space: nowrap;
  }

  /* ── SECTION HEADINGS ── */
  .pdf-section { margin-top: 26px; break-inside: avoid; }
  .pdf-section h3 {
    margin: 0 0 12px;
    font-size: 17px;
    color: #14324A;
    font-weight: 700;
    letter-spacing: .06em;
    text-transform: uppercase;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .pdf-section h3::after {
    content: "";
    flex: 1;
    height: 1px;
    background: linear-gradient(90deg, #4FA7D8, transparent);
    opacity: 0.65;
  }

  /* ── INFO GRID ── */
  .pdf-info-grid {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    border: 1px solid rgba(79,167,216,0.28);
    border-radius: 6px;
    overflow: hidden;
    background: #ffffff;
    box-shadow: 0 4px 18px rgba(36,112,154,0.07);
  }
  .pdf-info {
    padding: 14px 16px;
    border-right: 1px solid rgba(79,167,216,0.24);
    min-height: 78px;
    background: #ffffff;
  }
  .pdf-info:last-child { border-right: 0; }
  .pdf-info span {
    display: block;
    color: #4FA7D8;
    font-size: 9.5px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: .1em;
  }
  .pdf-info strong {
    display: block;
    margin-top: 6px;
    font-size: 14px;
    overflow-wrap: anywhere;
    color: #14324A;
    font-weight: 500;
  }

  /* ── PRICE BOX ── */
  .pdf-price-box {
    display: grid;
    grid-template-columns: minmax(0, 1fr) 240px;
    gap: 16px;
    align-items: start;
  }
  .pdf-total {
    background: linear-gradient(135deg, #FFFFFF 0%, #EAF7FF 100%);
    border: 1px solid rgba(79,167,216,0.35);
    border-radius: 6px;
    padding: 22px 20px;
    box-shadow: 0 18px 42px rgba(36,112,154,0.14);
    position: relative;
    overflow: hidden;
  }
  .pdf-total::before {
    content: "";
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
    background: linear-gradient(90deg, #4FA7D8, #9DD8F4, transparent);
  }
  .pdf-total span {
    color: #24709A;
    font-size: 10px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: .1em;
  }
  .pdf-total strong {
    display: block;
    margin-top: 8px;
    font-size: 36px;
    color: #14324A;
    font-weight: 600;
    letter-spacing: .01em;
  }

  /* ── LINES / RATE TABLE ── */
  .pdf-lines {
    border: 1px solid rgba(79,167,216,0.28);
    border-radius: 6px;
    overflow: hidden;
    background: #ffffff;
    box-shadow: 0 4px 14px rgba(36,112,154,0.06);
  }
  .pdf-line {
    display: flex;
    justify-content: space-between;
    gap: 14px;
    padding: 10px 14px;
    border-bottom: 1px solid rgba(79,167,216,0.18);
    font-size: 13px;
    color: #14324A;
  }
  .pdf-line:last-child { border-bottom: 0; }

  .pdf-rate-table {
    border: 1px solid rgba(79,167,216,0.28);
    border-radius: 6px;
    overflow: hidden;
    background: #ffffff;
    box-shadow: 0 4px 14px rgba(36,112,154,0.06);
  }
  .pdf-rate-row {
    display: grid;
    grid-template-columns: 1fr 70px 120px 120px;
    gap: 10px;
    align-items: center;
    padding: 10px 14px;
    border-bottom: 1px solid rgba(79,167,216,0.18);
    font-size: 13px;
  }
  .pdf-rate-row:last-child { border-bottom: 0; }
  .pdf-rate-row.head {
    background: linear-gradient(90deg, #DDF2FF 0%, #F5FBFF 100%);
    color: #24709A;
    font-size: 10px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: .08em;
  }
  .pdf-rate-row strong { color: #14324A; font-weight: 600; }

  .pdf-hotel-list {
    border: 1px solid rgba(79,167,216,0.28);
    border-radius: 6px;
    overflow: hidden;
    background: #ffffff;
    box-shadow: 0 4px 14px rgba(36,112,154,0.06);
  }
  .pdf-hotel-row {
    display: grid;
    grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr) 120px;
    gap: 12px;
    align-items: center;
    padding: 11px 14px;
    border-bottom: 1px solid rgba(79,167,216,0.18);
    color: #31546A;
    font-size: 13px;
  }
  .pdf-hotel-row:last-child { border-bottom: 0; }
  .pdf-hotel-row.head {
    background: linear-gradient(90deg, #DDF2FF 0%, #F5FBFF 100%);
    color: #24709A;
    font-size: 10px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: .08em;
  }
  .pdf-hotel-row strong { color: #14324A; font-weight: 600; }

  /* ── DAY CARDS ── */
  .pdf-day {
    border: 1px solid rgba(79,167,216,0.28);
    border-radius: 6px;
    margin-bottom: 10px;
    overflow: hidden;
    break-inside: avoid;
    background: #ffffff;
    box-shadow: 0 3px 12px rgba(36,112,154,0.06);
  }
  .pdf-day-head {
    display: flex;
    justify-content: space-between;
    gap: 12px;
    padding: 11px 16px;
    background: linear-gradient(90deg, #DDF2FF 0%, #F5FBFF 100%);
    color: #24709A;
    font-weight: 600;
    font-size: 13px;
    letter-spacing: .02em;
  }
  .pdf-day-body {
    padding: 14px 16px;
    display: grid;
    gap: 7px;
    color: #31546A;
    font-size: 13px;
    line-height: 1.55;
  }
  .pdf-day-disks {
    display: flex;
    flex-wrap: wrap;
    gap: 7px;
    margin-top: 3px;
  }
  .pdf-day-disk {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    min-height: 24px;
    padding: 4px 10px;
    border-radius: 999px;
    border: 1px solid rgba(11,42,68,0.2);
    background: #0B2A44;
    color: #ffffff;
    font-size: 10.5px;
    font-weight: 600;
    letter-spacing: .04em;
    text-transform: uppercase;
  }
  .pdf-day-disk::before {
    content: "";
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: #59B878;
    box-shadow: 0 0 0 3px rgba(255,255,255,0.18);
    flex: 0 0 auto;
  }
  .pdf-day-disk.meal {
    background: #2E8B57;
    border-color: rgba(46,139,87,0.25);
  }
  .pdf-day-disk.transfer {
    background: #0B2A44;
    border-color: rgba(11,42,68,0.25);
  }

  /* ── FOOTER ── */
  .pdf-footer {
    margin-top: 36px;
    padding-top: 14px;
    border-top: 1px solid rgba(79,167,216,0.3);
    color: #5B7C91;
    font-size: 11px;
    display: flex;
    justify-content: space-between;
    gap: 18px;
    letter-spacing: .03em;
  }

  @media print {
    @page { size: A4; margin: 12mm; }
    .tabs, body > header, .tab-panel, .toast, #sync-status { display: none !important; }
    .pdf-template { display: block !important; }
    .pdf-cover { display: grid !important; }
    .pdf-page { width: 100%; padding: 0; }
    .pdf-info-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .pdf-price-box { grid-template-columns: 1fr; }
    body { background: #F4FAFF; }
  }

  /* ── TOAST ── */
  .toast {
    position: fixed; bottom: 30px; right: 30px;
    background: var(--navy-light);
    border: 1px solid var(--gold);
    color: var(--white);
    padding: 12px 20px;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 500;
    box-shadow: var(--shadow);
    z-index: 999;
    transform: translateY(80px);
    opacity: 0;
    transition: all 0.3s cubic-bezier(0.34,1.56,0.64,1);
  }
  .toast.show { transform: translateY(0); opacity: 1; }

  /* scrollbar */
  ::-webkit-scrollbar { width: 5px; height: 5px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: rgba(201,168,76,0.3); border-radius: 10px; }
</style>
</head>
<body>

<header>
  <div class="logo-mark">✈</div>
  <h1>Global <span>Itinerary</span> Maker</h1>
</header>

<div class="tabs">
  <button class="tab-btn active" onclick="switchTab('create')">✦ Create Itinerary</button>
  <button class="tab-btn" onclick="switchTab('library')">☰ Itinerary Library</button>
</div>

<!-- ══ TAB: CREATE ══ -->
<div id="tab-create" class="tab-panel active">
<div class="container">

  <!-- Basic Info -->
  <div class="card">
    <div class="card-title">Trip Details</div>
    <div class="form-grid">
      <div class="form-group">
        <label>Itinerary Title</label>
        <input type="text" id="itin-title" placeholder="e.g. Golden Triangle Explorer" />
      </div>
      <div class="form-group">
        <label>Destination / Country</label>
        <div class="searchable-wrapper">
          <div class="searchable-input" id="dest-display" tabindex="0" onclick="toggleDropdown('dest-dd')">
            <span id="dest-text" style="color:var(--slate)">Select destination…</span>
            <span style="color:var(--gold);font-size:10px">▼</span>
          </div>
          <div class="dropdown-panel" id="dest-dd">
            <input class="dropdown-search" type="text" placeholder="Search country…" oninput="filterDropdown(this,'dest-list','dest-dd','dest-text','dest-val')" />
            <div class="dropdown-list" id="dest-list"></div>
          </div>
          <input type="hidden" id="dest-val" />
        </div>
      </div>
      <div class="form-group">
        <label>Validity Date (Optional)</label>
        <input type="date" id="itin-validity" />
      </div>
      <div class="form-group">
        <label>Currency</label>
        <div class="searchable-wrapper">
          <div class="searchable-input" id="curr-display" tabindex="0" onclick="toggleDropdown('curr-dd')">
            <span id="curr-text" style="color:var(--slate)">Select currency…</span>
            <span style="color:var(--gold);font-size:10px">▼</span>
          </div>
          <div class="dropdown-panel" id="curr-dd">
            <input class="dropdown-search" type="text" placeholder="Search currency…" oninput="filterDropdown(this,'curr-list','curr-dd','curr-text','curr-val')" />
            <div class="dropdown-list" id="curr-list"></div>
          </div>
          <input type="hidden" id="curr-val" />
        </div>
      </div>
    </div>
  </div>

  <!-- Pricing -->
  <div class="card">
    <div class="card-title">Pricing</div>
    <table class="price-table">
      <thead>
        <tr>
          <th>Pax Type</th>
          <th>Count</th>
          <th>Rate per Person</th>
          <th style="text-align:right">Total</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td>👤 Adult</td>
          <td><input type="number" id="p-adult-count" min="0" value="2" style="width:70px" onchange="calcPricing()" oninput="calcPricing()" /></td>
          <td><input type="number" id="p-adult-rate" min="0" value="0" style="width:120px" placeholder="0.00" onchange="calcPricing()" oninput="calcPricing()" /></td>
          <td class="total-cell" id="p-adult-total">0.00</td>
        </tr>
        <tr>
          <td>🧒 Child</td>
          <td><input type="number" id="p-child-count" min="0" value="0" style="width:70px" onchange="calcPricing()" oninput="calcPricing()" /></td>
          <td><input type="number" id="p-child-rate" min="0" value="0" style="width:120px" placeholder="0.00" onchange="calcPricing()" oninput="calcPricing()" /></td>
          <td class="total-cell" id="p-child-total">0.00</td>
        </tr>
        <tr>
          <td>👶 Infant</td>
          <td><input type="number" id="p-infant-count" min="0" value="0" style="width:70px" onchange="calcPricing()" oninput="calcPricing()" /></td>
          <td><input type="number" id="p-infant-rate" min="0" value="0" style="width:120px" placeholder="0.00" onchange="calcPricing()" oninput="calcPricing()" /></td>
          <td class="total-cell" id="p-infant-total">0.00</td>
        </tr>
      </tbody>
      <tfoot>
        <tr class="grand-total-row">
          <td colspan="3">Grand Total</td>
          <td class="total-cell" id="p-grand">0.00</td>
        </tr>
      </tfoot>
    </table>
  </div>

  <!-- rest of file omitted for brevity in editor -->

</div>
</div>

</body>
</html>
